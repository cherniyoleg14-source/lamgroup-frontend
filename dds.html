<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ДДС | LamGroup</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F8FAFC; --card: #FFFFFF; --text: #0F172A; --text-secondary: #64748B;
            --border: #E2E8F0; --gold: #F59E0B; --primary: #0F172A; --success: #10B981;
            --danger: #EF4444; --warning: #F59E0B; --info: #3B82F6;
            --shadow: 0 4px 16px rgba(0,0,0,0.06); --radius: 16px; --radius-lg: 24px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: linear-gradient(180deg, #F8FAFC 0%, #F1F5F9 100%); min-height: 100vh; -webkit-font-smoothing: antialiased; padding: 16px; }
        .container { max-width: 600px; margin: 0 auto; }
        
        .app-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; margin-bottom: 16px; background: rgba(255,255,255,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: var(--radius-lg); box-shadow: var(--shadow); border: 1px solid rgba(226,232,240,0.5); }
        .app-header h1 { font-size: 22px; font-weight: 800; background: linear-gradient(135deg, #0F172A, #1E293B); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: -0.5px; }
        .badge { padding: 6px 14px; border-radius: 30px; font-size: 12px; font-weight: 600; }
        .badge-dark { background: var(--primary); color: white; }
        
        .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
        .kpi-card { background: var(--card); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); border: 1px solid rgba(226,232,240,0.5); }
        .kpi-card.income { border-left: 4px solid var(--success); }
        .kpi-card.plan { border-left: 4px solid var(--info); }
        .kpi-card.expense { border-left: 4px solid var(--danger); }
        .kpi-card.payout { border-left: 4px solid var(--warning); }
        .kpi-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; font-weight: 600; color: var(--text-secondary); }
        .kpi-value { font-size: 22px; font-weight: 800; color: var(--text); }
        
        .calendar-section { background: white; border-radius: var(--radius-lg); padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .calendar-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; margin-bottom: 6px; }
        .weekday { font-size: 10px; font-weight: 600; color: var(--text-secondary); padding: 4px 0; text-transform: uppercase; }
        .calendar-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
        .calendar-day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 10px; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.2s; background: #F8FAFC; position: relative; }
        .calendar-day:hover { background: #E2E8F0; }
        .calendar-day.other-month { color: #94A3B8; }
        .calendar-day.today { background: var(--primary); color: white; font-weight: 700; }
        .calendar-day.has-income { border: 2px solid var(--success); }
        .calendar-day.has-expense { border: 2px solid var(--danger); }
        .calendar-day.has-both { border: 2px solid var(--warning); }
        .day-amount { font-size: 7px; font-weight: 700; margin-top: 1px; white-space: nowrap; }
        .calendar-legend { display: flex; gap: 12px; margin-top: 10px; justify-content: center; font-size: 10px; }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 4px; }
        
        .tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--border); margin-bottom: 16px; overflow-x: auto; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab { padding: 10px 14px; background: none; border: none; font-size: 13px; font-weight: 600; color: var(--text-secondary); cursor: pointer; white-space: nowrap; border-bottom: 3px solid transparent; transition: all 0.2s; }
        .tab.active { color: var(--text); border-bottom-color: var(--gold); }
        .tab-content { display: none; } .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        .filter-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
        .form-select { flex: 1; min-width: 140px; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 13px; background: white; font-family: inherit; }
        .btn { padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 4px; }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: linear-gradient(135deg, #0F172A, #1E293B); color: white; width: 100%; }
        .btn-success { background: #D1FAE5; color: #065F46; }
        .btn-danger { background: #FEE2E2; color: #991B1B; }
        .btn-outline { background: white; border: 1.5px solid var(--border); color: var(--text); }
        .btn-sm { padding: 5px 10px; font-size: 11px; border-radius: 8px; }
        
        .form-group { margin-bottom: 14px; }
        .form-label { font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 4px; }
        .form-input { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 13px; background: white; font-family: inherit; }
        .form-input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(245,158,11,0.1); }
        
        .card { background: var(--card); border-radius: var(--radius-lg); padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); border: 1px solid rgba(226,232,240,0.5); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .hidden { display: none !important; }
        .loading { text-align: center; padding: 40px; color: var(--text-secondary); }
        .empty-state { text-align: center; padding: 40px 20px; background: white; border-radius: var(--radius-lg); color: var(--text-secondary); border: 2px dashed var(--border); }
        
        .summary-table { width: 100%; border-collapse: collapse; font-size: 11px; }
        .summary-table th { background: #F8FAFC; padding: 8px 6px; text-align: left; font-weight: 600; font-size: 10px; color: var(--text-secondary); border-bottom: 2px solid var(--border); }
        .summary-table td { padding: 8px 6px; border-bottom: 1px solid var(--border); }
        .summary-table tr:hover { background: #F8FAFC; }
        
        .transaction-item { background: white; border-radius: var(--radius); padding: 12px; margin-bottom: 8px; border: 1px solid var(--border); }
        .transaction-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; flex-wrap: wrap; gap: 6px; }
        .transaction-title { font-weight: 600; font-size: 13px; }
        .transaction-amount { font-weight: 700; font-size: 16px; }
        .amount-income { color: var(--success); } .amount-expense { color: var(--danger); } .amount-plan { color: var(--info); }
        .transaction-meta { font-size: 11px; color: var(--text-secondary); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
        
        .tag { padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 600; }
        .tag-green { background: #D1FAE5; color: #065F46; } .tag-yellow { background: #FEF3C7; color: #92400E; }
        .tag-blue { background: #DBEAFE; color: #1E40AF; } .tag-red { background: #FEE2E2; color: #991B1B; }
        
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 10000; }
        .modal-content { background: white; border-radius: var(--radius-lg); padding: 20px; max-width: 500px; width: 90%; max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.15); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .modal-title { font-size: 18px; font-weight: 800; }
        .modal-close { width: 32px; height: 32px; border-radius: 50%; background: #F1F5F9; border: none; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="app-header"><h1>💰 Движение средств</h1><span class="badge badge-dark" id="role-badge">Загрузка...</span></div>
        
        <!-- KPI -->
        <div class="kpi-grid">
            <div class="kpi-card income"><div class="kpi-label">💰 Приход (зашло)</div><div class="kpi-value" id="kpi-income" style="color:var(--success);">0 ₸</div></div>
            <div class="kpi-card plan"><div class="kpi-label">📥 План поступлений</div><div class="kpi-value" id="kpi-plan-income" style="color:var(--info);">0 ₸</div></div>
            <div class="kpi-card expense"><div class="kpi-label">📤 Расходы (оплач.)</div><div class="kpi-value" id="kpi-expense" style="color:var(--danger);">0 ₸</div></div>
            <div class="kpi-card payout"><div class="kpi-label">👷 Выплаты (оплач.)</div><div class="kpi-value" id="kpi-payouts" style="color:var(--warning);">0 ₸</div></div>
        </div>
        
        <!-- Календарь -->
        <div class="calendar-section">
            <div class="calendar-header">
                <span id="calendar-month-year" style="font-weight:700;font-size:15px;">Май 2026</span>
                <div style="display:flex;gap:6px;">
                    <button class="btn btn-outline btn-sm" id="prev-month">←</button>

                <button class="btn btn-sm btn-outline income-filter-btn active" data-filter="all">Все</button>
                <button class="btn btn-sm btn-outline income-filter-btn" data-filter="paid">✅ Оплаченные</button>
                <button class="btn btn-sm btn-outline income-filter-btn" data-filter="pending">⏳ Ожидаются</button>
            </div>

        <!-- Расходы -->
        <div id="tab-expense" class="tab-content">
            <button class="btn btn-primary" id="show-expense-form" style="margin-bottom:12px;">➕ Создать расход</button>
            <div id="expense-filter" style="display:flex;gap:6px;margin-bottom:12px;">
                <button class="btn btn-sm btn-outline expense-filter-btn active" data-filter="all">Все</button>
                <button class="btn btn-sm btn-outline expense-filter-btn" data-filter="paid">💳 Оплаченные</button>
                <button class="btn btn-sm btn-outline expense-filter-btn" data-filter="pending">📅 План</button>
            </div>
            <div id="expense-list"></div>
        </div>
        
        <!-- Выплаты -->
        <div id="tab-payouts" class="tab-content">
            <div id="payouts-filter" style="display:flex;gap:6px;margin-bottom:12px;">
                <button class="btn btn-sm btn-outline payouts-filter-btn active" data-filter="all">Все</button>
                <button class="btn btn-sm btn-outline payouts-filter-btn" data-filter="paid">✅ Оплаченные</button>
                <button class="btn btn-sm btn-outline payouts-filter-btn" data-filter="pending">📅 План</button>
            </div>
            <div id="payouts-list"></div>
        </div>
    </div>
    
    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header"><span class="modal-title" id="modal-title"></span><button class="modal-close" id="modal-close">✕</button></div>
            <div id="modal-content"></div>
        </div>
    </div>
    
    <div id="day-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header"><span class="modal-title" id="day-modal-title"></span><button class="modal-close" id="day-modal-close">✕</button></div>
            <div id="day-modal-content"></div>
        </div>
    </div>

<script>
(function() {
    const tg = window.Telegram.WebApp; tg.expand(); tg.ready();
    const SUPABASE_URL = 'https://owagntywpiymqhbfoxye.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93YWdudHl3cGl5bXFoYmZveHllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzMTg5MDUsImV4cCI6MjA5MTg5NDkwNX0.p-3xAhbFgH5lcGnbBfkcQQFVza_Yc2qoY6VBlhmmFGg';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    let userId = tg.initDataUnsafe?.user?.id || 531738802;
    let currentUser = null, currentRole = 'worker', selectedProjectId = '', incomeFilter = 'all', expenseFilter = 'all', payoutsFilter = 'all';
    let allProjects = [], allIncome = [], allExpenses = [], allWorkOrders = [], allAdvances = [];
    let currentDisplayDate = new Date();
    
    function escapeHtml(t) { if(!t) return ''; return String(t).replace(/[&<>]/g, function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]||c;}); }
    function formatDate(d) { if(!d) return '—'; return new Date(d).toLocaleDateString('ru-RU'); }
    function formatDateLong(d) { if(!d) return '—'; return new Date(d).toLocaleDateString('ru-RU', {day:'numeric',month:'long',year:'numeric'}); }
    function formatMoney(a) { return (a||0).toLocaleString() + ' ₸'; }
    
    async function init() {
        await loadUser();
        await loadProjects();
        await loadAllData();
        setupTabs();
        setupFilters();
        setupForms();
        renderCalendar();
    }
    
    async function loadUser() {
        const { data } = await supabase.from('users').select('*').eq('telegram_id', userId).single();
        if (data) { currentUser = data; currentRole = data.role; }
        document.getElementById('role-badge').textContent = currentRole === 'manager' ? '👑 Руководитель' : '👷 ИТР';
    }
    
    async function loadProjects() {
        let query = supabase.from('projects').select('*').order('name');
        if (currentRole !== 'manager') query = query.eq('responsible_worker_id', currentUser?.id);
        const { data } = await query;
        allProjects = data || [];
        const sel = document.getElementById('filter-project');
        if (sel) {
            sel.innerHTML = '<option value="">Все объекты</option>';
            allProjects.forEach(p => sel.innerHTML += `<option value="${p.id}">${p.name}</option>`);
        }
    }
    
    async function loadAllData() {
        let incQ = supabase.from('incomes').select('*, projects(name, customer_company_name)').order('date', { ascending: false });
        let expQ = supabase.from('expenses').select('*, projects(name)').order('date', { ascending: false });
        let ordQ = supabase.from('work_orders').select('*, projects(name), brigades(name)').order('created_at', { ascending: false });
        let advQ = supabase.from('advances').select('*, projects(name), brigades(name)').order('created_at', { ascending: false });
        
        if (currentRole !== 'manager') {
            incQ = incQ.in('project_id', allProjects.map(p => p.id));
            expQ = expQ.in('project_id', allProjects.map(p => p.id));
            ordQ = ordQ.in('project_id', allProjects.map(p => p.id));
            advQ = advQ.in('project_id', allProjects.map(p => p.id));
        }
        if (selectedProjectId) {
            incQ = incQ.eq('project_id', selectedProjectId);
            expQ = expQ.eq('project_id', selectedProjectId);
            ordQ = ordQ.eq('project_id', selectedProjectId);
            advQ = advQ.eq('project_id', selectedProjectId);
        }
        
        const [incR, expR, ordR, advR] = await Promise.all([incQ, expQ, ordQ, advQ]);
        allIncome = incR.data || [];
        allExpenses = expR.data || [];
        allWorkOrders = ordR.data || [];
        allAdvances = advR.data || [];
        
        updateKPI();
        renderAll();
        renderCalendar();
    }
    
    function updateKPI() {
        const monthIncome = allIncome.filter(i => new Date(i.date).getMonth() === currentDisplayDate.getMonth() && new Date(i.date).getFullYear() === currentDisplayDate.getFullYear());
        const monthExp = allExpenses.filter(e => new Date(e.date).getMonth() === currentDisplayDate.getMonth() && new Date(e.date).getFullYear() === currentDisplayDate.getFullYear());
        const monthOrd = allWorkOrders.filter(o => new Date(o.created_at).getMonth() === currentDisplayDate.getMonth() && new Date(o.created_at).getFullYear() === currentDisplayDate.getFullYear());
        const monthAdv = allAdvances.filter(a => new Date(a.created_at).getMonth() === currentDisplayDate.getMonth() && new Date(a.created_at).getFullYear() === currentDisplayDate.getFullYear());
        
        const totalIncome = monthIncome.filter(i => i.status === 'paid').reduce((s,i) => s + (i.amount||0), 0);
        const totalPlanIncome = monthIncome.filter(i => i.status === 'pending').reduce((s,i) => s + (i.amount||0), 0);
        const totalExpense = monthExp.filter(e => e.payment_status === 'paid').reduce((s,e) => s + (e.amount||0), 0);
        const totalPayouts = [...monthOrd.filter(o => o.payment_status === 'paid'), ...monthAdv.filter(a => a.status === 'paid')].reduce((s,x) => s + (x.amount||x.total_amount||0), 0);
        
        document.getElementById('kpi-income').textContent = formatMoney(totalIncome);
        document.getElementById('kpi-plan-income').textContent = formatMoney(totalPlanIncome);
        document.getElementById('kpi-expense').textContent = formatMoney(totalExpense);
        document.getElementById('kpi-payouts').textContent = formatMoney(totalPayouts);
    }
    
    function renderCalendar() {
        const year = currentDisplayDate.getFullYear();
        const month = currentDisplayDate.getMonth();
        const months = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
        document.getElementById('calendar-month-year').textContent = `${months[month]} ${year}`;
        
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        let startDay = firstDay.getDay() || 7;
        
        let html = '';
        for (let i = 1; i < startDay; i++) {
            const prev = new Date(year, month, 1 - (startDay - i));
            html += renderDay(prev, true);
        }
        for (let d = 1; d <= lastDay.getDate(); d++) {
            html += renderDay(new Date(year, month, d), false);
        }
        const total = Math.ceil((startDay - 1 + lastDay.getDate()) / 7) * 7;
        for (let i = startDay + lastDay.getDate() - 1; i < total; i++) {
            const next = new Date(year, month + 1, i - (startDay + lastDay.getDate() - 1) + 1);
            html += renderDay(next, true);
        }
        document.getElementById('calendar-days').innerHTML = html;
    }
    
    function renderDay(date, isOther) {
        const ds = date.toISOString().split('T')[0];
        const dInc = allIncome.filter(i => i.date === ds).reduce((s,i) => s + (i.amount||0), 0);
        const dExp = allExpenses.filter(e => e.date === ds).reduce((s,e) => s + (e.amount||0), 0);
        const dOrd = allWorkOrders.filter(o => (o.payment_date || o.created_at?.split('T')[0]) === ds).reduce((s,o) => s + (o.total_amount||0), 0);
        const dAdv = allAdvances.filter(a => (a.payment_date || a.created_at?.split('T')[0]) === ds).reduce((s,a) => s + (a.amount||0), 0);
        const totalExp = dExp + dOrd + dAdv;
        
        const isToday = date.toDateString() === new Date().toDateString();
        let cls = '';
        if (isOther) cls += ' other-month';
        if (isToday) cls += ' today';
        if (dInc > 0 && totalExp > 0) cls += ' has-both';
        else if (dInc > 0) cls += ' has-income';
        else if (totalExp > 0) cls += ' has-expense';
        
        return `<div class="calendar-day${cls}" onclick="showDay('${ds}')">
            <span>${date.getDate()}</span>
            ${dInc > 0 ? `<span class="day-amount" style="color:var(--success);">+${Math.round(dInc/1000)}k</span>` : ''}
            ${totalExp > 0 ? `<span class="day-amount" style="color:var(--danger);">-${Math.round(totalExp/1000)}k</span>` : ''}
        </div>`;
    }
    
    window.showDay = function(ds) {
        const inc = allIncome.filter(i => i.date === ds);
        const exp = allExpenses.filter(e => e.date === ds);
        const ord = allWorkOrders.filter(o => (o.payment_date || o.created_at?.split('T')[0]) === ds);
        const adv = allAdvances.filter(a => (a.payment_date || a.created_at?.split('T')[0]) === ds);
        
        document.getElementById('day-modal-title').textContent = `Операции за ${formatDateLong(ds)}`;
        let html = '';
        if (!inc.length && !exp.length && !ord.length && !adv.length) {
            html = '<p style="text-align:center;color:var(--text-secondary);padding:20px;">Нет операций</p>';
        } else {
            inc.forEach(i => html += `<div class="transaction-item"><div class="transaction-header"><span>📥 ${escapeHtml(i.description||'Поступление')}</span><span class="transaction-amount amount-income">+${formatMoney(i.amount)}</span></div><div class="transaction-meta"><span>🏗️ ${escapeHtml(i.projects?.name||'—')}</span><span class="tag ${i.status==='paid'?'tag-green':'tag-yellow'}">${i.status==='paid'?'Оплачен':'Ожидается'}</span></div></div>`);
            exp.forEach(e => html += `<div class="transaction-item"><div class="transaction-header"><span>📤 ${escapeHtml(e.name)}</span><span class="transaction-amount amount-expense">-${formatMoney(e.amount)}</span></div><div class="transaction-meta"><span>🏗️ ${escapeHtml(e.projects?.name||'—')}</span><span class="tag ${e.payment_status==='paid'?'tag-green':'tag-yellow'}">${e.payment_status==='paid'?'Оплачен':'План'}</span></div></div>`);
            ord.forEach(o => html += `<div class="transaction-item"><div class="transaction-header"><span>👷 ${escapeHtml(o.work_type||'Наряд')}</span><span class="transaction-amount amount-expense">-${formatMoney(o.total_amount)}</span></div><div class="transaction-meta"><span>👷 ${escapeHtml(o.brigades?.name||'—')}</span><span class="tag ${o.payment_status==='paid'?'tag-green':'tag-yellow'}">${o.payment_status==='paid'?'Выплачен':'К выплате'}</span></div></div>`);
            adv.forEach(a => html += `<div class="transaction-item"><div class="transaction-header"><span>💳 Аванс</span><span class="transaction-amount amount-expense">-${formatMoney(a.amount)}</span></div><div class="transaction-meta"><span>👷 ${escapeHtml(a.brigades?.name||'—')}</span><span class="tag ${a.status==='paid'?'tag-green':'tag-yellow'}">${a.status==='paid'?'Оплачен':'План'}</span></div></div>`);
        }
        document.getElementById('day-modal-content').innerHTML = html;
        document.getElementById('day-modal').classList.remove('hidden');
    };
    
    function renderAll() {
        renderSummary();
        renderIncomeList();
        renderExpenseList();
        renderPayoutsList();
    }
    
    // ===== СВОДКА =====
    function renderSummary() {
        const c = document.getElementById('summary-content');
        if (!allProjects.length) { c.innerHTML = '<div class="empty-state">Нет объектов</div>'; return; }
        
        let rows = '';
        let totalInc = 0, totalPlan = 0, totalExp = 0, totalPayout = 0;
        
        allProjects.forEach(p => {
            const pInc = allIncome.filter(i => i.project_id === p.id && i.status === 'paid');
            const pPlan = allIncome.filter(i => i.project_id === p.id && i.status === 'pending');
            const pExp = allExpenses.filter(e => e.project_id === p.id && e.payment_status === 'paid');
            const pOrd = allWorkOrders.filter(o => o.project_id === p.id && o.payment_status === 'paid');
            const pAdv = allAdvances.filter(a => a.project_id === p.id && a.status === 'paid');
            
            const sumInc = pInc.reduce((s,i) => s + (i.amount||0), 0);
            const sumPlan = pPlan.reduce((s,i) => s + (i.amount||0), 0);
            const sumExp = pExp.reduce((s,e) => s + (e.amount||0), 0);
            const sumPay = [...pOrd, ...pAdv].reduce((s,x) => s + (x.amount||x.total_amount||0), 0);
            
            totalInc += sumInc; totalPlan += sumPlan; totalExp += sumExp; totalPayout += sumPay;
            
            rows += `<tr>
                <td><b>${escapeHtml(p.name)}</b></td>
                <td style="color:var(--success);">${formatMoney(sumInc)}</td>
                <td style="color:var(--info);">${formatMoney(sumPlan)}</td>
                <td style="color:var(--danger);">${formatMoney(sumExp)}</td>
                <td style="color:var(--warning);">${formatMoney(sumPay)}</td>
            </tr>`;
        });
        
        c.innerHTML = `
            <table class="summary-table">
                <thead><tr><th>Объект</th><th>💰 Приход</th><th>📥 План пост.</th><th>📤 Расходы</th><th>👷 Выплаты</th></tr></thead>
                <tbody>${rows}</tbody>
                <tfoot style="font-weight:700;background:#F8FAFC;">
                    <tr><td>ИТОГО</td><td style="color:var(--success);">${formatMoney(totalInc)}</td><td style="color:var(--info);">${formatMoney(totalPlan)}</td><td style="color:var(--danger);">${formatMoney(totalExp)}</td><td style="color:var(--warning);">${formatMoney(totalPayout)}</td></tr>
                </tfoot>
            </table>
        `;
    }
    
    // ===== ПОСТУПЛЕНИЯ =====
    function renderIncomeList() {
        let filtered = allIncome;
        if (incomeFilter === 'paid') filtered = filtered.filter(i => i.status === 'paid');
        if (incomeFilter === 'pending') filtered = filtered.filter(i => i.status === 'pending');
        
        const c = document.getElementById('income-list');
        if (!filtered.length) { c.innerHTML = '<div class="empty-state">Нет поступлений</div>'; return; }
        
        c.innerHTML = filtered.map(i => `
            <div class="transaction-item">
                <div class="transaction-header">
                    <span class="transaction-title">${escapeHtml(i.description||'Поступление')}</span>
                    <span class="transaction-amount amount-income">+${formatMoney(i.amount)}</span>
                </div>
                <div style="font-size:12px;color:var(--text-secondary);">🏗️ ${escapeHtml(i.projects?.name||'—')} | 📋 ${escapeHtml(i.income_type||'—')}</div>
                ${i.invoice_number ? `<div style="font-size:11px;color:var(--text-secondary);">📄 Счёт: ${escapeHtml(i.invoice_number)}</div>` : ''}
                <div class="transaction-meta">
                    <span>📅 ${formatDate(i.date)}</span>
                    <span class="tag ${i.status==='paid'?'tag-green':'tag-yellow'}">${i.status==='paid'?'✅ Оплачен':'⏳ Ожидается'}</span>
                </div>
            </div>
        `).join('');
    }
    
    // ===== РАСХОДЫ =====
    function renderExpenseList() {
        let filtered = allExpenses;
        if (expenseFilter === 'paid') filtered = filtered.filter(e => e.payment_status === 'paid');
        if (expenseFilter === 'pending') filtered = filtered.filter(e => e.payment_status !== 'paid');
        
        const c = document.getElementById('expense-list');
        if (!filtered.length) { c.innerHTML = '<div class="empty-state">Нет расходов</div>'; return; }
        
        c.innerHTML = filtered.map(e => `
            <div class="transaction-item">
                <div class="transaction-header">
                    <span class="transaction-title">${escapeHtml(e.name)}</span>
                    <span class="transaction-amount amount-expense">-${formatMoney(e.amount)}</span>
                </div>
                <div style="font-size:12px;color:var(--text-secondary);">🏗️ ${escapeHtml(e.projects?.name||'—')} | 📂 ${escapeHtml(e.category||'—')}</div>
                <div class="transaction-meta">
                    <span>📅 ${formatDate(e.date)} | 💳 ${e.payment_method==='cash'?'Наличка':'Безнал'}</span>
                    <span class="tag ${e.payment_status==='paid'?'tag-green':'tag-yellow'}">${e.payment_status==='paid'?'💳 Оплачен':'📅 План'}</span>
                </div>
            </div>
        `).join('');
    }
    
    // ===== ВЫПЛАТЫ =====
    function renderPayoutsList() {
        const all = [
            ...allWorkOrders.map(o => ({...o, type: 'order', amount: o.total_amount, date: o.payment_date || o.created_at?.split('T')[0], status: o.payment_status === 'paid' ? 'paid' : 'pending'})),
            ...allAdvances.map(a => ({...a, type: 'advance', amount: a.amount, date: a.payment_date || a.created_at?.split('T')[0], status: a.status === 'paid' ? 'paid' : 'pending'}))
        ].sort((a,b) => new Date(b.date) - new Date(a.date));
        
        let filtered = all;
        if (payoutsFilter === 'paid') filtered = all.filter(x => x.status === 'paid');
        if (payoutsFilter === 'pending') filtered = all.filter(x => x.status !== 'paid');
        
        const c = document.getElementById('payouts-list');
        if (!filtered.length) { c.innerHTML = '<div class="empty-state">Нет выплат</div>'; return; }
        
        c.innerHTML = filtered.map(x => `
            <div class="transaction-item">
                <div class="transaction-header">
                    <span class="transaction-title">${x.type==='order' ? '📋 Наряд' : '💳 Аванс'} ${escapeHtml(x.work_type||'')}</span>
                    <span class="transaction-amount amount-expense">-${formatMoney(x.amount)}</span>
                </div>
                <div style="font-size:12px;color:var(--text-secondary);">👷 ${escapeHtml(x.brigades?.name||'—')} | 🏗️ ${escapeHtml(x.projects?.name||'—')}</div>
                <div class="transaction-meta">
                    <span>📅 ${formatDate(x.date)}</span>
                    <span class="tag ${x.status==='paid'?'tag-green':'tag-yellow'}">${x.status==='paid'?'✅ Выплачен':'⏳ План'}</span>
                </div>
            </div>
        `).join('');
    }
    
    // ===== ФОРМЫ =====
    function setupForms() {
        // Поступление
        document.getElementById('show-income-form').addEventListener('click', () => {
            let opts = allProjects.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
            document.getElementById('modal-title').textContent = '➕ Поступление';
            document.getElementById('modal-content').innerHTML = `
                <div class="form-group"><label class="form-label">🏗️ Объект *</label><select id="inc-project" class="form-input" onchange="updateIncomeCustomer()">${opts}</select></div>
                <div class="form-group"><label class="form-label">🏢 Заказчик</label><input id="inc-customer" class="form-input" disabled></div>
                <div class="form-group"><label class="form-label">📋 Вид поступления *</label><select id="inc-type" class="form-input"><option>Аванс от заказчика</option><option>Сдача наряда заказчику</option><option>Доплата по договору</option></select></div>
                <div class="form-group"><label class="form-label">📄 Номер счёта</label><input id="inc-invoice" class="form-input"></div>
                <div class="grid-2"><div class="form-group"><label class="form-label">💰 Сумма *</label><input type="number" id="inc-amount" class="form-input" step="0.01"></div><div class="form-group"><label class="form-label">📅 Дата *</label><input type="date" id="inc-date" class="form-input" value="${new Date().toISOString().split('T')[0]}"></div></div>
                <div class="form-group"><label class="form-label">📊 Статус *</label><select id="inc-status" class="form-input"><option value="pending">⏳ Ожидается (план)</option><option value="paid">✅ Оплачен (факт)</option></select></div>
                <button class="btn btn-primary" id="save-income">💾 Сохранить</button>
            `;
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('save-income').onclick = async () => {
                const projectId = document.getElementById('inc-project').value;
                const type = document.getElementById('inc-type').value;
                const invoice = document.getElementById('inc-invoice').value;
                const amount = parseFloat(document.getElementById('inc-amount').value);
                const date = document.getElementById('inc-date').value;
                const status = document.getElementById('inc-status').value;
                if (!amount || !date) { alert('Заполните сумму и дату'); return; }
                await supabase.from('incomes').insert({project_id: projectId||null, description: type, income_type: type, invoice_number: invoice, amount, date, status, created_by: currentUser?.id});
                document.getElementById('modal').classList.add('hidden');
                loadAllData();
            };
        });
        
        // Расход
        document.getElementById('show-expense-form').addEventListener('click', async () => {
            const { data: num } = await supabase.from('document_numbers').select('number').eq('doc_type','expense').order('number',{ascending:false}).limit(1);
            const next = num?.length ? num[0].number + 1 : 1;
            const expNum = `№-RAS-${next}`;
            let opts = allProjects.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
            document.getElementById('modal-title').textContent = '➕ Расход';
            document.getElementById('modal-content').innerHTML = `
                <div class="form-group"><label class="form-label">Номер</label><input class="form-input" value="${expNum}" disabled></div>
                <div class="form-group"><label class="form-label">🏗️ Объект</label><select id="exp-project" class="form-input">${opts}</select></div>
                <div class="form-group"><label class="form-label">📂 Категория</label><select id="exp-category" class="form-input"><option>Материалы</option><option>Транспорт</option><option>Питание</option><option>Инструменты</option><option>Спецодежда</option><option>Прочее</option></select></div>
                <div class="form-group"><label class="form-label">📝 Наименование *</label><input id="exp-name" class="form-input"></div>
                <div class="grid-2"><div class="form-group"><label class="form-label">💰 Сумма *</label><input type="number" id="exp-amount" class="form-input" step="0.01"></div><div class="form-group"><label class="form-label">📅 Дата</label><input type="date" id="exp-date" class="form-input" value="${new Date().toISOString().split('T')[0]}"></div></div>
                <div class="form-group"><label class="form-label">💳 Метод оплаты</label><select id="exp-method" class="form-input" onchange="togglePayer()"><option value="non_cash">Безнал</option><option value="cash">Наличка</option></select></div>
                <div class="form-group hidden" id="exp-payer-group"><label class="form-label">👤 Кто оплатил</label><select id="exp-payer" class="form-input"><option>Карта ИТР</option><option>Наличка ИТР</option><option>Маххабат Карта</option><option>Маххабат Наличка</option><option>Володя Карта</option><option>Володя Наличка</option></select></div>
                <div class="form-group"><label class="form-label">📊 Статус</label><select id="exp-status" class="form-input"><option value="pending">📅 План</option><option value="paid">💳 Оплачен</option></select></div>
                <button class="btn btn-primary" id="save-expense">💾 Сохранить</button>
            `;
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('save-expense').onclick = async () => {
                const name = document.getElementById('exp-name').value.trim();
                const amount = parseFloat(document.getElementById('exp-amount').value);
                if (!name || !amount) { alert('Заполните поля'); return; }
                await supabase.from('expenses').insert({
                    project_id: document.getElementById('exp-project').value||null,
                    name, amount, date: document.getElementById('exp-date').value,
                    category: document.getElementById('exp-category').value,
                    payment_method: document.getElementById('exp-method').value,
                    paid_by_name: document.getElementById('exp-method').value==='cash' ? document.getElementById('exp-payer').value : null,
                    payment_status: document.getElementById('exp-status').value,
                    expense_number: expNum, created_by: currentUser?.id
                });
                await supabase.from('document_numbers').upsert({doc_type:'expense', number: next}, {onConflict: 'doc_type'});
                document.getElementById('modal').classList.add('hidden');
                loadAllData();
            };
        });
    }
    
    window.updateIncomeCustomer = function() {
        const pid = document.getElementById('inc-project')?.value;
        const project = allProjects.find(p => p.id === pid);
        const el = document.getElementById('inc-customer');
        if (el) el.value = project?.customer_company_name || '';
    };
    
    window.togglePayer = function() {
        const method = document.getElementById('exp-method')?.value;
        const group = document.getElementById('exp-payer-group');
        if (group) group.classList.toggle('hidden', method !== 'cash');
    };
    
    function setupTabs() {
        document.querySelectorAll('.tab').forEach(t => {
            t.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
                this.classList.add('active');
                document.getElementById('tab-'+this.dataset.tab).classList.add('active');
            });
        });
    }
    
    function setupFilters() {
        document.getElementById('filter-project').addEventListener('change', e => { selectedProjectId = e.target.value; loadAllData(); });
        document.getElementById('prev-month').addEventListener('click', () => { currentDisplayDate.setMonth(currentDisplayDate.getMonth()-1); loadAllData(); });
        document.getElementById('next-month').addEventListener('click', () => { currentDisplayDate.setMonth(currentDisplayDate.getMonth()+1); loadAllData(); });
        document.getElementById('today-month').addEventListener('click', () => { currentDisplayDate = new Date(); loadAllData(); });
        document.getElementById('modal-close').addEventListener('click', () => document.getElementById('modal').classList.add('hidden'));
        document.getElementById('modal').addEventListener('click', function(e) { if (e.target === this) this.classList.add('hidden'); });
        document.getElementById('day-modal-close').addEventListener('click', () => document.getElementById('day-modal').classList.add('hidden'));
        document.getElementById('day-modal').addEventListener('click', function(e) { if (e.target === this) this.classList.add('hidden'); });
        
        document.querySelectorAll('.income-filter-btn').forEach(b => b.addEventListener('click', function() {
            document.querySelectorAll('.income-filter-btn').forEach(x => x.classList.remove('active'));
            this.classList.add('active'); incomeFilter = this.dataset.filter; renderIncomeList();
        }));
        document.querySelectorAll('.expense-filter-btn').forEach(b => b.addEventListener('click', function() {
            document.querySelectorAll('.expense-filter-btn').forEach(x => x.classList.remove('active'));
            this.classList.add('active'); expenseFilter = this.dataset.filter; renderExpenseList();
        }));
        document.querySelectorAll('.payouts-filter-btn').forEach(b => b.addEventListener('click', function() {
            document.querySelectorAll('.payouts-filter-btn').forEach(x => x.classList.remove('active'));
            this.classList.add('active'); payoutsFilter = this.dataset.filter; renderPayoutsList();
        }));
    }
    
    init();
})();
</script>
</body>
</html>

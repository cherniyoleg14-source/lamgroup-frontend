    <style>
        :root {
            --bg: #F8FAFC; --card: #FFFFFF; --text: #0F172A; --text-secondary: #64748B;
            --border: #E2E8F0; --gold: #F59E0B; --primary: #0F172A; --success: #10B981;
            --danger: #EF4444; --warning: #F59E0B; --info: #3B82F6;
            --shadow: 0 4px 16px rgba(0,0,0,0.06); --radius: 16px; --radius-lg: 24px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: linear-gradient(180deg, #F8FAFC 0%, #F1F5F9 100%); min-height: 100vh; -webkit-font-smoothing: antialiased; padding: 16px; }
        .container { max-width: 600px; margin: 0 auto; }
        
        .app-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; margin-bottom: 16px; background: rgba(255,255,255,0.85); backdrop-filter: blur(20px); border-radius: var(--radius-lg); box-shadow: var(--shadow); border: 1px solid rgba(226,232,240,0.5); }
        .app-header h1 { font-size: 22px; font-weight: 800; background: linear-gradient(135deg, #0F172A, #1E293B); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .badge { padding: 6px 14px; border-radius: 30px; font-size: 12px; font-weight: 600; }
        .badge-dark { background: var(--primary); color: white; }
        
        .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
        .kpi-card { background: var(--card); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); border-left: 4px solid transparent; }
        .kpi-card.income { border-left-color: var(--success); } .kpi-card.plan { border-left-color: var(--info); }
        .kpi-card.expense { border-left-color: var(--danger); } .kpi-card.payout { border-left-color: var(--warning); }
        .kpi-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; font-weight: 600; color: var(--text-secondary); }
        .kpi-value { font-size: 20px; font-weight: 800; }
        
        .calendar-section { background: white; border-radius: var(--radius-lg); padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .calendar-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; margin-bottom: 6px; }
        .weekday { font-size: 10px; font-weight: 600; color: var(--text-secondary); padding: 4px 0; }
        .calendar-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
        .calendar-day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 10px; font-size: 12px; font-weight: 500; cursor: pointer; background: #F8FAFC; position: relative; }
        .calendar-day.other-month { color: #94A3B8; }
        .calendar-day.today { background: var(--primary); color: white; font-weight: 700; }
        .calendar-day.has-income { border: 2px solid var(--success); }
        .calendar-day.has-expense { border: 2px solid var(--danger); }
        .calendar-day.has-both { border: 2px solid var(--warning); }
        .day-amount { font-size: 7px; font-weight: 700; margin-top: 1px; }
        .calendar-legend { display: flex; gap: 12px; margin-top: 10px; justify-content: center; font-size: 10px; }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 4px; }
        
        .filter-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
        .form-select { flex: 1; min-width: 120px; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 13px; background: white; font-family: inherit; }
        .btn { padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: var(--primary); color: white; width: 100%; }
        .btn-outline { background: white; border: 1.5px solid var(--border); }
        .btn-sm { padding: 5px 10px; font-size: 11px; border-radius: 8px; }
        .btn-danger { background: #FEE2E2; color: #991B1B; }
        .btn-success { background: #D1FAE5; color: #065F46; }
        
        .tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--border); margin-bottom: 16px; overflow-x: auto; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab { padding: 10px 14px; background: none; border: none; font-size: 13px; font-weight: 600; color: var(--text-secondary); cursor: pointer; white-space: nowrap; border-bottom: 3px solid transparent; }
        .tab.active { color: var(--text); border-bottom-color: var(--gold); }
        .tab-content { display: none; } .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        .card { background: var(--card); border-radius: var(--radius-lg); padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
        .form-group { margin-bottom: 14px; }
        .form-label { font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 4px; }
        .form-input { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 13px; background: white; font-family: inherit; }
        .form-input:focus { outline: none; border-color: var(--gold); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .hidden { display: none !important; }
        .loading { text-align: center; padding: 40px; color: var(--text-secondary); }
        .empty-state { text-align: center; padding: 40px 20px; background: white; border-radius: var(--radius-lg); color: var(--text-secondary); border: 2px dashed var(--border); }
        
        .summary-table { width: 100%; border-collapse: collapse; font-size: 11px; }
        .summary-table th { background: #F8FAFC; padding: 8px 6px; text-align: left; font-weight: 600; font-size: 10px; color: var(--text-secondary); border-bottom: 2px solid var(--border); }
        .summary-table td { padding: 8px 6px; border-bottom: 1px solid var(--border); }
        
        .expense-card { background: white; border-radius: var(--radius); padding: 14px; margin-bottom: 10px; border: 1px solid var(--border); cursor: pointer; }
        .expense-card.urgent { border-left: 4px solid var(--danger); }
        .expense-card.approved { border-left: 4px solid var(--success); }
        .expense-card.pending { border-left: 4px solid var(--warning); }
        .expense-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; flex-wrap: wrap; gap: 6px; }
        .expense-title { font-weight: 600; font-size: 14px; }
        .expense-amount { font-weight: 700; font-size: 17px; }
        .expense-meta { font-size: 11px; color: var(--text-secondary); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
        
        .tag { padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 600; }
        .tag-green { background: #D1FAE5; color: #065F46; } .tag-yellow { background: #FEF3C7; color: #92400E; }
        .tag-blue { background: #DBEAFE; color: #1E40AF; } .tag-red { background: #FEE2E2; color: #991B1B; }
        
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 10000; }
        .modal-content { background: white; border-radius: var(--radius-lg); padding: 20px; max-width: 500px; width: 90%; max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.15); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .modal-title { font-size: 18px; font-weight: 800; }
        .modal-close { width: 32px; height: 32px; border-radius: 50%; background: #F1F5F9; border: none; font-size: 16px; cursor: pointer; }
        .message { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 99999; padding: 12px 20px; border-radius: 14px; font-weight: 600; font-size: 13px; opacity: 0; pointer-events: none; transition: all 0.3s; }
        .message.success { background: #D1FAE5; color: #065F46; opacity: 1; } .message.error { background: #FEE2E2; color: #991B1B; opacity: 1; }
    </style>
</head>

<script>
(function() {
    const tg = window.Telegram.WebApp; tg.expand(); tg.ready();
    const SUPABASE_URL = 'https://owagntywpiymqhbfoxye.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93YWdudHl3cGl5bXFoYmZveHllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzMTg5MDUsImV4cCI6MjA5MTg5NDkwNX0.p-3xAhbFgH5lcGnbBfkcQQFVza_Yc2qoY6VBlhmmFGg';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    let userId = tg.initDataUnsafe?.user?.id || 531738802;
    let currentUser = null, currentRole = 'worker', selectedProjectId = '', incomeFilter = 'all', expenseFilter = 'all', selectedPeriod = '';
    let allProjects = [], allIncome = [], allExpenses = [], allWorkOrders = [], allAdvances = [];
    let currentDisplayDate = new Date();
    
    const expenseCategories = { delivery: '🚛 Доставка', consumables: '🔧 Расходники', cradles: '🏗️ Люльки', scaffolding: '🪜 Леса', rent: '🏢 Аренда', other: '📄 Прочее' };
    
    function escapeHtml(t) { if(!t) return ''; return String(t).replace(/[&<>]/g, function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]||c;}); }
    function formatDate(d) { if(!d) return '—'; return new Date(d).toLocaleDateString('ru-RU'); }
    function formatDateLong(d) { if(!d) return '—'; return new Date(d).toLocaleDateString('ru-RU', {day:'numeric',month:'long',year:'numeric'}); }
    function formatMoney(a) { return (a||0).toLocaleString() + ' ₸'; }
    function showMessage(text, type) { const m = document.getElementById('message'); m.textContent = text; m.className = 'message ' + type; setTimeout(() => m.className = 'message', 3000); }
    
   async function init() { 
    await loadUser(); 
    await loadProjects(); 
    setupFilters(); 
    setupTabs(); 
    loadAllData(); 
    renderCalendar();
    document.getElementById('filter-period-month').value = new Date().toISOString().slice(0, 7);
}
    
    async function loadUser() { const { data } = await supabase.from('users').select('*').eq('telegram_id', userId).single(); if (data) { currentUser = data; currentRole = data.role; } document.getElementById('role-badge').textContent = currentRole === 'manager' ? '👑 Руководитель' : '👷 ИТР'; }
    
    async function loadProjects() {
        let q = supabase.from('projects').select('*').order('name');
        if (currentRole !== 'manager') q = q.eq('responsible_worker_id', currentUser?.id);
        const { data } = await q; allProjects = data || [];
        document.getElementById('filter-project').innerHTML = '<option value="">Все объекты</option>' + allProjects.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
    }
    
   function getPeriodFilter() {
    const type = document.getElementById('filter-period-type')?.value;
    const now = new Date();
    
    if (type === 'month') {
        const val = document.getElementById('filter-period-month')?.value;
        if (val) {
            const [y, m] = val.split('-');
            return { start: `${y}-${m}-01`, end: new Date(y, m, 0).toISOString().split('T')[0] };
        }
    } else if (type === 'quarter') {
        const q = Math.floor(now.getMonth() / 3);
        const start = new Date(now.getFullYear(), q * 3, 1);
        const end = new Date(now.getFullYear(), (q + 1) * 3, 0);
        return { start: start.toISOString().split('T')[0], end: end.toISOString().split('T')[0] };
    } else if (type === 'year') {
        return { start: `${now.getFullYear()}-01-01`, end: `${now.getFullYear()}-12-31` };
    } else if (type === 'custom') {
        const from = document.getElementById('filter-date-from')?.value;
        const to = document.getElementById('filter-date-to')?.value;
        if (from && to) return { start: from, end: to };
    }
    return null;
}
    
    async function loadAllData() {
        const period = getPeriodFilter();
        let incQ = supabase.from('incomes').select('*, projects(name, customer_company_name)').order('date', { ascending: false });
        let expQ = supabase.from('expenses').select('*, projects(name)').order('date', { ascending: false });
        let ordQ = supabase.from('work_orders').select('*, projects(name), brigades(name)').order('created_at', { ascending: false });
        let advQ = supabase.from('advances').select('*, projects(name), brigades(name)').order('created_at', { ascending: false });
        
        if (currentRole !== 'manager') {
            const pids = allProjects.map(p => p.id);
            if (pids.length) { incQ = incQ.in('project_id', pids); expQ = expQ.in('project_id', pids); ordQ = ordQ.in('project_id', pids); advQ = advQ.in('project_id', pids); }
        }
        if (selectedProjectId) { incQ = incQ.eq('project_id', selectedProjectId); expQ = expQ.eq('project_id', selectedProjectId); ordQ = ordQ.eq('project_id', selectedProjectId); advQ = advQ.eq('project_id', selectedProjectId); }
        if (period) {
            incQ = incQ.gte('date', period.start).lte('date', period.end);
            expQ = expQ.gte('date', period.start).lte('date', period.end);
        }
        
        const [incR, expR, ordR, advR] = await Promise.all([incQ, expQ, ordQ, advQ]);
        allIncome = incR.data || []; allExpenses = expR.data || []; allWorkOrders = ordR.data || []; allAdvances = advR.data || [];
        updateKPI(); renderAll(); renderCalendar();
    }
    
    function updateKPI() {
        const totalIncome = allIncome.filter(i => i.status === 'paid').reduce((s,i) => s + (i.amount||0), 0);
        const totalPlan = allIncome.filter(i => i.status === 'pending').reduce((s,i) => s + (i.amount||0), 0);
        const totalExp = allExpenses.filter(e => e.payment_status === 'paid').reduce((s,e) => s + (e.amount||0), 0);
        const totalPay = [...allWorkOrders.filter(o => o.payment_status === 'paid'), ...allAdvances.filter(a => a.status === 'paid')].reduce((s,x) => s + (x.amount||x.total_amount||0), 0);
        document.getElementById('kpi-income').textContent = formatMoney(totalIncome);
        document.getElementById('kpi-plan-income').textContent = formatMoney(totalPlan);
        document.getElementById('kpi-expense').textContent = formatMoney(totalExp);
        document.getElementById('kpi-payouts').textContent = formatMoney(totalPay);
    }
    
    function renderCalendar() {
        const y = currentDisplayDate.getFullYear(), m = currentDisplayDate.getMonth();
        document.getElementById('calendar-month-year').textContent = `${['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'][m]} ${y}`;
        const first = new Date(y, m, 1), last = new Date(y, m+1, 0);
        let start = first.getDay() || 7, html = '';
        for (let i=1; i<start; i++) html += renderDay(new Date(y, m, 1-(start-i)), true);
        for (let d=1; d<=last.getDate(); d++) html += renderDay(new Date(y, m, d), false);
        const total = Math.ceil((start-1+last.getDate())/7)*7;
        for (let i=start+last.getDate()-1; i<total; i++) html += renderDay(new Date(y, m+1, i-(start+last.getDate()-1)+1), true);
        document.getElementById('calendar-days').innerHTML = html;
    }
    
    function renderDay(date, other) {
        const ds = date.toISOString().split('T')[0];
        const inc = allIncome.filter(i => i.date === ds).reduce((s,i) => s + (i.amount||0), 0);
        const exp = allExpenses.filter(e => e.date === ds).reduce((s,e) => s + (e.amount||0), 0) + allWorkOrders.filter(o => (o.payment_date||o.created_at?.split('T')[0]) === ds).reduce((s,o) => s + (o.total_amount||0), 0) + allAdvances.filter(a => (a.payment_date||a.created_at?.split('T')[0]) === ds).reduce((s,a) => s + (a.amount||0), 0);
        const isToday = date.toDateString() === new Date().toDateString();
        let cls = other ? ' other-month' : '';
        if (isToday) cls += ' today';
        if (inc>0 && exp>0) cls += ' has-both'; else if (inc>0) cls += ' has-income'; else if (exp>0) cls += ' has-expense';
        return `<div class="calendar-day${cls}" onclick="showDay('${ds}')"><span>${date.getDate()}</span>${inc>0?`<span class="day-amount" style="color:var(--success);">+${Math.round(inc/1000)}k</span>`:''}${exp>0?`<span class="day-amount" style="color:var(--danger);">-${Math.round(exp/1000)}k</span>`:''}</div>`;
    }
    
    window.showDay = function(ds) {
        const inc = allIncome.filter(i => i.date === ds), exp = allExpenses.filter(e => e.date === ds);
        const ord = allWorkOrders.filter(o => (o.payment_date||o.created_at?.split('T')[0]) === ds), adv = allAdvances.filter(a => (a.payment_date||a.created_at?.split('T')[0]) === ds);
        document.getElementById('day-modal-title').textContent = `Операции за ${formatDateLong(ds)}`;
        let h = '';
        if (!inc.length&&!exp.length&&!ord.length&&!adv.length) h = '<p style="text-align:center;padding:20px;">Нет операций</p>';
        inc.forEach(i => h += `<div style="padding:10px;border-bottom:1px solid var(--border);"><b>📥 ${escapeHtml(i.description)}</b> <span style="color:var(--success);">+${formatMoney(i.amount)}</span><br><small>${escapeHtml(i.projects?.name||'—')}</small></div>`);
        exp.forEach(e => h += `<div style="padding:10px;border-bottom:1px solid var(--border);"><b>📤 ${escapeHtml(e.name)}</b> <span style="color:var(--danger);">-${formatMoney(e.amount)}</span><br><small>${escapeHtml(e.projects?.name||'—')} | ${expenseCategories[e.category]||e.category}</small></div>`);
        ord.forEach(o => h += `<div style="padding:10px;border-bottom:1px solid var(--border);"><b>👷 ${escapeHtml(o.work_type||'Наряд')}</b> <span style="color:var(--danger);">-${formatMoney(o.total_amount)}</span><br><small>${escapeHtml(o.brigades?.name||'—')}</small></div>`);
        adv.forEach(a => h += `<div style="padding:10px;border-bottom:1px solid var(--border);"><b>💳 Аванс</b> <span style="color:var(--danger);">-${formatMoney(a.amount)}</span><br><small>${escapeHtml(a.brigades?.name||'—')}</small></div>`);
        document.getElementById('day-modal-content').innerHTML = h; document.getElementById('day-modal').classList.remove('hidden');
    };
    
    function renderAll() { renderSummary(); renderIncomeList(); renderExpenseList(); renderPayoutsList(); }
    
    // ===== СВОДКА =====
    function renderSummary() {
        const c = document.getElementById('summary-content');
        if (!allProjects.length) { c.innerHTML = '<div class="empty-state">Нет объектов</div>'; return; }
        let rows = '', ti=0, tp=0, te=0, tpa=0;
        allProjects.forEach(p => {
            const si = allIncome.filter(i => i.project_id===p.id&&i.status==='paid').reduce((s,i)=>s+(i.amount||0),0);
            const sp = allIncome.filter(i => i.project_id===p.id&&i.status==='pending').reduce((s,i)=>s+(i.amount||0),0);
            const se = allExpenses.filter(e => e.project_id===p.id&&e.payment_status==='paid').reduce((s,e)=>s+(e.amount||0),0);
            const spay = [...allWorkOrders.filter(o=>o.project_id===p.id&&o.payment_status==='paid'),...allAdvances.filter(a=>a.project_id===p.id&&a.status==='paid')].reduce((s,x)=>s+(x.amount||x.total_amount||0),0);
            ti+=si; tp+=sp; te+=se; tpa+=spay;
            rows += `<tr><td><b>${escapeHtml(p.name)}</b></td><td style="color:var(--success);">${formatMoney(si)}</td><td style="color:var(--info);">${formatMoney(sp)}</td><td style="color:var(--danger);">${formatMoney(se)}</td><td style="color:var(--warning);">${formatMoney(spay)}</td></tr>`;
        });
        c.innerHTML = `<table class="summary-table"><thead><tr><th>Объект</th><th>💰 Приход</th><th>📥 План</th><th>📤 Расходы</th><th>👷 Выплаты</th></tr></thead><tbody>${rows}</tbody><tfoot style="font-weight:700;background:#F8FAFC;"><tr><td>ИТОГО</td><td style="color:var(--success);">${formatMoney(ti)}</td><td style="color:var(--info);">${formatMoney(tp)}</td><td style="color:var(--danger);">${formatMoney(te)}</td><td style="color:var(--warning);">${formatMoney(tpa)}</td></tr></tfoot></table>`;
    }
    
    // ===== ПОСТУПЛЕНИЯ =====
    function renderIncomeList() {
        let f = allIncome; if (incomeFilter==='paid') f=f.filter(i=>i.status==='paid'); if (incomeFilter==='pending') f=f.filter(i=>i.status==='pending');

                <b>📝 Наименование:</b> ${escapeHtml(e.name)}<br>

                ${e.invoice_url?`<b>📎 Счёт:</b> <a href="${e.invoice_url}" target="_blank">Просмотреть</a><br>`:''}
                ${e.comment?`<b>📝 Комментарий:</b> ${escapeHtml(e.comment)}<br>`:''}
            </div>

            </div>`; document.getElementById('modal').classList.remove('hidden');

    window.deleteExpense = async function(id) {
        const e = allExpenses.find(x => x.id === id); if (!e) return;
        const info = `${e.expense_number||''}\n${e.name}\n${formatMoney(e.amount)}\n${e.projects?.name||''}\n${expenseCategories[e.category]||e.category}`;
        if (!confirm(`⚠️ Удалить расход?\n\n${info}\n\nЭто нельзя отменить!`)) return;
        await supabase.from('expenses').delete().eq('id', id);
        document.getElementById('modal').classList.add('hidden'); showMessage('✅ Удалено','success'); loadAllData();
    };

        await supabase.from('expenses').update({payment_status:'approved',approved_at:new Date(),approved_by:currentUser?.id}).eq('id',id);
        document.getElementById('modal').classList.add('hidden'); showMessage('✅ Утверждён','success'); loadAllData();
    };

window.changePeriodType = function() {
    const type = document.getElementById('filter-period-type')?.value;
    const monthEl = document.getElementById('filter-period-month');
    const customEl = document.getElementById('filter-period-custom');
    
    if (monthEl) monthEl.classList.toggle('hidden', type !== 'month');
    if (customEl) {
        customEl.classList.toggle('hidden', type !== 'custom');
        customEl.style.display = type === 'custom' ? 'flex' : 'none';
    }
    loadAllData();
};

window.toggleExpFieldsDDS = function() {
    const mt = document.getElementById('exp-method')?.value;
    const st = document.getElementById('exp-status')?.value;
    const pg = document.getElementById('exp-paid-group');
    const dg = document.getElementById('exp-plan-date-group');
    if (pg) pg.style.display = (mt === 'cash') ? 'block' : 'none';
    if (dg) dg.style.display = (st === 'pending') ? 'block' : 'none';
};

// ========== ФОРМА РАСХОДА ==========

window.openExpenseFormDDS = async function(editId) {
    const today = new Date().toISOString().split('T')[0];
    let editData = null;
    if (editId) editData = allExpenses.find(x => x.id === editId);
    
    if (!editId) {
        const { data: num } = await supabase.from('document_numbers').select('number').eq('doc_type','expense').order('number',{ascending:false}).limit(1);
        const next = num?.length ? num[0].number + 1 : 1;
        var expNum = '№-RAS-' + next;
    } else {
        var expNum = editData.expense_number || '';
    }
    
    const opts = allProjects.map(p => `<option value="${p.id}" ${editData?.project_id===p.id?'selected':''}>${p.name}</option>`).join('');
    const catOpts = Object.entries(expenseCategories).map(([k,v]) => `<option value="${k}" ${editData?.category===k?'selected':''}>${v}</option>`).join('');
    
    let h = `<div class="form-group"><label class="form-label">📄 Номер</label><input class="form-input" value="${expNum}" disabled></div>`;
    h += `<div class="form-group"><label class="form-label">🏗️ Объект</label><select id="exp-project" class="form-input">${opts}</select></div>`;
    h += `<div class="form-group"><label class="form-label">📂 Статья расхода</label><select id="exp-category" class="form-input">${catOpts}</select></div>`;
    h += `<div class="form-group"><label class="form-label">📝 Наименование *</label><input id="exp-name" class="form-input" value="${escapeHtml(editData?.name||'')}"></div>`;
    h += `<div class="form-group"><label class="form-label">🏢 Поставщик</label><input id="exp-supplier" class="form-input" value="${escapeHtml(editData?.supplier||'')}"></div>`;
    h += `<div class="grid-2"><div class="form-group"><label class="form-label">Количество</label><input type="number" id="exp-qty" class="form-input" step="0.01" value="${editData?.quantity||1}"></div><div class="form-group"><label class="form-label">💰 Сумма *</label><input type="number" id="exp-amount" class="form-input" step="0.01" value="${editData?.amount||''}"></div></div>`;
    h += `<div class="form-group"><label class="form-label">📅 Дата расхода</label><input type="date" id="exp-date" class="form-input" value="${editData?.date||today}"></div>`;
    h += `<div class="form-group"><label class="form-label">💳 Метод оплаты</label><select id="exp-method" class="form-input" onchange="window.toggleExpFieldsDDS()"><option value="non_cash" ${editData?.payment_method==='non_cash'?'selected':''}>💳 Безнал</option><option value="cash" ${editData?.payment_method==='cash'?'selected':''}>💵 Наличка</option></select></div>`;
    h += `<div class="form-group">
        <label class="form-label">📎 Счёт на оплату</label>
        <button type="button" class="btn btn-outline" id="exp-invoice-btn" style="width:100%;">📁 Выбрать файл</button>
        <span id="exp-invoice-name" style="font-size:11px;color:var(--text-secondary);display:block;margin-top:4px;">${editData?.invoice_url ? '📎 Уже прикреплён' : 'Файл не выбран'}</span>
        <input type="file" id="exp-invoice" accept=".pdf,.jpg,.jpeg,.png" style="display:none;">
    </div>`;
    h += `<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;"><input type="checkbox" id="exp-urgent" style="width:18px;height:18px;" ${editData?.is_urgent?'checked':''}><label>🚨 Срочный платёж</label></div>`;
    h += `<div class="form-group"><label class="form-label">📊 Статус</label><select id="exp-status" class="form-input" onchange="window.toggleExpFieldsDDS()"><option value="paid" ${editData?.payment_status==='paid'?'selected':''}>💳 Оплатили</option><option value="pending" ${(!editData||editData?.payment_status!=='paid')?'selected':''}>📅 В план оплат</option></select></div>`;
    h += `<div id="exp-paid-group" class="form-group" style="display:none;">
        <label class="form-label">👤 Кто оплатил *</label>
        <select id="exp-paid-by" class="form-input">
            <option value="">Выберите...</option>
            <option value="Маххабат Наличка">💵 Маххабат Наличка</option>
            <option value="Маххабат Карта">💳 Маххабат Карта</option>
            <option value="Володя Наличка">💵 Володя Наличка</option>
            <option value="Володя Карта">💳 Володя Карта</option>
            <option value="ИТР Наличка">💵 ИТР Наличка</option>
            <option value="ИТР Карта">💳 ИТР Карта</option>
        </select>
    </div>`;
    h += `<div id="exp-plan-date-group" class="form-group" style="display:none;"><label class="form-label">📅 Дата платежа</label><input type="date" id="exp-plan-date" class="form-input" value="${editData?.planned_payment_date||today}"></div>`;
    h += `<div class="form-group"><label class="form-label">📝 Комментарий</label><textarea id="exp-comment" class="form-input" rows="2">${escapeHtml(editData?.comment||'')}</textarea></div>`;
    h += `<button class="btn btn-primary" id="save-expense-btn">💾 ${editId?'Сохранить изменения':'Сохранить расход'}</button>`;
    
    document.getElementById('modal-title').textContent = editId ? '✏️ Редактировать расход' : '➕ Новый расход';
    document.getElementById('modal-content').innerHTML = h;
    document.getElementById('modal').classList.remove('hidden');
    
    // Предустановка значения плательщика при редактировании
    if (editData?.paid_by_name) {
        setTimeout(() => {
            const sel = document.getElementById('exp-paid-by');
            if (sel) sel.value = editData.paid_by_name;
        }, 150);
    }
    
    // Обработчик файла
    setTimeout(function() {
        const fileBtn = document.getElementById('exp-invoice-btn');
        const fileInput = document.getElementById('exp-invoice');
        const fileName = document.getElementById('exp-invoice-name');
        if (fileBtn && fileInput) {
            fileBtn.addEventListener('click', function() { fileInput.click(); });
            fileInput.addEventListener('change', function() {
                fileName.textContent = fileInput.files[0] ? '📎 ' + fileInput.files[0].name : 'Файл не выбран';
            });
        }
        window.toggleExpFieldsDDS();
    }, 200);
    
    document.getElementById('save-expense-btn').addEventListener('click', async function() {
        const name = document.getElementById('exp-name').value.trim();
        const amount = parseFloat(document.getElementById('exp-amount').value);
        if (!name || !amount || amount <= 0) { alert('Заполните наименование и сумму'); return; }
        
        const data = {
            project_id: document.getElementById('exp-project').value || null,
            name, amount,
            category: document.getElementById('exp-category').value,
            supplier: document.getElementById('exp-supplier').value,
            quantity: parseFloat(document.getElementById('exp-qty').value) || 1,
            date: document.getElementById('exp-date').value,
            payment_method: document.getElementById('exp-method').value,
            payment_type: document.getElementById('exp-method').value === 'cash' ? 'cash' : 'invoice',
            payment_status: document.getElementById('exp-status').value,
            is_urgent: document.getElementById('exp-urgent').checked,
            planned_payment_date: document.getElementById('exp-status').value === 'pending' ? document.getElementById('exp-plan-date').value : null,
            paid_by_name: document.getElementById('exp-status').value === 'paid' && document.getElementById('exp-method').value === 'cash' ? document.getElementById('exp-paid-by').value : null,
            comment: document.getElementById('exp-comment').value,
            expense_number: expNum
        };
        
        const fi = document.getElementById('exp-invoice');
        if (fi?.files[0]) {
            const fl = fi.files[0];
            const cn = fl.name.replace(/[^a-zA-Z0-9._-]/g, '_');
            const { data: up, error: ue } = await supabase.storage.from('reports').upload('invoices/'+Date.now()+'_'+cn, fl);
            if (!ue) { const { data: ud } = supabase.storage.from('reports').getPublicUrl(up.path); data.invoice_url = ud.publicUrl; data.invoice_name = fl.name; }
        }
        
        let result;
        if (editId) {
            result = await supabase.from('expenses').update(data).eq('id', editId);
        } else {
            result = await supabase.from('expenses').insert({...data, created_by: currentUser?.id});
            if (!result.error) await supabase.from('document_numbers').upsert({doc_type:'expense', number: parseInt(expNum.replace('№-RAS-',''))}, {onConflict:'doc_type'});
            
            if (data.payment_status === 'pending') {
                await supabase.from('custom_tasks').insert({
                    project_id: data.project_id,
                    title: (data.is_urgent?'🚨 ':'')+'Расход '+expNum+': '+name,
                    description: `Сумма: ${amount.toLocaleString()} ₸\nПоставщик: ${data.supplier||'—'}\nДата платежа: ${data.planned_payment_date||'—'}`,
                    status: 'pending', priority: data.is_urgent?'high':'medium', type: 'payment',
                    created_by: currentUser?.id, created_by_name: currentUser?.full_name
                });
            }
        }
        
        if (result.error) { alert('Ошибка: '+result.error.message); return; }
        document.getElementById('modal').classList.add('hidden');
        showMessage(editId?'✅ Расход обновлён':'✅ Расход добавлен','success');
        loadAllData();
    });
};
    
    window.editExpense = function(id) { window.openExpenseFormDDS(id); };
    
    // ===== ВЫПЛАТЫ =====
    function renderPayoutsList() {
        const all = [...allWorkOrders.map(o=>({...o,type:'order',amount:o.total_amount,date:o.payment_date||o.created_at?.split('T')[0],status:o.payment_status==='paid'?'paid':'pending'})),...allAdvances.map(a=>({...a,type:'advance',amount:a.amount,date:a.payment_date||a.created_at?.split('T')[0],status:a.status==='paid'?'paid':'pending'}))].sort((a,b)=>new Date(b.date)-new Date(a.date));
        const c = document.getElementById('payouts-list');
        if (!all.length) { c.innerHTML = '<div class="empty-state">Нет выплат</div>'; return; }
        c.innerHTML = all.map(x => `<div class="expense-card"><div class="expense-header"><span class="expense-title">${x.type==='order'?'📋 Наряд':'💳 Аванс'} ${escapeHtml(x.work_type||'')}</span><span class="expense-amount" style="color:var(--danger);">-${formatMoney(x.amount)}</span></div><div style="font-size:12px;color:var(--text-secondary);">👷 ${escapeHtml(x.brigades?.name||'—')} | 🏗️ ${escapeHtml(x.projects?.name||'—')}</div><div class="expense-meta"><span>📅 ${formatDate(x.date)}</span><span class="tag ${x.status==='paid'?'tag-green':'tag-yellow'}">${x.status==='paid'?'✅ Выплачен':'⏳ План'}</span></div></div>`).join('');
    }
    
    // ===== ФОРМА ПОСТУПЛЕНИЙ =====
    document.getElementById('show-income-form').addEventListener('click', () => {
        document.getElementById('modal-title').textContent = '➕ Поступление';
        document.getElementById('modal-content').innerHTML = `
            <div class="form-group"><label class="form-label">🏗️ Объект</label><select id="inc-project" class="form-input" onchange="updateIncCustomer()">${allProjects.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></div>
            <div class="form-group"><label class="form-label">🏢 Заказчик</label><input id="inc-customer" class="form-input" disabled></div>
            <div class="form-group"><label class="form-label">📋 Вид</label><select id="inc-type" class="form-input"><option>Аванс от заказчика</option><option>Сдача наряда заказчику</option><option>Доплата по договору</option></select></div>
            <div class="form-group"><label class="form-label">📄 Номер счёта</label><input id="inc-invoice" class="form-input"></div>
            <div class="grid-2"><div class="form-group"><label class="form-label">💰 Сумма *</label><input type="number" id="inc-amount" class="form-input" step="0.01"></div><div class="form-group"><label class="form-label">📅 Дата</label><input type="date" id="inc-date" class="form-input" value="${new Date().toISOString().split('T')[0]}"></div></div>
            <div class="form-group"><label class="form-label">📊 Статус</label><select id="inc-status" class="form-input"><option value="pending">⏳ Ожидается</option><option value="paid">✅ Оплачен</option></select></div>
            <button class="btn btn-primary" id="save-inc">💾 Сохранить</button>`;
        document.getElementById('modal').classList.remove('hidden');
        document.getElementById('save-inc').onclick = async () => {
            const a = parseFloat(document.getElementById('inc-amount').value);
            if (!a) { alert('Введите сумму'); return; }
            await supabase.from('incomes').insert({project_id:document.getElementById('inc-project').value||null,description:document.getElementById('inc-type').value,income_type:document.getElementById('inc-type').value,invoice_number:document.getElementById('inc-invoice').value,amount:a,date:document.getElementById('inc-date').value,status:document.getElementById('inc-status').value,created_by:currentUser?.id});
            document.getElementById('modal').classList.add('hidden'); showMessage('✅ Добавлено','success'); loadAllData();
        };
    });
    
    window.updateIncCustomer = function() {
        const p = allProjects.find(x => x.id === document.getElementById('inc-project')?.value);
        const el = document.getElementById('inc-customer'); if (el) el.value = p?.customer_company_name || '';
    };
    
    window.editIncome = function(id) {
        const i = allIncome.find(x => x.id === id); if (!i) return;
        document.getElementById('modal-title').textContent = '✏️ Поступление';
        document.getElementById('modal-content').innerHTML = `
            <div class="form-group"><label class="form-label">📋 Вид</label><input id="einc-type" class="form-input" value="${escapeHtml(i.income_type||'')}"></div>
            <div class="form-group"><label class="form-label">📄 Счёт</label><input id="einc-invoice" class="form-input" value="${escapeHtml(i.invoice_number||'')}"></div>
            <div class="grid-2"><div class="form-group"><label class="form-label">💰 Сумма</label><input type="number" id="einc-amount" class="form-input" step="0.01" value="${i.amount||''}"></div><div class="form-group"><label class="form-label">📅 Дата</label><input type="date" id="einc-date" class="form-input" value="${i.date||''}"></div></div>
            <div class="form-group"><label class="form-label">📊 Статус</label><select id="einc-status" class="form-input"><option value="pending" ${i.status==='pending'?'selected':''}>⏳ Ожидается</option><option value="paid" ${i.status==='paid'?'selected':''}>✅ Оплачен</option></select></div>
            <button class="btn btn-primary" id="save-einc">💾 Сохранить</button>`;
        document.getElementById('modal').classList.remove('hidden');
        document.getElementById('save-einc').onclick = async () => {
            await supabase.from('incomes').update({income_type:document.getElementById('einc-type').value,invoice_number:document.getElementById('einc-invoice').value,amount:parseFloat(document.getElementById('einc-amount').value),date:document.getElementById('einc-date').value,status:document.getElementById('einc-status').value}).eq('id',id);
            document.getElementById('modal').classList.add('hidden'); showMessage('✅ Обновлено','success'); loadAllData();
        };
    };
    
    document.getElementById('show-expense-form').addEventListener('click', () => window.openExpenseFormDDS());
    
    // ===== НАСТРОЙКИ =====
    function setupTabs() {
        document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', function() {
            document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
            this.classList.add('active'); document.getElementById('tab-'+this.dataset.tab).classList.add('active');
        }));
    }
    function showDownloadLink(url, type) {
    const modal = document.getElementById('modal');
    const title = type === 'Excel' ? '📥 Скачать Excel' : '📄 Печать PDF';
    const btnLabel = type === 'Excel' ? '🔗 Открыть Excel' : '🖨️ Открыть для печати';
    const hint = type === 'Excel' ? 'Скопируйте ссылку и откройте в браузере, чтобы скачать файл:' : 'Скопируйте ссылку и откройте в браузере. Нажмите Ctrl+P для сохранения PDF:';
    
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-content').innerHTML = `
        <div style="text-align:center;padding:20px;">
            <p style="margin-bottom:16px;">${hint}</p>
            <div style="background:#F8FAFC;padding:12px;border-radius:10px;word-break:break-all;font-size:12px;margin-bottom:16px;text-align:left;">${url}</div>
            <button class="btn btn-primary" onclick="navigator.clipboard.writeText('${url}');alert('✅ Ссылка скопирована!')">📋 Скопировать ссылку</button>
            <a href="${url}" target="_blank" class="btn btn-outline" style="margin-top:8px;text-decoration:none;">${btnLabel}</a>
        </div>
    `;
    modal.classList.remove('hidden');
}

window.exportToExcel = async function() {
    showMessage('⏳ Формирую отчёт...', 'success');
    
    const periodType = document.getElementById('filter-period-type')?.value || 'month';
    let periodLabel = '';
    const now = new Date();
    const months = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    
    if (periodType === 'month') {
        const val = document.getElementById('filter-period-month')?.value;
        if (val) { const [y, m] = val.split('-'); periodLabel = months[parseInt(m)-1] + ' ' + y; }
    } else if (periodType === 'quarter') {
        const q = Math.floor(now.getMonth() / 3) + 1;
        periodLabel = q + '-й квартал ' + now.getFullYear();
    } else if (periodType === 'year') {
        periodLabel = now.getFullYear() + ' год';
    } else {
        const from = document.getElementById('filter-date-from')?.value;
        const to = document.getElementById('filter-date-to')?.value;
        periodLabel = from + ' – ' + to;
    }
    
    const wb = XLSX.utils.book_new();
    
    const totalIncome = allIncome.filter(i => i.status === 'paid').reduce((s,i) => s + (i.amount||0), 0);
    const totalPlan = allIncome.filter(i => i.status === 'pending').reduce((s,i) => s + (i.amount||0), 0);
    const totalExp = allExpenses.filter(e => e.payment_status === 'paid').reduce((s,e) => s + (e.amount||0), 0);
    const totalPay = [...allWorkOrders.filter(o => o.payment_status === 'paid'), ...allAdvances.filter(a => a.status === 'paid')].reduce((s,x) => s + (x.amount||x.total_amount||0), 0);
    
    const summaryData = [
        ['ТОО "LamGroup Construction"'],
        ['ОТЧЁТ О ДВИЖЕНИИ ДЕНЕЖНЫХ СРЕДСТВ'],
        ['Период: ' + periodLabel],
        [''],
        ['Показатель', 'Сумма, ₸'],
        ['Поступления (факт)', totalIncome],
        ['Поступления (план)', totalPlan],
        ['Расходы (оплаченные)', totalExp],
        ['Выплаты бригадам', totalPay],
        [''],
        ['Чистый денежный поток', totalIncome - totalExp - totalPay],
        [''],
        ['Дата: ' + new Date().toLocaleDateString('ru-RU')],
        ['Ответственный: ' + (currentUser?.full_name || '—')]
    ];
    const ws1 = XLSX.utils.aoa_to_sheet(summaryData);
    ws1['!cols'] = [{wch:35}, {wch:20}];
    XLSX.utils.book_append_sheet(wb, ws1, 'Сводка');
    
    const objData = [['Объект', 'Поступления', 'План пост.', 'Расходы', 'Выплаты', 'Сальдо']];
    allProjects.forEach(p => {
        const inc = allIncome.filter(i => i.project_id === p.id && i.status === 'paid').reduce((s,i) => s + (i.amount||0), 0);
        const pln = allIncome.filter(i => i.project_id === p.id && i.status === 'pending').reduce((s,i) => s + (i.amount||0), 0);
        const exp = allExpenses.filter(e => e.project_id === p.id && e.payment_status === 'paid').reduce((s,e) => s + (e.amount||0), 0);
        const pay = [...allWorkOrders.filter(o => o.project_id === p.id && o.payment_status === 'paid'), ...allAdvances.filter(a => a.project_id === p.id && a.status === 'paid')].reduce((s,x) => s + (x.amount||x.total_amount||0), 0);
        objData.push([p.name, inc, pln, exp, pay, inc - exp - pay]);
    });
    const ws2 = XLSX.utils.aoa_to_sheet(objData);
    ws2['!cols'] = [{wch:25}, {wch:15}, {wch:15}, {wch:15}, {wch:15}, {wch:15}];
    XLSX.utils.book_append_sheet(wb, ws2, 'Объекты');
    
    const opsData = [['Дата', 'Тип', 'Объект', 'Описание', 'Сумма', 'Статус']];
    const allOps = [
        ...allIncome.map(i => [i.date, 'Поступление', i.projects?.name||'', i.description||'', i.amount||0, i.status==='paid'?'Оплачен':'Ожидается']),
        ...allExpenses.map(e => [e.date, 'Расход', e.projects?.name||'', e.name||'', -(e.amount||0), e.payment_status==='paid'?'Оплачен':'План']),
        ...allWorkOrders.map(o => [(o.payment_date||o.created_at?.split('T')[0]), 'Наряд', o.projects?.name||'', o.work_type||'', -(o.total_amount||0), o.payment_status==='paid'?'Выплачен':'План']),
        ...allAdvances.map(a => [(a.payment_date||a.created_at?.split('T')[0]), 'Аванс', a.projects?.name||'', 'Аванс', -(a.amount||0), a.status==='paid'?'Выплачен':'План'])
    ].sort((a,b) => new Date(b[0]) - new Date(a[0]));
    allOps.forEach(o => opsData.push(o));
    const ws3 = XLSX.utils.aoa_to_sheet(opsData);
    ws3['!cols'] = [{wch:12}, {wch:15}, {wch:20}, {wch:30}, {wch:15}, {wch:12}];
    XLSX.utils.book_append_sheet(wb, ws3, 'Операции');
    
    // Проверяем, где открыто
    const isTelegram = !!(window.Telegram?.WebApp?.initDataUnsafe?.user?.id);
    
    if (isTelegram) {
        const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
        const blob = new Blob([wbout], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        const file = new File([blob], 'dds_report.xlsx');
        const fileName = 'reports/' + Date.now() + '_dds_excel.xlsx';
        
        const { error: uploadError } = await supabase.storage.from('reports').upload(fileName, file, { cacheControl: '3600', upsert: true });
        if (uploadError) { showMessage('❌ Ошибка загрузки', 'error'); return; }
        
        const { data: urlData } = supabase.storage.from('reports').getPublicUrl(fileName);
        tg.openLink(urlData.publicUrl);
        
        // Резервный вариант — показать ссылку
        setTimeout(function() {
            showDownloadLink(urlData.publicUrl, 'Excel');
        }, 2000);
    } else {
        XLSX.writeFile(wb, `ДДС_LamGroup_${periodLabel.replace(/\s/g,'_')}.xlsx`);
    }
    
    showMessage('✅ Отчёт готов', 'success');
};

window.exportToPDF = async function() {
    showMessage('Формирую отчёт...', 'success');
    
    const months = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    const now = new Date();
    const periodType = document.getElementById('filter-period-type')?.value || 'month';
    let periodLabel = months[now.getMonth()] + ' ' + now.getFullYear();
    
    const totalIncome = allIncome.filter(i => i.status === 'paid').reduce((s,i) => s + (i.amount||0), 0);
    const totalExp = allExpenses.filter(e => e.payment_status === 'paid').reduce((s,e) => s + (e.amount||0), 0);
    const totalPay = [...allWorkOrders.filter(o => o.payment_status === 'paid'), ...allAdvances.filter(a => a.status === 'paid')].reduce((s,x) => s + (x.amount||x.total_amount||0), 0);
    
    let rows = '';
    allProjects.forEach(p => {
        const inc = allIncome.filter(i => i.project_id === p.id && i.status === 'paid').reduce((s,i) => s + (i.amount||0), 0);
        const exp = allExpenses.filter(e => e.project_id === p.id && e.payment_status === 'paid').reduce((s,e) => s + (e.amount||0), 0);
        const pay = [...allWorkOrders.filter(o => o.project_id === p.id && o.payment_status === 'paid'), ...allAdvances.filter(a => a.project_id === p.id && a.status === 'paid')].reduce((s,x) => s + (x.amount||x.total_amount||0), 0);
        rows += '<tr><td>' + escapeHtml(p.name) + '</td><td>' + inc.toLocaleString() + ' ₸</td><td>' + exp.toLocaleString() + ' ₸</td><td>' + pay.toLocaleString() + ' ₸</td><td>' + (inc-exp-pay).toLocaleString() + ' ₸</td></tr>';
    });
    
    // Простой HTML БЕЗ кнопок, БЕЗ скриптов авто-печати
    // Только чистый отчёт
    const html = '<!DOCTYPE html>' +
    '<html><head><meta charset="UTF-8"><title>ДДС LamGroup - ' + periodLabel + '</title>' +
    '<style>' +
    'body { font-family: Arial, sans-serif; font-size: 9pt; color: #000; padding: 8mm; margin: 0; }' +
    'h1 { font-size: 14pt; text-align: center; margin: 0 0 2px 0; }' +
    'h2 { font-size: 10pt; text-align: center; color: #555; margin: 0 0 10px 0; }' +
    'h3 { font-size: 9pt; border-bottom: 1px solid #ccc; padding-bottom: 2px; margin: 10px 0 5px 0; }' +
    'table { width: 100%; border-collapse: collapse; margin-bottom: 8px; }' +
    'th { background: #e8e8e8; padding: 3px 5px; text-align: left; font-size: 8pt; border: 1px solid #aaa; }' +
    'td { padding: 2px 5px; font-size: 8pt; border: 1px solid #ccc; }' +
    '.footer { text-align: center; font-size: 7pt; color: #999; margin-top: 14px; border-top: 1px solid #ccc; padding-top: 6px; }' +
    '@media print { body { padding: 10mm; } @page { size: A4 landscape; margin: 8mm; } }' +
    '</style></head><body>' +
    '<h1>ТОО "LamGroup Construction"</h1>' +
    '<h2>ОТЧЁТ О ДВИЖЕНИИ ДЕНЕЖНЫХ СРЕДСТВ<br>Период: ' + periodLabel + '</h2>' +
    '<h3>Сводка по объектам</h3>' +
    '<table><thead><tr><th>Объект</th><th>Поступления</th><th>Расходы</th><th>Выплаты</th><th>Сальдо</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<div class="footer">' +
    '<p>Дата: ' + new Date().toLocaleDateString('ru-RU') + ' | Ответственный: ' + (currentUser?.full_name || '—') + '</p>' +
    '<p>ТОО "LamGroup Construction" | г. Алматы, пр. Ермек Серкебаева, д. 97, н.п. 215 | +7 701 710 04 77</p>' +
    '</div>' +
    '</body></html>';
    
    // Загружаем в Supabase
    const blob = new Blob([html], { type: 'text/html;charset=UTF-8' });
    const file = new File([blob], 'dds_report.html', { type: 'text/html' });
    const fileName = 'reports/' + Date.now() + '_dds_report.html';
    
    const upResult = await supabase.storage.from('reports').upload(fileName, file, { cacheControl: '3600', upsert: true });
    
    if (upResult.error) {
        showMessage('Ошибка загрузки', 'error');
        return;
    }
    
    const urlResult = supabase.storage.from('reports').getPublicUrl(fileName);
    const publicUrl = urlResult.data.publicUrl;
    
    // Показываем модалку с ссылкой (без открытия новых окон)
    const modal = document.getElementById('modal');
    document.getElementById('modal-title').textContent = '📄 Отчёт готов';
    document.getElementById('modal-content').innerHTML = 
        '<div style="text-align:center;padding:16px;">' +
        '<p style="margin-bottom:12px;font-weight:600;">Ссылка на отчёт:</p>' +
        '<div style="background:#F8FAFC;padding:10px;border-radius:8px;word-break:break-all;font-size:11px;margin-bottom:12px;text-align:left;border:1px solid #ddd;">' + publicUrl + '</div>' +
        '<button class="btn btn-primary" onclick="navigator.clipboard.writeText(\'' + publicUrl + '\');alert(\'Ссылка скопирована! Откройте в браузере и нажмите Ctrl+P.\')" style="width:100%;">📋 Скопировать ссылку</button>' +
        '<p style="font-size:10px;color:#94A3B8;margin-top:10px;">Откройте ссылку в браузере<br>Нажмите Ctrl+P → Сохранить как PDF</p>' +
        '</div>';
    modal.classList.remove('hidden');
    
    showMessage('Отчёт готов', 'success');
};
function setupFilters() {
    document.getElementById('filter-project').addEventListener('change', e => { selectedProjectId = e.target.value; loadAllData(); });
    document.getElementById('export-excel')?.addEventListener('click', () => window.exportToExcel());
    document.getElementById('export-pdf')?.addEventListener('click', () => window.exportToPDF());
    
    const periodMonth = document.getElementById('filter-period-month');
    const dateFrom = document.getElementById('filter-date-from');
    const dateTo = document.getElementById('filter-date-to');
    const periodType = document.getElementById('filter-period-type');

    if (periodMonth) periodMonth.addEventListener('change', () => loadAllData());
    if (dateFrom) dateFrom.addEventListener('change', () => loadAllData());
    if (dateTo) dateTo.addEventListener('change', () => loadAllData());
    if (periodType) periodType.addEventListener('change', function() { window.changePeriodType(); });
    
    document.getElementById('prev-month').addEventListener('click', () => { currentDisplayDate.setMonth(currentDisplayDate.getMonth()-1); loadAllData(); });
    document.getElementById('next-month').addEventListener('click', () => { currentDisplayDate.setMonth(currentDisplayDate.getMonth()+1); loadAllData(); });
    document.getElementById('today-month').addEventListener('click', () => { currentDisplayDate = new Date(); loadAllData(); });
    document.getElementById('modal-close').addEventListener('click', () => document.getElementById('modal').classList.add('hidden'));
    document.getElementById('modal').addEventListener('click', function(e) { if (e.target === this) this.classList.add('hidden'); });
    document.getElementById('day-modal-close').addEventListener('click', () => document.getElementById('day-modal').classList.add('hidden'));
    document.getElementById('day-modal').addEventListener('click', function(e) { if (e.target === this) this.classList.add('hidden'); });
    
    document.querySelectorAll('.income-fb').forEach(b => b.addEventListener('click', function() {
        document.querySelectorAll('.income-fb').forEach(x => x.classList.remove('active'));
        this.classList.add('active'); incomeFilter = this.dataset.f; renderIncomeList();
    }));
    document.querySelectorAll('.expense-fb').forEach(b => b.addEventListener('click', function() {
        document.querySelectorAll('.expense-fb').forEach(x => x.classList.remove('active'));
        this.classList.add('active'); expenseFilter = this.dataset.f; renderExpenseList();
    }));
}    
    init();
})();

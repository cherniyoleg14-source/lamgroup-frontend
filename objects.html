<html lang="ru">
<head>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: #F8FAFC; padding: 16px; min-height: 100vh; -webkit-font-smoothing: antialiased; }
        .container { max-width: 600px; margin: 0 auto; }
        .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 8px; }
        .app-header h1 { font-size: 24px; font-weight: 800; color: #0F172A; letter-spacing: -0.5px; }
        .logo-badge { background: linear-gradient(135deg, #F59E0B, #F97316); color: white; padding: 4px 10px; border-radius: 30px; font-size: 11px; font-weight: 700; }
        .role-badge { background: #E2E8F0; color: #0F172A; padding: 6px 12px; border-radius: 30px; font-size: 12px; font-weight: 600; }
        .filter-bar { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
        .filter-bar::-webkit-scrollbar { display: none; }
        .filter-btn { padding: 8px 14px; border-radius: 30px; font-size: 13px; font-weight: 600; border: 1.5px solid #E2E8F0; background: white; color: #64748B; cursor: pointer; white-space: nowrap; }
        .filter-btn.active { background: #0F172A; color: white; border-color: #0F172A; }
        .objects-grid { display: flex; flex-direction: column; gap: 12px; }
        .object-card { background: white; border-radius: 20px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); cursor: pointer; border: 1px solid #F1F5F9; }
        .object-card:active { transform: scale(0.99); }
        .object-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .object-name { font-size: 16px; font-weight: 700; color: #0F172A; }
        .object-status { padding: 4px 10px; border-radius: 30px; font-size: 11px; font-weight: 700; }
        .status-preparation { background: #FEF3C7; color: #92400E; } .status-mobilization { background: #DBEAFE; color: #1E40AF; } .status-in_progress { background: #D1FAE5; color: #065F46; } .status-completed { background: #E2E8F0; color: #475569; }
        .object-address { font-size: 13px; color: #64748B; margin-bottom: 8px; }
        .progress-section { margin: 12px 0; } .progress-bar { height: 6px; background: #F1F5F9; border-radius: 30px; overflow: hidden; } .progress-fill { height: 100%; background: linear-gradient(90deg, #0F172A, #F59E0B); border-radius: 30px; width: 0%; }
        .object-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid #F1F5F9; font-size: 12px; color: #64748B; }
        .back-btn { background: none; border: none; color: #0F172A; font-size: 15px; font-weight: 600; cursor: pointer; padding: 8px 0; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
        .tabs-wrapper { position: relative; margin: 16px 0; }
        .tabs { display: flex; gap: 4px; overflow-x: auto; scroll-behavior: smooth; scrollbar-width: none; padding-bottom: 6px; border-bottom: 2px solid #E2E8F0; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab { padding: 8px 12px; background: none; border: none; font-weight: 600; color: #64748B; cursor: pointer; white-space: nowrap; font-size: 12px; border-bottom: 3px solid transparent; }
        .tab.active { color: #0F172A; border-bottom-color: #F59E0B; }
        .scroll-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; background: white; border: 1px solid #E2E8F0; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.1); z-index: 10; font-size: 16px; font-weight: 700; color: #0F172A; }
        .scroll-arrow.left { left: -15px; } .scroll-arrow.right { right: -15px; } .scroll-arrow.hidden { display: none; }
        .tab-content { display: none; } .tab-content.active { display: block; animation: fadeIn 0.3s ease; } @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .info-card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #F1F5F9; }
        .form-group { margin-bottom: 14px; } label { font-weight: 600; color: #475569; font-size: 12px; text-transform: uppercase; letter-spacing: 0.3px; display: block; margin-bottom: 4px; }
        input, select, textarea { width: 100%; padding: 12px 14px; border: 1.5px solid #E2E8F0; border-radius: 14px; font-size: 14px; background: white; font-family: 'Inter', sans-serif; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #F59E0B; box-shadow: 0 0 0 3px rgba(245,158,11,0.1); }
        .btn-primary { width: 100%; background: linear-gradient(135deg, #0F172A, #1E293B); color: white; padding: 14px; border-radius: 14px; font-weight: 700; border: none; cursor: pointer; margin-top: 10px; font-size: 15px; }
        .btn-secondary { background: #F8FAFC; color: #0F172A; padding: 8px 14px; border-radius: 12px; font-weight: 600; border: 1.5px solid #E2E8F0; cursor: pointer; font-size: 12px; }
        .btn-small { padding: 5px 10px; border-radius: 8px; font-size: 11px; font-weight: 600; cursor: pointer; border: none; }
        .btn-edit { background: #FEF3C7; color: #92400E; } .btn-delete { background: #FEE2E2; color: #991B1B; } .btn-add { background: #DBEAFE; color: #1E40AF; }
        .btn-pdf { background: #F3E8FF; color: #6B21A8; padding: 6px 12px; border-radius: 10px; font-weight: 600; border: 1px solid #D8B4FE; cursor: pointer; font-size: 12px; }
        .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .hidden { display: none !important; } .loading { text-align: center; padding: 40px 20px; color: #64748B; } .empty-state { text-align: center; padding: 40px 20px; background: white; border-radius: 20px; color: #64748B; }
        .message { padding: 14px; border-radius: 14px; margin: 14px 0; display: none; font-weight: 500; font-size: 14px; } .message.success { background: #D1FAE5; color: #065F46; display: block; } .message.error { background: #FEE2E2; color: #991B1B; display: block; }
        .gpr-item { background: white; border-radius: 16px; padding: 14px; margin-bottom: 10px; border: 1.5px solid #F1F5F9; }
        .axis-card { background: white; border-radius: 16px; padding: 14px; margin-bottom: 12px; border: 1.5px solid #E2E8F0; }
        .axis-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; } .axis-name { font-weight: 700; color: #0F172A; font-size: 15px; }
        .axis-dates { font-size: 12px; color: #64748B; margin-bottom: 8px; }
        .brigade-section { background: #F8FAFC; border-radius: 14px; padding: 14px; margin: 10px 0; border: 1px solid #E2E8F0; }
        .brigade-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; } .brigade-name { font-weight: 600; color: #0F172A; font-size: 14px; }
        .work-table { width: 100%; border-collapse: collapse; font-size: 12px; margin: 6px 0; } .work-table th { text-align: left; padding: 6px; background: #F1F5F9; color: #475569; font-weight: 600; font-size: 10px; } .work-table td { padding: 6px; border-bottom: 1px solid #F1F5F9; } .work-table .text-right { text-align: right; }
        .progress-input { width: 55px; padding: 5px 6px; border-radius: 8px; border: 1px solid #E2E8F0; text-align: center; font-size: 12px; }
        .status-badge-sm { padding: 3px 6px; border-radius: 20px; font-size: 10px; font-weight: 600; } .status-in_progress-sm { background: #D1FAE5; color: #065F46; } .status-pending-sm { background: #FEF3C7; color: #92400E; } .status-completed-sm { background: #E2E8F0; color: #475569; }
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 10002; } .modal.hidden { display: none !important; }
        .modal-content { background: white; border-radius: 24px; padding: 20px; max-width: 500px; width: 90%; max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.15); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; } .modal-title { font-size: 20px; font-weight: 800; color: #0F172A; } .close-btn { background: #F1F5F9; border: none; width: 36px; height: 36px; border-radius: 36px; font-size: 18px; cursor: pointer; color: #64748B; display: flex; align-items: center; justify-content: center; }
        .action-menu-modal { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-radius: 20px 20px 0 0; padding: 16px; z-index: 10003; box-shadow: 0 -4px 20px rgba(0,0,0,0.1); animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .action-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 10002; } .action-item { padding: 12px 16px; cursor: pointer; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 10px; }
        .fullscreen-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #F8FAFC; z-index: 10001; overflow-y: auto; padding: 16px; }
        .checklist-progress-container { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
        .checklist-stat-card { flex: 1; background: #F8FAFC; border-radius: 20px; padding: 16px; text-align: center; } .checklist-stat-value { font-size: 28px; font-weight: 800; color: #0F172A; } .checklist-stat-label { font-size: 12px; color: #64748B; }
        .checklist-item { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid #F1F5F9; } .checklist-item input[type="checkbox"] { width: 22px; height: 22px; accent-color: #F59E0B; cursor: pointer; } .checklist-item label { flex: 1; font-size: 14px; cursor: pointer; text-transform: none; }
        .filter-chip { padding: 6px 12px; border-radius: 30px; font-size: 12px; border: 1px solid #E2E8F0; background: white; cursor: pointer; } .filter-chip.active { background: #0F172A; color: white; border-color: #0F172A; }
    </style>
</head>
<body>
    <div class="container">
        <div id="list-view">
            <div class="app-header"><h1>LamGroup <span class="logo-badge">Construction</span></h1><span class="role-badge" id="role-badge"></span></div>
            <div class="filter-bar">
                <button class="filter-btn active" data-filter="all">Все</button><button class="filter-btn" data-filter="my">Мои</button>
                <button class="filter-btn" data-filter="preparation">Подготовка</button><button class="filter-btn" data-filter="in_progress">В работе</button><button class="filter-btn" data-filter="completed">Завершён</button>
            </div>
            <div id="objects-container"><div class="loading">Загрузка объектов...</div></div>
        </div>
        <div id="detail-view" class="hidden">
            <button class="back-btn" id="back-btn">← Назад</button>
            <div class="app-header"><h1 id="detail-name"></h1><span class="role-badge" id="detail-status-badge"></span></div>
            <div class="tabs-wrapper">
                <div class="scroll-arrow left hidden" id="scroll-left">←</div>
                <div class="tabs" id="tabs-container">
                    <button class="tab active" data-tab="info">📋 Инфо</button>
                    <button class="tab" data-tab="progress">📊 Прогресс</button>
                    <button class="tab" data-tab="history">📜 История</button>
                    <button class="tab" data-tab="expenses">💰 Расходы</button>
                    <button class="tab" data-tab="materials">📦 Материалы</button>
                    <button class="tab" data-tab="checklist">✅ Чек-лист</button>
                    <button class="tab" data-tab="issues">⚠️ Проблемы</button>
                    <button class="tab" data-tab="report">📑 Отчет</button>
                </div>
                <div class="scroll-arrow right" id="scroll-right">→</div>
            </div>
            <div id="tab-info" class="tab-content active"><div class="info-card" id="detail-content"></div></div>
            <div id="tab-progress" class="tab-content"><div id="progress-container"></div></div>
            <div id="tab-history" class="tab-content"><div id="history-container"></div></div>
            <div id="tab-expenses" class="tab-content"></div>
            <div id="tab-materials" class="tab-content"><div id="materials-container"></div></div>
            <div id="tab-checklist" class="tab-content"></div>
            <div id="tab-issues" class="tab-content"></div>
            <div id="tab-report" class="tab-content"></div>
        </div>
        <div id="axis-detail-page" class="fullscreen-modal hidden"></div>
        <div id="action-overlay" class="action-overlay hidden"></div>
        <div id="action-menu" class="action-menu-modal hidden"></div>
        <div id="form-modal" class="modal hidden"><div class="modal-content"><div class="modal-header"><span class="modal-title" id="form-modal-title"></span><button class="close-btn" id="close-form-modal">&times;</button></div><div id="form-modal-content"></div></div></div>
        <div id="edit-modal" class="modal hidden"><div class="modal-content"><div class="modal-header"><span class="modal-title" id="edit-modal-title"></span><button class="close-btn" id="close-edit-modal">&times;</button></div><div id="edit-modal-content"></div><button class="btn-primary" id="save-edit-btn">Сохранить</button></div></div>
        <div id="message" class="message"></div>
    </div>

<script>
window.closeActionMenu=function(){var m=document.getElementById('action-menu');var o=document.getElementById('action-overlay');if(m)m.classList.add('hidden');if(o)o.classList.add('hidden');};
window.closeAxisDetailPage=function(){var p=document.getElementById('axis-detail-page');if(p)p.classList.add('hidden');if(window._loadProgressTab)window._loadProgressTab();};
window.formatDate=function(d){if(!d)return'—';return new Date(d).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});};
window.formatDateShort=function(d){if(!d)return'—';return new Date(d).toLocaleDateString('ru-RU');};

(function(){
const tg=window.Telegram.WebApp;tg.expand();tg.ready();
const SUPABASE_URL='https://owagntywpiymqhbfoxye.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93YWdudHl3cGl5bXFoYmZveHllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzMTg5MDUsImV4cCI6MjA5MTg5NDkwNX0.p-3xAhbFgH5lcGnbBfkcQQFVza_Yc2qoY6VBlhmmFGg';
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let userId=tg.initDataUnsafe?.user?.id;if(!userId){alert('Ошибка авторизации');return;}
let currentUser=null,currentRole='worker',currentProjectId=null,currentFilter='all',allProjects=[],allBrigades=[],allWorkStages=[],currentAxisId=null;

function showMessage(t,ty){var m=document.getElementById('message');m.textContent=t;m.className='message '+ty;setTimeout(function(){m.className='message';},3000);}
function escapeHtml(t){if(!t)return'';return String(t).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]||c;});}

async function init(){await loadUser();await loadBrigades();await loadWorkStages();await loadProjects();setupFilters();setupTabs();setupTabsScroll();setupModals();}
async function loadUser(){var{data}=await supabase.from('users').select('*').eq('telegram_id',userId).single();if(data){currentUser=data;currentRole=data.role;}document.getElementById('role-badge').textContent=currentRole==='manager'?'Руководитель':currentRole==='worker'?'ИТР':'Монтажник';}
async function loadBrigades(){var{data}=await supabase.from('brigades').select('*').order('name');allBrigades=data||[];}
async function loadWorkStages(){var{data}=await supabase.from('work_stages').select('*').order('id');allWorkStages=data||[];}
async function loadProjects(){var query=supabase.from('projects').select('*, users!projects_responsible_worker_id_fkey(full_name)').order('created_at',{ascending:false});if(currentRole==='worker')query=query.eq('responsible_worker_id',currentUser?.id);var{data}=await query;allProjects=data||[];renderProjects();}

function renderProjects(){
var f=allProjects;
if(currentFilter==='my')f=allProjects.filter(function(p){return p.responsible_worker_id===currentUser?.id;});
else if(currentFilter!=='all')f=allProjects.filter(function(p){return p.status===currentFilter;});
var c=document.getElementById('objects-container');
if(!f.length){c.innerHTML='<div class="empty-state">🏗️ Нет объектов</div>';return;}
var h='<div class="objects-grid">';
f.forEach(function(p){var s={'preparation':'📋 Подготовка','mobilization':'🚚 Мобилизация','in_progress':'🔨 В работе','completed':'✅ Завершён'}[p.status]||p.status;
h+='<div class="object-card" data-id="'+p.id+'"><div class="object-header"><span class="object-name">'+p.name+'</span><span class="object-status status-'+p.status+'">'+s+'</span></div><div class="object-address">📍 '+p.address+'</div><div class="progress-section"><div class="progress-bar"><div class="progress-fill" style="width:0%"></div></div></div><div class="object-footer"><div>👤 '+(p.users?.full_name||'—')+'</div><div>📅 Старт: '+window.formatDateShort(p.start_date)+'</div><div>🏁 ГПР: '+window.formatDateShort(p.end_date_contract)+'</div></div></div>';});
c.innerHTML=h+'</div>';
c.querySelectorAll('.object-card').forEach(function(x){x.addEventListener('click',function(){showDetail(x.dataset.id);});});
}

function setupFilters(){document.querySelectorAll('.filter-btn').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('.filter-btn').forEach(function(x){x.classList.remove('active');});b.classList.add('active');currentFilter=b.dataset.filter;renderProjects();});});}
function setupTabs(){document.querySelectorAll('.tab').forEach(function(t){t.addEventListener('click',function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});document.querySelectorAll('.tab-content').forEach(function(x){x.classList.remove('active');});t.classList.add('active');document.getElementById('tab-'+t.dataset.tab).classList.add('active');
if(t.dataset.tab==='progress')loadProgressTab();if(t.dataset.tab==='history')loadHistoryTab();if(t.dataset.tab==='materials')loadMaterialsTab();if(t.dataset.tab==='checklist')loadChecklist();if(t.dataset.tab==='expenses')loadExpenses();if(t.dataset.tab==='issues')loadIssues();if(t.dataset.tab==='report')loadReports();});});}
function setupTabsScroll(){var tc=document.getElementById('tabs-container');var sl=document.getElementById('scroll-left');var sr=document.getElementById('scroll-right');if(!tc)return;function ua(){if(sl)sl.classList.toggle('hidden',tc.scrollLeft<=0);if(sr)sr.classList.toggle('hidden',tc.scrollLeft>=tc.scrollWidth-tc.clientWidth-1);}if(sl)sl.addEventListener('click',function(){tc.scrollBy({left:-200,behavior:'smooth'});});if(sr)sr.addEventListener('click',function(){tc.scrollBy({left:200,behavior:'smooth'});});tc.addEventListener('scroll',ua);window.addEventListener('resize',ua);setTimeout(ua,300);}
function setupModals(){document.getElementById('close-form-modal').onclick=function(){document.getElementById('form-modal').classList.add('hidden');};document.getElementById('close-edit-modal').onclick=function(){document.getElementById('edit-modal').classList.add('hidden');};document.getElementById('action-overlay').onclick=closeActionMenu;}

async function showDetail(id){
currentProjectId=id;
var{data:p}=await supabase.from('projects').select('*, users(full_name)').eq('id',id).single();if(!p)return;
document.getElementById('detail-name').textContent=p.name;
document.getElementById('detail-status-badge').textContent={'preparation':'📋 Подготовка','mobilization':'🚚 Мобилизация','in_progress':'🔨 В работе','completed':'✅ Завершён'}[p.status]||p.status;
document.getElementById('detail-content').innerHTML=
'<p style="margin-bottom:8px"><strong>📍 Адрес:</strong> '+p.address+' <button class="btn-small btn-edit" onclick="window.openEditField(\'address\',\''+escapeHtml(p.address)+'\')">✏️</button></p>'+
'<p style="margin-bottom:8px"><strong>💰 Цена договора:</strong> '+(p.contract_price?.toLocaleString()||0)+' ₸ <button class="btn-small btn-edit" onclick="window.openEditField(\'contract_price\',\''+(p.contract_price||0)+'\')">✏️</button></p>'+
'<p style="margin-bottom:8px"><strong>📐 Проектная площадь:</strong> '+(p.project_area||0)+' м² <button class="btn-small btn-edit" onclick="window.openEditField(\'project_area\',\''+(p.project_area||0)+'\')">✏️</button></p>'+
'<p style="margin-bottom:8px"><strong>📅 Начало:</strong> '+window.formatDate(p.start_date)+' <button class="btn-small btn-edit" onclick="window.openEditField(\'start_date\',\''+(p.start_date||'')+'\')">✏️</button></p>'+
'<p style="margin-bottom:8px"><strong>🏁 Окончание:</strong> '+window.formatDate(p.end_date_contract)+' <button class="btn-small btn-edit" onclick="window.openEditField(\'end_date_contract\',\''+(p.end_date_contract||'')+'\')">✏️</button></p>'+

async function loadProgressTab() {
    window._loadProgressTab = loadProgressTab;
    var container = document.getElementById('progress-container');
    container.innerHTML = '<div class="loading">Загрузка осей...</div>';
    
    var { data: blocks } = await supabase.from('blocks').select('id').eq('project_id', currentProjectId);
    if (!blocks?.length) { container.innerHTML = '<div class="empty-state">Нет блоков</div>'; return; }
    
    var { data: axes } = await supabase.from('axes').select('*').in('block_id', blocks.map(function(b) { return b.id; })).order('name');
    if (!axes?.length) { container.innerHTML = '<div class="info-card"><p>Нет осей.</p><button class="btn-primary" id="create-axis-btn">➕ Создать ось</button></div>'; document.getElementById('create-axis-btn').addEventListener('click', window.openCreateAxis); return; }
    
    var axisIds = axes.map(function(a) { return a.id; });
    var { data: allStages } = await supabase.from('axis_work_stages').select('*, brigades(name,company_name,no_ip), work_stages(name), axes(name)').in('axis_id', axisIds);
    
    var brigadesMap = {};
    (allStages || []).forEach(function(s) {
        if (!s.brigade_id) return;
        if (!brigadesMap[s.brigade_id]) brigadesMap[s.brigade_id] = { info: s.brigades, stages: [] };
        brigadesMap[s.brigade_id].stages.push(s);
    });
    
    var html = '';
    
    for (var i = 0; i < axes.length; i++) {
        var axis = axes[i]; var aId = axis.id; var aName = axis.name;
        var axisStages = (allStages || []).filter(function(s) { return s.axis_id === aId; });
        var brigades = [...new Set(axisStages.map(function(s) { return s.brigade_id; }).filter(Boolean))];
        var brigadeNames = axisStages.map(function(s){ return s.brigades?.name; }).filter(function(v,i,a){ return v && a.indexOf(v)===i; });
        var brigadeDisplay = brigadeNames.length ? brigadeNames.join(', ') : 'Нет бригад';
        var totalProgress = axisStages.length ? Math.round(axisStages.reduce(function(s,st) { return s + (st.progress||0); }, 0) / axisStages.length) : 0;
        var minStart = axisStages.length ? axisStages.reduce(function(min,st) { return st.plan_start && (!min || st.plan_start < min) ? st.plan_start : min; }, null) : null;
        var maxEnd = axisStages.length ? axisStages.reduce(function(max,st) { return st.plan_end && (!max || st.plan_end > max) ? st.plan_end : max; }, null) : null;
        html += '<div class="axis-card"><div class="axis-header"><span class="axis-name">🔵 Ось '+aName+'</span><span class="status-badge-sm status-'+(axis.status||'no_brigade')+'-sm">👷 '+brigadeDisplay+'</span></div><div class="axis-dates">📅 '+window.formatDateShort(minStart)+' — '+window.formatDateShort(maxEnd)+' | 📐 '+(axis.total_area||0)+' м² | 👥 Бригад: '+brigades.length+'</div><div class="progress-section"><div class="progress-bar"><div class="progress-fill" style="width:'+totalProgress+'%"></div></div><span style="font-size:11px">'+totalProgress+'%</span></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn-secondary open-axis-btn" data-id="'+aId+'">👁️ Открыть ГПР</button><button class="btn-small btn-edit edit-axis-btn" data-id="'+aId+'">✏️</button><button class="btn-small btn-delete delete-axis-btn" data-id="'+aId+'" data-name="'+escapeHtml(aName)+'">🗑️</button></div></div>';
    }
    
    html += '<div class="info-card" style="margin-top:16px;"><h3>📋 Сдать наряд по бригаде</h3><p style="font-size:12px;color:#64748B;margin-bottom:12px;">Выберите бригаду → отметьте этапы (100%) → сдайте наряд</p>';
    html += '<div class="form-group"><label>👷 Бригада</label><select id="submit-brigade-select" class="form-input"><option value="">Выберите бригаду...</option>';
    Object.keys(brigadesMap).forEach(function(bId) {
        var br = brigadesMap[bId].info;
        if (br) html += '<option value="'+bId+'">'+br.name+' ('+(br.foreman_name||'')+')</option>';
    });
    html += '</select></div>';
    html += '<div id="submit-stages-table"></div>';
    html += '<button class="btn-primary hidden" id="submit-selected-stages-btn" style="margin-top:12px;">📋 Сдать выбранные в наряд</button>';
    html += '</div>';
    html += '<button class="btn-primary" id="create-axis-btn2" style="margin-top:8px">➕ Добавить ось</button>';
    
    container.innerHTML = html;
    
    container.querySelectorAll('.open-axis-btn').forEach(function(btn) { btn.addEventListener('click', function() { window.openAxisDetailPage(btn.dataset.id); }); });
    container.querySelectorAll('.edit-axis-btn').forEach(function(btn) { btn.addEventListener('click', function() { window.openEditAxis(btn.dataset.id); }); });
    container.querySelectorAll('.delete-axis-btn').forEach(function(btn) { btn.addEventListener('click', function() { window.deleteAxisConfirm(btn.dataset.id, btn.dataset.name); }); });
    var createBtn2 = document.getElementById('create-axis-btn2'); if (createBtn2) createBtn2.addEventListener('click', window.openCreateAxis);
    
    document.getElementById('submit-brigade-select').addEventListener('change', function() {
        var bId = this.value;
        var tableDiv = document.getElementById('submit-stages-table');
        var submitBtn = document.getElementById('submit-selected-stages-btn');
        if (!bId) { tableDiv.innerHTML = ''; submitBtn.classList.add('hidden'); return; }
        var brData = brigadesMap[bId];
        var selectableStages = brData.stages.filter(function(s) { return (s.progress||0) >= 100 && s.status !== 'completed'; });
        if (!selectableStages.length) { tableDiv.innerHTML = '<p style="color:#64748B;padding:12px;">Нет этапов со 100% выполнением для сдачи.</p>'; submitBtn.classList.add('hidden'); return; }
        var totalCost = selectableStages.reduce(function(s, st) { return s + (st.total_cost||0); }, 0);
        var tableHtml = '<table class="work-table"><thead><tr><th>📋</th><th>Этап</th><th>Ось</th><th>м²</th><th>Сумма</th></tr></thead><tbody>';
        selectableStages.forEach(function(ws) {
            var axisLabel = (ws.axes?.name || '—') + (ws.sub_axis_name ? ' / ' + ws.sub_axis_name : '');
            tableHtml += '<tr><td><input type="checkbox" class="stage-select-cb" data-sid="'+ws.id+'" data-name="'+(ws.work_stages?.name||'—')+'" data-volume="'+(ws.volume||0)+'" data-cost="'+(ws.total_cost||0)+'" data-axisname="'+axisLabel+'" style="width:18px;height:18px;accent-color:#F59E0B;"></td><td>'+(ws.work_stages?.name||'—')+'</td><td>'+axisLabel+'</td><td class="text-right">'+(ws.volume||0)+' м²</td><td class="text-right">'+(ws.total_cost||0).toLocaleString()+' ₸</td></tr>';
        });
        tableHtml += '<tr style="font-weight:700;"><td colspan="4">💰 Общая сумма</td><td class="text-right">'+totalCost.toLocaleString()+' ₸</td></tr></tbody></table>';
        tableDiv.innerHTML = tableHtml;
        submitBtn.classList.remove('hidden');
    });
    
    document.getElementById('submit-selected-stages-btn').addEventListener('click', function() {
        var selected = [];
        document.querySelectorAll('.stage-select-cb:checked').forEach(function(cb) {
            selected.push({ id: cb.dataset.sid, name: cb.dataset.name, volume: parseFloat(cb.dataset.volume)||0, cost: parseFloat(cb.dataset.cost)||0, axisName: cb.dataset.axisname||'—' });
        });
        if (!selected.length) { alert('Выберите этапы для сдачи (галочками ✓)'); return; }
        var brigadeId = document.getElementById('submit-brigade-select').value;
        window.openWorkOrderFormWithStages(null, brigadeId, selected);
    });
}

        if (!name) { alert('Введите название оси'); return; }

        var bbs = document.querySelectorAll('.brigade-block'); var ms = null, me = null;
        for (const bl of bbs) { var bid = bl.querySelector('.brigade-select').value; var sn = bl.querySelector('.subaxis-name-input').value||''; var srs = bl.querySelectorAll('.stage-row');
            for (const rw of srs) { var sid = rw.querySelector('.stage-select').value; var vol = parseFloat(rw.querySelector('.stage-volume').value)||0; var pr = parseFloat(rw.querySelector('.stage-price').value)||0; var st = rw.querySelector('.stage-start').value; var en = rw.querySelector('.stage-end').value;
                if (sid && vol > 0) { if (st && (!ms || st < ms)) ms = st; if (en && (!me || en > me)) me = en; await supabase.from('axis_work_stages').insert({ axis_id: axis.id, brigade_id: bid||null, sub_axis_name: sn, stage_id: parseInt(sid), volume: vol, unit: 'м²', price_per_unit: pr, total_cost: vol*pr, plan_start: st||null, plan_end: en||null, progress: 0, status: 'pending', created_by: currentUser?.id }); } } }
        if (ms || me) await supabase.from('axes').update({ plan_start: ms, plan_end: me }).eq('id', axis.id);
        await supabase.from('change_history').insert({ project_id: currentProjectId, entity_type: 'axis', entity_id: axis.id, action: 'create_axis', comment: 'Ось создана: '+name, changed_by: currentUser?.id, changed_by_name: currentUser?.full_name });
        document.getElementById('form-modal').classList.add('hidden'); loadProgressTab(); alert('✅ Ось создана!');
    });
    document.getElementById('form-modal-content').appendChild(sb);

window.openAxisDetailPage = async function(axisId) {
    currentAxisId = axisId;
    const { data: axis } = await supabase.from('axes').select('*').eq('id', axisId).single();
    const { data: stages } = await supabase.from('axis_work_stages').select('*, brigades(name, foreman_name), work_stages(name)').eq('axis_id', axisId).order('plan_start');
    if (!axis) return;
    var axisNameForPage = axis.name;
    const brigades = [...new Set((stages||[]).map(function(s) { return s.brigade_id; }).filter(Boolean))];
    const totalProgress = stages?.length ? Math.round(stages.reduce(function(s,st) { return s + (st.progress||0); }, 0) / stages.length) : 0;
    var brigadeNames = (stages||[]).map(function(s){ return s.brigades?.name; }).filter(function(v,i,a){ return v && a.indexOf(v)===i; });
    var brigadeDisplay = brigadeNames.length ? brigadeNames.join(', ') : 'Нет бригад';
    var pageHtml = '<div style="max-width:600px;margin:0 auto"><button class="back-btn" id="close-axis-btn">← Назад</button><div class="info-card"><h3>📊 ГПР — Ось '+axisNameForPage+'</h3><span class="status-badge-sm status-'+(axis.status||'no_brigade')+'-sm">👷 '+brigadeDisplay+'</span><p>📅 '+window.formatDateShort(axis.plan_start)+' — '+window.formatDateShort(axis.plan_end)+' | 📐 '+(axis.total_area||0)+' м²</p><div class="progress-section"><div class="progress-bar"><div class="progress-fill" style="width:'+totalProgress+'%"></div></div><span>'+totalProgress+'%</span></div></div>';
    for (var b = 0; b < brigades.length; b++) {
        var brigadeId = brigades[b];
        var bs = (stages||[]).filter(function(s) { return s.brigade_id === brigadeId; }); var brigade = bs[0]?.brigades; var subAxisName = bs[0]?.sub_axis_name || '';
        var brProgress = Math.round(bs.reduce(function(s,st) { return s + (st.progress||0); }, 0) / bs.length);
        var allCompleted = bs.every(function(s) { return (s.progress||0) >= 100; });
        pageHtml += '<div class="brigade-section" data-brigade="'+brigadeId+'"><div class="brigade-header"><span class="brigade-name">👷 '+(brigade?.name||'Бригада')+'</span><span class="status-badge-sm '+(allCompleted?'status-completed-sm':'status-in_progress-sm')+'">'+(allCompleted?'✅ Завершена':'⚙️ В работе')+' '+brProgress+'%</span></div>'+(subAxisName?'<p>📍 '+subAxisName+'</p>':'')+'<table class="work-table"><thead><tr><th>Этап</th><th>м²</th><th>Цена</th><th>Сумма</th><th>%</th><th>📅</th></tr></thead><tbody>'+bs.map(function(ws) {

// Номер письма
async function getNextLetterNumber() {
    var { data } = await supabase.from('letters').select('letter_number').order('created_at', { ascending: false }).limit(1);
    var last = data?.[0]?.letter_number ? parseInt(data[0].letter_number) : 0;
    return String(last + 1);
}

// Формат номера
function formatLetterNumber(number, dateStr) {
    var d = new Date(dateStr);
    return '№ ' + number + '/LGC-ERP от ' + d.getDate() + ' ' + d.toLocaleDateString('ru-RU', { month: 'long' }) + ' ' + d.getFullYear() + ' г.';
}

// Дни
function getDaysWord(d) {
    d = Math.abs(d);
    if (d % 100 >= 11 && d % 100 <= 14) return 'календарных дней';
    if (d % 10 === 1) return 'календарный день';
    if (d % 10 >= 2 && d % 10 <= 4) return 'календарных дня';
    return 'календарных дней';
}

// HTML письма
function generateLetterHTML(data) {

window.openWorkOrderForm = async function(axId, brId) {

    h += '<div class="form-group"><label><input type="checkbox" id="narad-confirm" style="width:auto;"> ✅ Подтверждаю</label></div>';

    document.getElementById('form-modal-title').textContent = '📋 Сдать Наряд';
    document.getElementById('form-modal-content').innerHTML = h;
    document.getElementById('form-modal').classList.remove('hidden');

    sb.className = 'btn-primary';

        if (!document.getElementById('narad-confirm').checked) { alert('Подтвердите'); return; }

        for (var i = 0; i < cs.length; i++) {
            await supabase.from('axis_work_stages').update({ status: 'completed' }).eq('id', cs[i].id);

};

window.openAdvanceForm = async function(axId, brId) {
    // Загружаем ВСЕ этапы бригады на этом объекте (по всем осям)
    var { data: allStages } = await supabase.from('axis_work_stages').select('*, brigades(name,company_name,no_ip), work_stages(name), axes(name)').eq('brigade_id', brId);
    
    // Фильтруем только этапы этого объекта
    var { data: blocks } = await supabase.from('blocks').select('id').eq('project_id', currentProjectId);
    var blockIds = blocks ? blocks.map(function(b) { return b.id; }) : [];
    var { data: projectAxes } = await supabase.from('axes').select('id').in('block_id', blockIds);
    var projectAxisIds = projectAxes ? projectAxes.map(function(a) { return a.id; }) : [];
    
    var stages = (allStages || []).filter(function(s) { return projectAxisIds.indexOf(s.axis_id) !== -1; });
    
    if (!stages || !stages.length) { alert('Нет этапов у этой бригады на объекте'); return; }

    var br = stages[0]?.brigades;
    var ip = br?.no_ip ? 'Без ИП' : (br?.company_name || '—');

    // Общие суммы по всем осям
    var tct = stages.reduce(function(s, st) { return s + (st.total_cost || 0); }, 0);
    var da = stages.reduce(function(s, st) { return s + ((st.progress || 0) / 100 * (st.total_cost || 0)); }, 0);

    // Все выплаты бригаде на этом объекте
    var { data: pa } = await supabase.from('advances').select('*').eq('brigade_id', brId);
    var ap = (pa || []).filter(function(a) { return a.status === 'approved' || a.status === 'paid'; }).reduce(function(s, a) { return s + (a.amount || 0); }, 0);

    var { data: po } = await supabase.from('work_orders').select('*').eq('brigade_id', brId);
    var op = (po || []).filter(function(o) { return o.status === 'approved' || o.payment_status === 'paid'; }).reduce(function(s, o) { return s + (o.total_amount || 0); }, 0);

    var tpd = ap + op;
    // Общая сумма удержаний по всем нарядам бригады на объекте
    var totalGuarantee = (po || []).reduce(function(s, o) { return s + (o.guarantee_amount || 0); }, 0);

    // Номер аванса
    var { data: ln } = await supabase.from('document_numbers').select('number').eq('doc_type', 'advance').order('number', { ascending: false }).limit(1);
    var nn = (ln && ln.length) ? ln[0].number + 1 : 1;
    var an = '№-AVANS-' + nn + ' от ' + new Date().toLocaleDateString('ru-RU');

    // Группируем этапы по осям
    var axesMap = {};
    stages.forEach(function(s) {
        var key = s.axes?.name || 'Ось —';
        if (!axesMap[key]) axesMap[key] = [];
        axesMap[key].push(s);
    });

    // Строим таблицу по осям
    var stagesHtml = '';
    Object.keys(axesMap).forEach(function(axisName) {
        stagesHtml += '<tr><td colspan="4" style="background:#F1F5F9;font-weight:700;padding:8px;">📍 Ось ' + axisName + '</td></tr>';
        axesMap[axisName].forEach(function(s) {
            var p = s.progress || 0;
            var d = (p / 100 * (s.total_cost || 0));
            stagesHtml += '<tr><td>' + (s.sub_axis_name ? '└ ' + s.sub_axis_name + ' — ' : '') + (s.work_stages?.name || '—') + '</td><td class="text-right">' + (s.volume || 0) + ' м²</td><td class="text-right">' + p + '%</td><td class="text-right">' + d.toLocaleString() + ' ₸</td></tr>';
        });
    });

    var h = '<div class="form-group"><label class="form-label">📄 Номер аванса</label><input value="' + an + '" disabled class="form-input"></div>';
    h += '<div class="form-group"><label>Бригада</label><input value="' + (br?.name || '') + '" disabled class="form-input"></div>';
    h += '<div class="form-group"><label>ИП/ТОО</label><input value="' + ip + '" disabled class="form-input"></div>';
    h += '<div class="form-group"><label>👷 Работает на осях: ' + Object.keys(axesMap).length + ' шт.</label></div>';
    h += '<h4 style="margin:16px 0 8px;">📊 Состояние по всем осям</h4>';
    h += '<table class="work-table"><thead><tr><th>Этап</th><th>Объём</th><th>Прогресс</th><th>Выполнено</th></tr></thead><tbody>' + stagesHtml + '</tbody></table>';
    h += '<table class="calc-table" style="margin-top:16px;">';
    h += '<tr><td>📋 Общая сумма договора</td><td>' + tct.toLocaleString() + ' ₸</td></tr>';
    h += '<tr><td>✅ Выполнено работ (всего)</td><td>' + da.toLocaleString() + ' ₸</td></tr>';
    h += '<tr><td>💸 Всего выплачено</td><td>' + tpd.toLocaleString() + ' ₸</td></tr>';
    var debt = Math.max(0, tpd - da);
    var available = Math.max(0, da - tpd);
    if (debt > 0) h += '<tr style="background:#FEF2F2;"><td>⚠️ Долг бригады (взято вперёд)</td><td style="color:#EF4444;">' + debt.toLocaleString() + ' ₸</td></tr>';
    h += '<tr><td>📊 Доступно к выплате</td><td>' + available.toLocaleString() + ' ₸</td></tr>';
        h += '<tr><td>🔒 Общая сумма удержаний (10%)</td><td>' + totalGuarantee.toLocaleString() + ' ₸</td></tr>';
    h += '</table>';
    h += '<div class="form-group" style="margin-top:16px;"><label class="form-label">💰 Сумма аванса *</label><input type="number" id="advance-amount" class="form-input" step="0.01" placeholder="Введите сумму аванса"></div>';
    h += '<div class="form-group"><label class="form-label">Вид оплаты</label><select id="advance-payment-method" class="form-input"><option value="non_cash">💳 Безнал</option><option value="cash">💵 Наличка</option></select></div>';
    h += '<div class="checkbox-row" style="display:flex;align-items:center;gap:10px;margin-bottom:16px;"><input type="checkbox" id="advance-urgent" style="width:20px;height:20px;"><label style="font-size:14px;">🚨 Срочный платёж</label></div>';
    h += '<div class="form-group"><label><input type="checkbox" id="advance-confirm" style="width:auto;"> ✅ Подтверждаю</label></div>';

    document.getElementById('form-modal-title').textContent = '💰 Выдать Аванс';
    document.getElementById('form-modal-content').innerHTML = h;
    document.getElementById('form-modal').classList.remove('hidden');

    var sb = document.createElement('button');
    sb.className = 'btn-primary';
    sb.textContent = '💰 Выдать Аванс';
    sb.addEventListener('click', async function() {
        if (!document.getElementById('advance-confirm').checked) { alert('Подтвердите выдачу аванса'); return; }
        var am = parseFloat(document.getElementById('advance-amount').value) || 0;
        if (am <= 0) { alert('Введите сумму аванса'); return; }

        var iu = document.getElementById('advance-urgent').checked;
        var pm = document.getElementById('advance-payment-method').value;

        await supabase.from('advances').insert({

            status: 'pending',
            payment_method: pm,
            is_urgent: iu,
            advance_number: an
        });
        await supabase.from('document_numbers').insert({ doc_type: 'advance', number: nn });
        alert('✅ Аванс ' + an + ' на сумму ' + am.toLocaleString() + ' ₸ создан!');
        document.getElementById('form-modal').classList.add('hidden');
        if (document.getElementById('axis-detail-page').classList.contains('hidden')) loadProgressTab();

window.saveExpense = async function(expenseNumber, nextNum) {
    var dt = document.getElementById('expense-date').value;
    var ct = document.getElementById('expense-category').value;
    var nm = document.getElementById('expense-name').value.trim();
    var sp = document.getElementById('expense-supplier').value.trim();
    var qt = parseFloat(document.getElementById('expense-quantity').value) || 1;
    var am = parseFloat(document.getElementById('expense-amount').value);
    var pm = document.getElementById('expense-payment-method').value;
    var iu = document.getElementById('expense-urgent').checked;
    var ps = document.getElementById('expense-status').value;
    var pbs = document.getElementById('expense-paid-by');
    var pbn = pbs ? pbs.selectedOptions[0]?.text : null;
    var pd = ps === 'pending' ? document.getElementById('expense-plan-date').value : null;

    if (!nm || !am || am <= 0) { alert('Заполните наименование и сумму'); return; }

    var iuUrl = null, iuName = null;
    var fi = document.getElementById('expense-invoice');
    if (fi && fi.files[0]) {
        var fl = fi.files[0];
        iuName = fl.name;
        var cn = fl.name.replace(/[^a-zA-Z0-9._-]/g, '_');
        var fn = 'invoices/' + Date.now() + '_' + cn;
        var ue = await supabase.storage.from('reports').upload(fn, fl);
        if (!ue.error) { var ud = supabase.storage.from('reports').getPublicUrl(fn); iuUrl = ud.data.publicUrl; }
    }

    var ie = await supabase.from('expenses').insert({
        project_id: currentProjectId,
        date: dt,
        name: nm,
        category: ct,
        quantity: qt,
        amount: am,
        payment_type: pm === 'cash' ? 'cash' : 'invoice',
        payment_status: ps,
        supplier: sp || null,
        is_urgent: iu,
        payment_method: pm,
        invoice_url: iuUrl,
        invoice_name: iuName,
        created_by: currentUser?.id,
        expense_number: expenseNumber,
        paid_by_name: pbn,
        planned_payment_date: pd
    });

    if (ie.error) { alert('Ошибка: ' + ie.error.message); return; }

    await supabase.from('document_numbers').insert({ doc_type: 'expense', number: nextNum });

    if (ps === 'pending') {
        await supabase.from('custom_tasks').insert({
            project_id: currentProjectId,
            title: (iu ? '🚨 ' : '') + 'Расход ' + expenseNumber + ': ' + nm,
            description: 'Сумма: ' + am.toLocaleString() + ' ₸\nПоставщик: ' + (sp || '—') + '\nДата платежа: ' + (pd || '—'),
            status: 'pending',
            priority: iu ? 'high' : 'medium',
            type: 'payment',
            created_by: currentUser?.id,
            created_by_name: currentUser?.full_name
        });
    }

    document.getElementById('form-modal').classList.add('hidden');
    loadExpenses();
    showMessage('✅ Расход добавлен', 'success');
};

async function submitIssueMaterial() {
    var brigadeId = document.getElementById('issue-brigade').value;
    var axisName = document.getElementById('issue-axis').value;
    var comment = document.getElementById('issue-comment').value.trim();
    
    if (!brigadeId) { alert('Выберите бригаду'); return; }
    if (!axisName) { alert('Укажите ось / подось'); return; }
    
    var items = [];
    document.querySelectorAll('.issue-mat-check:checked').forEach(function(cb) {
        var qty = parseFloat(cb.parentElement.querySelector('.issue-mat-qty').value) || 0;
        var avail = parseFloat(cb.dataset.avail) || 0;
        if (qty > 0 && qty <= avail) {
            items.push({ material_id: cb.dataset.id, material_name: cb.dataset.name, unit: cb.dataset.unit, quantity: qty });
        }
    });
    
    if (!items.length) { alert('Выберите материалы и укажите количество'); return; }
    
    var waybillNumber = 'МН-' + new Date().getFullYear().toString().slice(-2) + '-' + Date.now().toString().slice(-6);
    var today = new Date().toISOString().split('T')[0];
    
    // Создаём накладную
    var { data: waybill, error: waybillError } = await supabase.from('material_waybills').insert({
        project_id: currentProjectId,
        brigade_id: brigadeId,
        waybill_number: waybillNumber,
        waybill_date: today,
        sub_axis_name: axisName,
        issued_by: currentUser?.id,
        issued_by_name: currentUser?.full_name,
        comment: comment || null
    }).select('id').single();
    
    if (waybillError) { alert('Ошибка: ' + waybillError.message); return; }
    
    // Добавляем позиции и списываем остатки
    for (var i = 0; i < items.length; i++) {
        var item = items[i];
        
        // Сохраняем позицию в накладной
        await supabase.from('material_waybill_items').insert({
            waybill_id: waybill.id,
            material_name: item.material_name,
            unit: item.unit,
            quantity: item.quantity
        });
        
        // Обновляем остатки в справочнике
        var { data: mat } = await supabase.from('material_catalog').select('available_quantity').eq('id', item.material_id).single();
        if (mat) {
            await supabase.from('material_catalog').update({
                available_quantity: mat.available_quantity - item.quantity,
                updated_at: new Date()
            }).eq('id', item.material_id);
        }
    }
    
    document.getElementById('form-modal').classList.add('hidden');
    await loadMaterialsTab();
    alert('✅ Материалы выданы. Накладная №' + waybillNumber + ' создана.');
}

        var photos = report.photos || [];
        var pt = photos.slice(0,3).map(p => '<img src="'+p.url+'" style="width:40px;height:40px;object-fit:cover;border-radius:8px;cursor:pointer;" onclick="window.open(\''+p.url+'\',\'_blank\')">').join('');
        h += '<div class="gpr-item" style="margin-bottom:12px;cursor:pointer;" onclick="window.viewReportDetails(\''+report.id+'\')"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px;"><div><strong>📄 Отчёт №'+report.report_number+' от '+new Date(report.report_date).toLocaleDateString('ru-RU')+'</strong></div><span style="font-size:12px;padding:4px 10px;border-radius:20px;background:'+(report.status==='confirmed'?'#D1FAE5':'#FEF3C7')+';color:'+(report.status==='confirmed'?'#065F46':'#92400E')+';">'+(report.status==='confirmed'?'✅ Проверен':'⏳ На проверке')+'</span></div><div style="font-size:13px;margin-bottom:6px;">📍 Оси: '+(report.axes_selected||[]).join(', ')+' | 📸 '+photos.length+' фото</div>'+(pt?'<div style="display:flex;gap:6px;margin:8px 0;">'+pt+'</div>':'')+'<div style="font-size:13px;margin-bottom:6px;">📝 '+(report.description||'').substring(0,100)+'</div></div>';
    }
    listContainer.innerHTML = h;
}
   window.openWorkOrderFormWithStages = async function(axId, brId, selectedStages) {
    // Данные оси (для заголовка)
    var { data: ax } = await supabase.from('axes').select('*').eq('id', axId).single();
    
    // Загружаем ВСЕ этапы бригады на объекте
    var { data: allStages } = await supabase.from('axis_work_stages').select('*, brigades(name,company_name,no_ip), work_stages(name), axes(name)').eq('brigade_id', brId);
    
    // Фильтруем только этапы этого объекта
    var { data: blocks } = await supabase.from('blocks').select('id').eq('project_id', currentProjectId);
    var blockIds = blocks ? blocks.map(function(b) { return b.id; }) : [];
    var { data: projectAxes } = await supabase.from('axes').select('id').in('block_id', blockIds);
    var projectAxisIds = projectAxes ? projectAxes.map(function(a) { return a.id; }) : [];
    var stages = (allStages || []).filter(function(s) { return projectAxisIds.indexOf(s.axis_id) !== -1; });
    
    var br = stages && stages.length ? stages[0]?.brigades : null;
    var ip = br?.no_ip ? 'Без ИП' : (br?.company_name || '—');

    // Сумма выбранных этапов
    var tc = selectedStages.reduce(function(s, st) { return s + (st.cost || 0); }, 0);
    var tv = selectedStages.reduce(function(s, st) { return s + (st.volume || 0); }, 0);

    // ОБЩИЕ выплаты по всем осям бригады на объекте
    var { data: pa } = await supabase.from('advances').select('*').eq('brigade_id', brId);
    var ap = (pa || []).filter(function(a) { return a.status === 'approved' || a.status === 'paid'; }).reduce(function(s, a) { return s + (a.amount || 0); }, 0);

    var { data: po } = await supabase.from('work_orders').select('*').eq('brigade_id', brId);
    var op = (po || []).filter(function(o) { return o.status === 'approved' || o.payment_status === 'paid'; }).reduce(function(s, o) { return s + (o.total_amount || 0); }, 0);

    var tpd = ap + op;
// Общая сумма удержаний
    var totalGuarantee = (po || []).reduce(function(s, o) { return s + (o.guarantee_amount || 0); }, 0);
    // Номер наряда
    var { data: ln } = await supabase.from('document_numbers').select('number').eq('doc_type', 'naryad').order('number', { ascending: false }).limit(1);
    var nn = (ln && ln.length) ? ln[0].number + 1 : 1;
    var on = '№-NAR-' + nn + ' от ' + new Date().toLocaleDateString('ru-RU');
    
    var gr = Math.round(tc * 0.10);
    var fp = tc - gr;

    // Таблица выбранных этапов с указанием осей
    var sl = selectedStages.map(function(s) {
        return '<tr><td>' + (s.name || '—') + '</td><td>' + (s.axisName || '—') + '</td><td class="text-right">' + (s.volume || 0) + ' м²</td><td class="text-right">' + (s.cost || 0).toLocaleString() + ' ₸</td></tr>';
    }).join('');

    var h = '<div class="form-group"><label class="form-label">📄 Номер наряда</label><input value="' + on + '" disabled class="form-input"></div>';
    h += '<div class="form-group"><label>Бригада</label><input value="' + (br?.name || '') + ' (' + (br?.foreman_name || '') + ')" disabled class="form-input"></div>';
    h += '<div class="form-group"><label>ИП/ТОО</label><input value="' + ip + '" disabled class="form-input"></div>';
    h += '<h4 style="margin:16px 0 8px;">📋 Выбранные этапы (по всем осям)</h4>';
    h += '<table class="work-table"><thead><tr><th>Вид работ</th><th>Ось</th><th>Объём</th><th>Сумма</th></tr></thead><tbody>' + sl + '</tbody></table>';
    h += '<table class="calc-table" style="margin-top:16px;">';
    h += '<tr><td>💰 Сумма закрываемых работ</td><td>' + tc.toLocaleString() + ' ₸</td></tr>';
    h += '<tr><td>💸 Сумма выплаченных денег (всего по бригаде)</td><td>' + (tpd > 0 ? tpd.toLocaleString() : '0') + ' ₸</td></tr>';
       h += '<tr><td>🔒 Общая сумма удержаний (10%)</td><td>' + totalGuarantee.toLocaleString() + ' ₸</td></tr>';
    h += '<tr><td>🔒 Удержание 10% (гарантийные)</td><td class="negative">-' + gr.toLocaleString() + ' ₸</td></tr>';
    h += '<tr class="total-row"><td>💳 ИТОГО К ОПЛАТЕ</td><td style="font-size:18px;color:var(--success);">' + fp.toLocaleString() + ' ₸</td></tr></table>';
    h += '<div class="checkbox-row" style="display:flex;align-items:center;gap:10px;margin-bottom:16px;"><input type="checkbox" id="narad-urgent" style="width:20px;height:20px;"><label style="font-size:14px;">🚨 Срочный платёж</label></div>';
    h += '<div class="form-group"><label><input type="checkbox" id="narad-confirm" style="width:auto;"> ✅ Подтверждаю</label></div>';

    document.getElementById('form-modal-title').textContent = '📋 Сдать Наряд';
    document.getElementById('form-modal-content').innerHTML = h;
    document.getElementById('form-modal').classList.remove('hidden');

    var sb = document.createElement('button');
    sb.className = 'btn-primary';
    sb.textContent = 'Сформировать наряд';
    sb.addEventListener('click', async function() {
        if (!document.getElementById('narad-confirm').checked) { alert('Подтвердите'); return; }
        var iu = document.getElementById('narad-urgent').checked;

        await supabase.from('work_orders').insert({
            project_id: currentProjectId,
            axis_name: 'Бригада: ' + (br?.name || '') + ' | Осей: ' + selectedStages.length + ' шт.',
            brigade_id: brId,
            work_type: 'Работы (выбранные)',
            volume: tv,
            total_amount: fp,
            original_amount: tc,
            guarantee_amount: gr,
            total_paid: tpd,
            created_by: currentUser?.id,
            status: 'pending',
            is_urgent: iu,
            order_number: on
        });
        await supabase.from('document_numbers').insert({ doc_type: 'naryad', number: nn });

        // Отмечаем выбранные этапы как completed
        for (var i = 0; i < selectedStages.length; i++) {
            await supabase.from('axis_work_stages').update({ status: 'completed' }).eq('id', selectedStages[i].id);
        }

        alert('✅ Наряд создан! Итоговая сумма к оплате: ' + fp.toLocaleString() + ' ₸');
        document.getElementById('form-modal').classList.add('hidden');
        window.openAxisDetailPage(currentAxisId);
    });
    document.getElementById('form-modal-content').appendChild(sb);
};
init();
})();

if (typeof window.openModal !== 'function') {
    window.openModal = function(title, content) {
        var modalTitle = document.getElementById('modal-title');
        var modalContent = document.getElementById('modal-content');
        var modal = document.getElementById('modal');
        if (modalTitle) modalTitle.textContent = title;
        if (modalContent) modalContent.innerHTML = content;
        if (modal) modal.classList.remove('hidden');
    };
}

if (typeof window.formatDate !== 'function') {
    window.formatDate = function(d) {
        if (!d) return '—';
        return new Date(d).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
    };
}

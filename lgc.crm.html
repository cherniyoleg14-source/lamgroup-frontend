<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LamGroup CRM</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        
                :root {
            --bg: #F8FAFC; --card: #FFFFFF; --text: #0F172A; --text-secondary: #64748B;
            --border: #E2E8F0; --gold: #F59E0B; --primary: #0F172A; --success: #10B981;
            --danger: #EF4444; --warning: #F59E0B; --info: #3B82F6;
            --sidebar-width: 240px; --header-height: 64px;
            --shadow: 0 4px 16px rgba(0,0,0,0.06); --radius: 12px; --radius-lg: 16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        .auth-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%); display: flex; align-items: center; justify-content: center; z-index: 10000; padding: 20px; }
        .auth-overlay.hidden { display: none; }
        .auth-card { background: white; border-radius: 24px; padding: 40px 36px; text-align: center; max-width: 440px; width: 100%; box-shadow: 0 25px 60px rgba(0,0,0,0.3); }
        .auth-card .logo { font-size: 40px; margin-bottom: 4px; }
        .auth-card h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
        .auth-card .subtitle { font-size: 12px; color: var(--text-secondary); margin-bottom: 24px; }
        .form-group { margin-bottom: 14px; text-align: left; }
        .form-group label { display: block; font-size: 11px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 14px; font-family: inherit; }
        .form-input:focus { outline: none; border-color: var(--gold); }
        .btn { padding: 12px 20px; border-radius: 12px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; width: 100%; transition: all 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-telegram { background: linear-gradient(135deg, #2AABEE, #229ED9); color: white; }
        .btn-qr { background: #F1F5F9; color: var(--text); }
        .btn-outline { background: white; border: 1.5px solid var(--border); color: var(--text); }
        .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: var(--text-secondary); font-size: 12px; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
        .auth-error { color: var(--danger); font-size: 12px; margin-top: 8px; display: none; }
        .qr-popup { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 10001; align-items: center; justify-content: center; }
        .qr-popup.show { display: flex; }
        .qr-popup-content { background: white; border-radius: 20px; padding: 30px; text-align: center; }
        .qr-popup-content canvas { margin: 16px auto; }

        .app-layout { display: flex; min-height: 100vh; }
        .app-layout.hidden { display: none; }
        .sidebar { width: var(--sidebar-width); background: white; border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; }
        .sidebar-logo { padding: 20px 24px; font-weight: 800; font-size: 17px; border-bottom: 1px solid var(--border); }
        .sidebar-nav { flex: 1; padding: 12px 8px; }
        .sidebar-nav a { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 10px; text-decoration: none; color: var(--text-secondary); font-size: 13px; font-weight: 500; margin-bottom: 2px; }
        .sidebar-nav a:hover, .sidebar-nav a.active { background: #F1F5F9; color: var(--text); font-weight: 600; }
        .sidebar-user { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; font-size: 13px; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; }
        .main-content { flex: 1; margin-left: var(--sidebar-width); }
        .page-header { background: white; border-bottom: 1px solid var(--border); padding: 0 32px; height: var(--header-height); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
        .page-body { padding: 24px 32px; }
        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .kpi-card { background: white; border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow); }
        .kpi-value { font-size: 26px; font-weight: 800; }
        .kpi-label { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; margin-top: 4px; }
        .card { background: white; border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow); margin-bottom: 24px; }
        .card h2 { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #F8FAFC; padding: 10px 12px; text-align: left; font-weight: 600; font-size: 11px; color: var(--text-secondary); text-transform: uppercase; border-bottom: 2px solid var(--border); }
        td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
        .gantt-bar-wrap { background: #F1F5F9; border-radius: 6px; height: 22px; overflow: hidden; }
        .gantt-bar { height: 100%; border-radius: 6px; display: flex; align-items: center; padding-left: 8px; font-size: 10px; font-weight: 600; color: white; }
        .gantt-bar.green { background: #10B981; } .gantt-bar.yellow { background: #F59E0B; } .gantt-bar.red { background: #EF4444; } .gantt-bar.blue { background: #3B82F6; }
        .tag { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .tag-green { background: #D1FAE5; color: #065F46; } .tag-yellow { background: #FEF3C7; color: #92400E; } .tag-red { background: #FEE2E2; color: #991B1B; } .tag-blue { background: #DBEAFE; color: #1E40AF; }
        .hidden { display: none !important; }
        .text-success { color: var(--success); } .text-danger { color: var(--danger); } .text-warning { color: var(--warning); }
        .table-wrap { overflow-x: auto; }

        /* МОДАЛЬНОЕ ОКНО */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15,23,42,0.7); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            z-index: 10001; padding: 20px;
        }
        .modal-overlay.hidden { display: none; }
        .modal-card {
            background: white; border-radius: 20px; padding: 28px 24px;
            max-width: 580px; width: 100%; max-height: 85vh; overflow-y: auto;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            position: relative;
        }
        .modal-field { margin-bottom: 12px; }
        .modal-field-label { font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .modal-field-value { font-size: 14px; font-weight: 500; }
        .modal-actions { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
        .modal-actions .btn { width: auto; }
        .calc-table-compact { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 13px; }
        .calc-table-compact td { padding: 6px 10px; border-bottom: 1px solid var(--border); }
        .calc-table-compact td:last-child { text-align: right; font-weight: 600; }
        .calc-table-compact .total-row { background: #F8FAFC; font-weight: 700; font-size: 15px; }
        .calc-table-compact .negative { color: var(--danger); }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; }
            .kpi-grid { grid-template-columns: repeat(2, 1fr); }
            .page-body { padding: 16px; }
            .mobile-menu-btn { display: block !important; }
        }
        .mobile-menu-btn { display: none; background: none; border: none; font-size: 24px; cursor: pointer; }
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 99; }
        .sidebar-overlay.open { display: block; }
        .btn-sm-compact { padding: 6px 12px; font-size: 11px; border-radius: 8px; font-weight: 500; width: auto; min-width: auto; }
        .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
        .btn-group .btn { width: auto; flex: 0 0 auto; }
        .task-card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
        .task-card-item { background: white; border-radius: var(--radius); padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid var(--border); cursor: pointer; transition: all 0.2s; }
        .task-card-item:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); transform: translateY(-1px); }
        .task-card-item.overdue { border-left: 4px solid var(--danger); }
        .task-card-item .task-priority { font-size: 16px; }
        .task-card-item .task-name { font-weight: 600; font-size: 14px; margin: 6px 0; }
        .task-card-item .task-info { font-size: 11px; color: var(--text-secondary); display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
        .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 768px) {
            .detail-grid { grid-template-columns: 1fr; }
            .task-card-grid { grid-template-columns: 1fr; }
        }
                /* ===== МОДАЛЬНОЕ ОКНО ФИНАНСОВ ===== */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15,23,42,0.7); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            z-index: 10001; padding: 20px;
        }
        .modal-overlay.hidden { display: none; }
        .modal-card-finance {
            background: white; border-radius: 20px; padding: 28px 24px;
            max-width: 580px; width: 100%; max-height: 85vh; overflow-y: auto;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25); position: relative;
        }
        .modal-field { margin-bottom: 12px; }
        .modal-field-label { font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .modal-field-value { font-size: 14px; font-weight: 500; }
        .modal-actions { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
        .modal-actions .btn { width: auto; }
        .calc-table-compact { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 13px; }
        .calc-table-compact td { padding: 6px 10px; border-bottom: 1px solid var(--border); }
        .calc-table-compact td:last-child { text-align: right; font-weight: 600; }
        .calc-table-compact .total-row { background: #F8FAFC; font-weight: 700; font-size: 15px; }
        .calc-table-compact .negative { color: var(--danger); }
    </style>
</head>
<body>

    <div class="auth-overlay" id="auth-overlay">
        <div class="auth-card">
            <div class="logo">🏗️</div>
            <h1>LamGroup CRM</h1>
            <p class="subtitle">Войдите в систему управления проектами</p>
            <div id="manual-login-form">
                <div class="form-group"><label>📱 Telegram ID</label><input type="text" id="auth-tg-id" class="form-input" placeholder="Например: 531738802"></div>
                <div class="form-group"><label>🔑 Пароль</label><input type="password" id="auth-password" class="form-input" placeholder="Введите пароль"></div>
                <button class="btn btn-primary" onclick="loginWithPassword()">🔐 Войти</button>
                <p class="auth-error" id="auth-error">⛔ Неверный ID или пароль</p>
            </div>
            <div class="divider">или</div>
            <button class="btn btn-telegram" onclick="loginWithTelegram()">🔵 Войти через Telegram</button>
            <button class="btn btn-qr" onclick="showQRCode()" style="margin-top:8px;">📱 Вход по QR-коду</button>
        </div>
    </div>

    <div class="qr-popup" id="qr-popup">
        <div class="qr-popup-content">
            <h3>📱 Вход по QR-коду</h3>
            <p style="font-size:12px;color:var(--text-secondary);">Отсканируйте чтобы открыть CRM в Telegram</p>
            <div id="qr-code"></div>
            <button class="btn btn-primary" onclick="closeQR()">Закрыть</button>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ФИНАНСОВ -->
    <div class="modal-overlay hidden" id="finance-modal-overlay" onclick="if(event.target===this)closeFinanceModal()">
        <div class="modal-card" id="finance-modal-card"></div>
    </div>
    <!-- МОДАЛЬНОЕ ОКНО ФИНАНСОВ -->
    <div class="modal-overlay hidden" id="finance-modal-overlay" onclick="if(event.target===this)window.closeFinanceModal()">
        <div class="modal-card-finance" id="finance-modal-card"></div>
    </div>
    <div class="app-layout hidden" id="app-layout">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-logo">🏗️ LamGroup</div>
            <nav class="sidebar-nav">
                <a href="#" class="active" data-page="dashboard">🏠 Дашборд</a>
                <a href="#" data-page="objects">🏗️ Объекты</a>
                <a href="#" data-page="tasks">📋 Задачи</a>
                <a href="#" data-page="finances">💰 Финансы</a>
            </nav>
            <div class="sidebar-user">
                <div class="avatar" id="user-avatar">?</div>
                <div><div style="font-weight:600;" id="user-name">—</div><div style="font-size:11px;color:var(--text-secondary);" id="user-role">—</div></div>
            </div>
        </div>
        <div class="sidebar-overlay" id="sidebar-overlay"></div>
        <div class="main-content">
            <header class="page-header">
                <div style="display:flex;align-items:center;gap:8px;">
                    <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
                    <h1 id="page-title">🏠 Дашборд</h1>
                </div>
                <button class="tag tag-red" id="logout-btn" style="cursor:pointer;border:none;">Выйти</button>
            </header>
            <div class="page-body" id="page-body"></div>
        </div>
    </div>

<script>
(function() {
    const SUPABASE_URL = 'https://owagntywpiymqhbfoxye.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93YWdudHl3cGl5bXFoYmZveHllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzMTg5MDUsImV4cCI6MjA5MTg5NDkwNX0.p-3xAhbFgH5lcGnbBfkcQQFVza_Yc2qoY6VBlhmmFGg';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    let currentUser = null;

    function formatMoney(a) { return (a || 0).toLocaleString() + ' ₸'; }
    function escapeHtml(t) { if (!t) return ''; return String(t).replace(/[&<>]/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c] || c; }); }
    function formatDate(d) { if (!d) return '—'; return new Date(d).toLocaleDateString('ru-RU'); }

    async function hashPassword(password) {
        const msgBuffer = new TextEncoder().encode(password);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
    }

    function saveSession(user) {
        localStorage.setItem('lamgroup_crm_user', JSON.stringify({
            id: user.id, telegram_id: user.telegram_id,
            full_name: user.full_name, role: user.role, phone: user.phone
        }));
    }
    function loadSession() {
        const saved = localStorage.getItem('lamgroup_crm_user');
        if (saved) { try { return JSON.parse(saved); } catch(e) { return null; } }
        return null;
    }
    function clearSession() { localStorage.removeItem('lamgroup_crm_user'); }

    async function checkAuth() {
        const savedUser = loadSession();
        if (savedUser && savedUser.id) {
            const result = await supabase.from('users').select('*').eq('id', savedUser.id).single();
            if (result.data) { currentUser = result.data; enterApp(); return; }
            clearSession();
        }
        document.getElementById('auth-overlay').classList.remove('hidden');
        document.getElementById('app-layout').classList.add('hidden');
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) loginWithTelegram();
    }

    window.loginWithPassword = async function() {
        const tgId = document.getElementById('auth-tg-id').value.trim();
        const password = document.getElementById('auth-password').value.trim();
        if (!tgId || !password) return;
        const result = await supabase.from('users').select('*').eq('telegram_id', parseInt(tgId));
        if (!result.data || !result.data.length) { document.getElementById('auth-error').style.display = 'block'; return; }
        const user = result.data[0];
        const hashed = await hashPassword(password);
        if (user.password_hash !== hashed) { document.getElementById('auth-error').style.display = 'block'; return; }
        currentUser = user;
        enterApp();
    };

    window.loginWithTelegram = async function() {
        if (!tg) return;
        const tgUser = tg.initDataUnsafe && tg.initDataUnsafe.user;
        if (!tgUser) return;
        const result = await supabase.from('users').select('*').eq('telegram_id', tgUser.id);
        if (!result.data || !result.data.length) { document.getElementById('auth-error').style.display = 'block'; return; }
        currentUser = result.data[0];
        const fullName = tgUser.first_name + ' ' + (tgUser.last_name || '');
        if (fullName !== currentUser.full_name) {
            await supabase.from('users').update({ full_name: fullName }).eq('id', currentUser.id);
            currentUser.full_name = fullName;
        }
        enterApp();
    };

    window.showQRCode = function() {
        document.getElementById('qr-popup').classList.add('show');
        document.getElementById('qr-code').innerHTML = '';
        new QRCode(document.getElementById('qr-code'), {
            text: 'https://t.me/LGCFASAD_bot/app',
            width: 200, height: 200,
            colorDark: '#0F172A', colorLight: '#FFFFFF'
        });
    };
    window.closeQR = function() { document.getElementById('qr-popup').classList.remove('show'); };

    function enterApp() {
        saveSession(currentUser);
        document.getElementById('auth-overlay').classList.add('hidden');
        document.getElementById('app-layout').classList.remove('hidden');
        document.getElementById('user-avatar').textContent = (currentUser.full_name || '?')[0].toUpperCase();
        document.getElementById('user-name').textContent = currentUser.full_name || '—';
        document.getElementById('user-role').textContent = currentUser.role === 'manager' ? 'Руководитель' : currentUser.role === 'worker' ? 'ИТР' : 'Бухгалтер';
        setupNavigation();
        loadPage('dashboard');
    }

    function setupNavigation() {
        document.querySelectorAll('.sidebar-nav a').forEach(function(link) {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                document.querySelectorAll('.sidebar-nav a').forEach(function(l) { l.classList.remove('active'); });
                this.classList.add('active');
                loadPage(this.dataset.page);
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('sidebar-overlay').classList.remove('open');
            });
        });
        var mobileBtn = document.getElementById('mobile-menu-btn');
        if (mobileBtn) {
            mobileBtn.addEventListener('click', function() {
                document.getElementById('sidebar').classList.toggle('open');
                document.getElementById('sidebar-overlay').classList.toggle('open');
            });
        }
        var overlay = document.getElementById('sidebar-overlay');
        if (overlay) {
            overlay.addEventListener('click', function() {
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('sidebar-overlay').classList.remove('open');
            });
        }
        var logoutBtn = document.getElementById('logout-btn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', function() {
                clearSession(); currentUser = null;
                document.getElementById('auth-overlay').classList.remove('hidden');
                document.getElementById('app-layout').classList.add('hidden');
            });
        }
    }

    window.loadPage = async function(page) {
        const container = document.getElementById('page-body');
        container.innerHTML = '<div style="text-align:center;padding:60px;">Загрузка...</div>';
        var titles = { dashboard:'🏠 Дашборд', objects:'🏗️ Объекты', tasks:'📋 Задачи', finances:'💰 Финансы' };
        document.getElementById('page-title').textContent = titles[page] || '';
        switch(page) {
            case 'dashboard': await loadDashboard(container); break;
            case 'objects': await loadObjectsPage(container); break;
            case 'tasks': await loadTasksPage(container); break;
            case 'finances': await loadFinancesPage(container); break;
        }
    };

    async function loadDashboard(container) {
        var projResult = await supabase.from('projects').select('*', { count: 'exact' });
        var tasksResult = await supabase.from('custom_tasks').select('*', { count: 'exact' }).in('status', ['pending','in_progress']);
        var axesResult = await supabase.from('axes').select('*, blocks!inner(projects(name))');
        var axes = axesResult.data || [];
        
        var projectProgress = {};
        axes.forEach(function(ax) {
            var name = (ax.blocks && ax.blocks.projects && ax.blocks.projects.name) ? ax.blocks.projects.name : 'Без объекта';
            if (!projectProgress[name]) projectProgress[name] = { total: 0, count: 0 };
            projectProgress[name].total += (ax.progress || 0);
            projectProgress[name].count++;
        });
        var labels = Object.keys(projectProgress);
        var data = labels.map(function(k) { return Math.round(projectProgress[k].total / projectProgress[k].count); });

        container.innerHTML = '<div class="kpi-grid">' +
            '<div class="kpi-card"><div style="font-size:24px;">🏗️</div><div class="kpi-value">' + (projResult.count || 0) + '</div><div class="kpi-label">Объектов</div></div>' +

    async function loadObjectsPage(container) {
        var q = supabase.from('projects').select('*').order('name');
        if (currentUser.role !== 'manager') q = q.eq('responsible_worker_id', currentUser.id);
        var result = await q;
        var projects = result.data || [];
        if (!projects.length) { container.innerHTML = '<div class="card"><p style="text-align:center;padding:40px;">Нет объектов</p></div>'; return; }

        var projectIds = projects.map(function(p) { return p.id; });
        var blocksResult = await supabase.from('blocks').select('id, project_id').in('project_id', projectIds);
        var blocks = blocksResult.data || [];
        var blockIds = blocks.map(function(b) { return b.id; });
        var axesMap = {};
        if (blockIds.length) {
            var axesResult = await supabase.from('axes').select('progress, status, block_id').in('block_id', blockIds);
            (axesResult.data || []).forEach(function(ax) {
                var block = blocks.find(function(b) { return b.id === ax.block_id; });
                if (block) {
                    if (!axesMap[block.project_id]) axesMap[block.project_id] = [];
                    axesMap[block.project_id].push(ax);
                }
            });
        }
        var issuesResult = await supabase.from('project_issues').select('project_id').in('status', ['open','in_progress']);
        var issuesMap = {};
        (issuesResult.data || []).forEach(function(i) { issuesMap[i.project_id] = (issuesMap[i.project_id] || 0) + 1; });

        var inProgress = 0, completed = 0, overdue = 0;
        projects.forEach(function(p) {
            var axes = axesMap[p.id] || [];
            var allDone = axes.length > 0 && axes.every(function(a) { return a.status === 'completed'; });
            if (allDone) completed++;
            else if (axes.some(function(a) { return a.status === 'in_progress' || a.progress > 0; })) inProgress++;
            if (p.end_date_contract && new Date(p.end_date_contract) < new Date() && !allDone) overdue++;
        });

        var html = '<div class="kpi-grid">' +
            '<div class="kpi-card"><div style="font-size:24px;">🏗️</div><div class="kpi-value">' + projects.length + '</div><div class="kpi-label">Всего</div></div>' +
            '<div class="kpi-card"><div style="font-size:24px;">🔵</div><div class="kpi-value" style="color:var(--info);">' + inProgress + '</div><div class="kpi-label">В работе</div></div>' +
            '<div class="kpi-card"><div style="font-size:24px;">✅</div><div class="kpi-value" style="color:var(--success);">' + completed + '</div><div class="kpi-label">Завершено</div></div>' +
            '<div class="kpi-card"><div style="font-size:24px;">⚠️</div><div class="kpi-value" style="color:var(--danger);">' + overdue + '</div><div class="kpi-label">Просрочено</div></div>' +
            '</div><div style="display:flex;flex-wrap:wrap;gap:16px;">';

        for (var i = 0; i < projects.length; i++) {
            var p = projects[i];
            var axes = axesMap[p.id] || [];
            var totalAxes = axes.length;
            var completedAxes = axes.filter(function(a) { return a.status === 'completed'; }).length;
            var avgProgress = totalAxes > 0 ? Math.round(axes.reduce(function(s, a) { return s + (a.progress || 0); }, 0) / totalAxes) : 0;
            var issuesCount = issuesMap[p.id] || 0;
            var isOverdue = p.end_date_contract && new Date(p.end_date_contract) < new Date() && completedAxes < totalAxes;
            var barColor = completedAxes === totalAxes && totalAxes > 0 ? 'green' : isOverdue ? 'red' : avgProgress >= 50 ? 'blue' : 'yellow';

            html += '<div class="card" style="flex:1;min-width:300px;cursor:pointer;" onclick="window.loadObjectDetail(\'' + p.id + '\')">' +
                '<div style="display:flex;justify-content:space-between;align-items:start;">' +
                '<h2 style="margin:0;">' + escapeHtml(p.name) + '</h2>' +
                (isOverdue ? '<span class="tag tag-red">⚠️ Просрочен</span>' : completedAxes === totalAxes && totalAxes > 0 ? '<span class="tag tag-green">✅ Завершён</span>' : '<span class="tag tag-blue">🔵 В работе</span>') +
                '</div>' +
                '<p style="font-size:13px;color:var(--text-secondary);margin-top:4px;">📍 ' + escapeHtml(p.address || '—') + '</p>' +
                '<div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;">' +
                '<div><span style="color:var(--text-secondary);">Осей:</span> <b>' + totalAxes + '</b></div>' +
                '<div><span style="color:var(--text-secondary);">Проблем:</span> <b style="color:' + (issuesCount > 0 ? 'var(--danger)' : 'var(--text-secondary)') + ';">' + issuesCount + '</b></div>' +
                '<div><span style="color:var(--text-secondary);">Начало:</span> <b>' + formatDate(p.start_date) + '</b></div>' +
                '<div><span style="color:var(--text-secondary);">Конец:</span> <b>' + formatDate(p.end_date_contract) + '</b></div>' +
                '</div>' +
                (totalAxes > 0 ? '<div style="margin-top:12px;"><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;"><span>Прогресс</span><span>' + avgProgress + '%</span></div><div class="gantt-bar-wrap"><div class="gantt-bar ' + barColor + '" style="width:' + avgProgress + '%;">' + (avgProgress > 10 ? avgProgress + '%' : '') + '</div></div></div>' : '') +
                '</div>';
        }
        html += '</div>';
        container.innerHTML = html;
    }

    }

    function renderFilteredTasks(allTasks) {
        var filtered = allTasks;

        if (tasksFilter.status === 'pending') filtered = filtered.filter(function(t) { return t.status === 'pending'; });
        else if (tasksFilter.status === 'in_progress') filtered = filtered.filter(function(t) { return t.status === 'in_progress'; });
        else if (tasksFilter.status === 'completed') filtered = filtered.filter(function(t) { return t.status === 'completed'; });
        else if (tasksFilter.status === 'overdue') filtered = filtered.filter(function(t) { return t.deadline && new Date(t.deadline) < new Date() && t.status !== 'completed'; });

        if (tasksFilter.priority !== 'all') filtered = filtered.filter(function(t) { return t.priority === tasksFilter.priority; });
        if (tasksFilter.project !== 'all') filtered = filtered.filter(function(t) { return t.projects && t.projects.name === tasksFilter.project; });

        var container = document.getElementById('tasks-list-container');
        if (!container) return;

        if (!filtered.length) {
            container.innerHTML = '<div class="card"><p style="text-align:center;color:var(--text-secondary);padding:20px;">Нет задач</p></div>';
            return;
        }

        var html = '<div class="task-card-grid">';
        filtered.forEach(function(t) {
            var pc = t.priority === 'high' ? '🔴' : t.priority === 'medium' ? '🟡' : '🟢';
            var sc = t.status === 'completed' ? 'tag-green' : t.status === 'in_progress' ? 'tag-blue' : 'tag-yellow';
            var sl = t.status === 'completed' ? '✅' : t.status === 'in_progress' ? '🔵' : '⏳';
            var isOverdue = t.deadline && new Date(t.deadline) < new Date() && t.status !== 'completed';

            html += '<div class="task-card-item ' + (isOverdue ? 'overdue' : '') + '" onclick="window.viewTaskDetail(\'' + t.id + '\')">' +
                '<div style="display:flex;justify-content:space-between;align-items:center;">' +
                '<span class="task-priority">' + pc + '</span>' +
                '<span class="tag ' + sc + '">' + sl + ' ' + (t.status === 'completed' ? 'Сделано' : t.status === 'in_progress' ? 'В работе' : 'Ожидает') + '</span>' +
                '</div>' +
                '<div class="task-name">' + escapeHtml(t.title) + '</div>' +
                '<div class="task-info"><span>🏗️ ' + escapeHtml(t.projects && t.projects.name ? t.projects.name : '—') + '</span>' +
                (t.responsible_names && t.responsible_names.length ? '<span>👤 ' + t.responsible_names.slice(0, 2).join(', ') + (t.responsible_names.length > 2 ? '...' : '') + '</span>' : '') +
                '</div>' +
                '<div class="task-info"><span>📅 ' + formatDate(t.created_at) + '</span>' +
                (t.deadline ? '<span style="color:' + (isOverdue ? 'var(--danger)' : 'var(--text-secondary)') + ';">⏰ ' + formatDate(t.deadline) + '</span>' : '') +
                '</div></div>';
        });
        html += '</div>';
        container.innerHTML = html;
    }

    var financeFilter = { project: 'all', period: 'month', dateFrom: '', dateTo: '' };

    async function loadFinancesPage(container) {
        var now = new Date();
        var months = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
        var monthLabel = months[now.getMonth()] + ' ' + now.getFullYear();

        var pq = supabase.from('projects').select('id,name').order('name');
        if (currentUser.role !== 'manager') pq = pq.eq('responsible_worker_id', currentUser.id);
        var projectsResult = await pq;
        var allProjects = projectsResult.data || [];

        var incQ = supabase.from('incomes').select('*, projects(name)').order('date', { ascending: false });
        var expQ = supabase.from('expenses').select('*, projects(name)').order('date', { ascending: false });
        var ordQ = supabase.from('work_orders').select('*, projects(name), brigades(name)').order('created_at', { ascending: false });
        var advQ = supabase.from('advances').select('*, projects(name), brigades(name)').order('created_at', { ascending: false });

        if (currentUser.role !== 'manager') {
            var pids = allProjects.map(function(p) { return p.id; });
            if (pids.length) { incQ = incQ.in('project_id', pids); expQ = expQ.in('project_id', pids); ordQ = ordQ.in('project_id', pids); advQ = advQ.in('project_id', pids); }
        }
        if (financeFilter.project !== 'all') {
            incQ = incQ.eq('project_id', financeFilter.project);
            expQ = expQ.eq('project_id', financeFilter.project);
            ordQ = ordQ.eq('project_id', financeFilter.project);
            advQ = advQ.eq('project_id', financeFilter.project);
        }

        var results = await Promise.all([incQ, expQ, ordQ, advQ]);
        var incomes = results[0].data || [];
        var expenses = results[1].data || [];
        var workOrders = results[2].data || [];
        var advances = results[3].data || [];

        var dateFrom, dateTo;
        if (financeFilter.period === 'ytd') {
            dateFrom = new Date(now.getFullYear(), 0, 1).toISOString().split('T')[0];
            dateTo = now.toISOString().split('T')[0];
        } else if (financeFilter.period === 'custom' && financeFilter.dateFrom && financeFilter.dateTo) {
            dateFrom = financeFilter.dateFrom;
            dateTo = financeFilter.dateTo;
        } else {
            dateFrom = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
            dateTo = new Date(now.getFullYear(), now.getMonth() + 1, 0).toISOString().split('T')[0];
        }

        function inRange(d) { return d >= dateFrom && d <= dateTo; }
        function filterData(arr, field) {
            field = field || 'date';
            return arr.filter(function(x) {
                var d = x[field] || (x.created_at ? x.created_at.split('T')[0] : '');
                return inRange(d);
            });
        }

        var fIncomes = filterData(incomes);
        var fExpenses = filterData(expenses);
        var fOrders = filterData(workOrders, 'created_at');
        var fAdvances = filterData(advances, 'created_at');

        var totalIncome = fIncomes.filter(function(i) { return i.status === 'paid'; }).reduce(function(s, i) { return s + (i.amount || 0); }, 0);
        var totalPlanIncome = fIncomes.filter(function(i) { return i.status === 'pending'; }).reduce(function(s, i) { return s + (i.amount || 0); }, 0);
        var totalExpenseAndPayouts = fExpenses.filter(function(e) { return e.payment_status === 'paid'; }).reduce(function(s, e) { return s + (e.amount || 0); }, 0) +
            fOrders.filter(function(o) { return o.payment_status === 'paid'; }).concat(fAdvances.filter(function(a) { return a.status === 'paid'; })).reduce(function(s, x) { return s + (x.amount || x.total_amount || 0); }, 0);

        var weekEnd = new Date(now);
        weekEnd.setDate(now.getDate() + 7);
        var weekEndStr = weekEnd.toISOString().split('T')[0];
        var todayStr = now.toISOString().split('T')[0];

        var weekIncomes = incomes.filter(function(i) { return i.status === 'pending'; });
        var weekExpenses = expenses.filter(function(e) { return e.payment_status === 'pending'; });
        var weekOrders = workOrders.filter(function(o) { return o.payment_status === 'pending'; });
        var weekAdvances = advances.filter(function(a) { return a.status === 'pending'; });

        // План на неделю — строки таблиц
        var weekRowsLeft = '', weekNumL = 0, weekTotalL = 0;

        weekExpenses.forEach(function(e) {
            weekNumL++; weekTotalL += (e.amount || 0);
            var isOverdue = e.planned_payment_date && new Date(e.planned_payment_date) < new Date();

                '<div class="form-group"><label class="form-label" style="font-size:11px;color:var(--text-secondary);">📝 Комментарий</label><textarea id="fin-comment" class="form-input" rows="2" style="font-size:12px;">' + escapeHtml(o.comment || '') + '</textarea></div>' +
                '</div>' +
                '<div class="modal-actions" style="margin-top:16px;">' +
                '<button class="btn btn-outline btn-sm-compact" onclick="window.saveFinanceRecord(\'order\',\'' + id + '\')">💾 Сохранить</button>' +
               ((o.status === 'pending' || o.status === 'pending_foreman') ? '<button class="btn btn-success btn-sm-compact" onclick="window.approveRecord(\'order\',\'' + id + '\')">✅ Утвердить</button>' : '') +
                (o.status === 'approved' && o.payment_status !== 'paid' && currentUser && currentUser.role === 'accountant' ? '<button class="btn btn-primary btn-sm-compact" onclick="window.markAsPaid(\'order\',\'' + id + '\')">💰 Оплатить</button>' : '') +
                ' <button class="btn btn-outline btn-sm-compact" onclick="window.closeFinanceModal()">✕ Закрыть</button></div>';
        } else if (type === 'advance') {
            var advanceResult = await supabase.from('advances').select('*, projects(name), brigades(name)').eq('id', id).single();
            var a = advanceResult.data;
            if (!a) return;
            html = '<h3>💳 Аванс</h3>' +
                '<div class="modal-field"><div class="modal-field-label">👷 Бригада</div><div class="modal-field-value">' + escapeHtml(a.brigades && a.brigades.name ? a.brigades.name : '—') + '</div></div>' +
                '<div class="modal-field"><div class="modal-field-label">🏗️ Объект</div><div class="modal-field-value">' + escapeHtml(a.projects && a.projects.name ? a.projects.name : '—') + '</div></div>' +
                '<div class="modal-field"><div class="modal-field-label">💰 Сумма</div><div class="modal-field-value" style="color:var(--danger);font-size:18px;font-weight:700;">' + formatMoney(a.amount) + '</div></div>' +
                '<div class="modal-field"><div class="modal-field-label">📅 Дата</div><div class="modal-field-value">' + formatDate(a.created_at ? a.created_at.split('T')[0] : '') + '</div></div>' +
                '<div class="modal-field"><div class="modal-field-label">💳 Статус</div><div class="modal-field-value"><span class="tag ' + (a.status === 'paid' ? 'tag-green' : a.status === 'approved' ? 'tag-blue' : 'tag-yellow') + '">' + (a.status === 'paid' ? '💳 Выплачен' : a.status === 'approved' ? '✅ Утверждён' : '⏳ Ожидает') + '</span></div></div>' +
                '<div style="margin-top:16px;padding-top:16px;border-top:2px solid var(--border);">' +
                '<h4 style="margin-bottom:12px;font-size:14px;">📎 Документы</h4>' +
                (a.invoice_file_url ? '<div style="margin-bottom:8px;">📎 Счёт: <a href="' + a.invoice_file_url + '" target="_blank" class="tag tag-blue" style="text-decoration:none;">' + escapeHtml(a.invoice_file_name || 'Просмотреть') + '</a></div>' : '') +
                '<div class="form-group"><label class="form-label" style="font-size:11px;color:var(--text-secondary);">📎 Счёт на оплату</label><input type="file" id="fin-invoice-file" class="form-input" accept=".pdf,.jpg,.jpeg,.png" style="font-size:12px;"></div>' +
                '<div class="form-group"><label class="form-label" style="font-size:11px;color:var(--text-secondary);">📝 Комментарий</label><textarea id="fin-comment" class="form-input" rows="2" style="font-size:12px;">' + escapeHtml(a.comment || '') + '</textarea></div>' +
                '</div>' +
                '<div class="modal-actions" style="margin-top:16px;">' +
                '<button class="btn btn-outline btn-sm-compact" onclick="window.saveFinanceRecord(\'advance\',\'' + id + '\')">💾 Сохранить</button>' +
                (a.status === 'pending' ? '<button class="btn btn-success btn-sm-compact" onclick="window.approveRecord(\'advance\',\'' + id + '\')">✅ Утвердить</button>' : '') +
                (a.status === 'approved' && currentUser && currentUser.role === 'accountant' ? '<button class="btn btn-primary btn-sm-compact" onclick="window.markAsPaid(\'advance\',\'' + id + '\')">💰 Выплатить</button>' : '') +
                ' <button class="btn btn-outline btn-sm-compact" onclick="window.closeFinanceModal()">✕ Закрыть</button></div>';
        } else if (type === 'income') {
            var incomeResult = await supabase.from('incomes').select('*, projects(name)').eq('id', id).single();
            var i = incomeResult.data;
            if (!i) return;
            html = '<h3>📥 Поступление</h3>' +
                '<div class="modal-field"><div class="modal-field-label">🏗️ Объект</div><div class="modal-field-value">' + escapeHtml(i.projects && i.projects.name ? i.projects.name : '—') + '</div></div>' +
                '<div class="modal-field"><div class="modal-field-label">💰 Сумма</div><div class="modal-field-value" style="color:var(--success);font-size:18px;font-weight:700;">' + formatMoney(i.amount) + '</div></div>' +
                '<div class="modal-field"><div class="modal-field-label">📅 Дата</div><div class="modal-field-value">' + formatDate(i.date) + '</div></div>' +
                '<div class="modal-field"><div class="modal-field-label">💳 Статус</div><div class="modal-field-value"><span class="tag ' + (i.status === 'paid' ? 'tag-green' : 'tag-yellow') + '">' + (i.status === 'paid' ? '💳 Оплачен' : '⏳ Ожидает') + '</span></div></div>' +
                '<div class="modal-actions" style="margin-top:16px;">' +
                (i.status === 'pending' && currentUser && currentUser.role === 'accountant' ? '<button class="btn btn-primary btn-sm-compact" onclick="window.markAsPaid(\'income\',\'' + id + '\')">💰 Оплатить</button>' : '') +
                ' <button class="btn btn-outline btn-sm-compact" onclick="window.closeFinanceModal()">✕ Закрыть</button></div>';
        }

        card.innerHTML = html;
        overlay.classList.remove('hidden');
    };

    window.closeFinanceModal = function() {
        var modal = document.getElementById('finance-modal-overlay');
        if (modal) modal.classList.add('hidden');
    };

                   window.approveRecord = async function(type, id) {
        if (!confirm('✅ Утвердить? Запись уйдёт в "Утверждённые" и будет ждать оплаты бухгалтером.')) return;
        var now = new Date().toISOString();
        var userId = currentUser ? currentUser.id : null;
        
        if (type === 'expense') {
            await supabase.from('expenses').update({ 
                payment_status: 'approved', 
                sent_to_accountant: true,
                approved_by: userId, 
                approved_at: now 
            }).eq('id', id);
        } else if (type === 'order') {
            // Для нарядов: status = 'approved'
            await supabase.from('work_orders').update({ 
                status: 'approved',
                approved_by: userId, 
                approved_at: now 
            }).eq('id', id);
        } else if (type === 'advance') {
            await supabase.from('advances').update({ 
                status: 'approved',
                approved_by: userId, 
                approved_at: now 
            }).eq('id', id);
        }
        
        window.closeFinanceModal();
        window.loadPage('finances');
    };
            window.saveFinanceRecord = async function(type, id) {
        var invoiceFileInput = document.getElementById('fin-invoice-file');
        var avrFileInput = document.getElementById('fin-avr-file');
        var billFileInput = document.getElementById('fin-bill-file');
        var commentEl = document.getElementById('fin-comment');
        var updateData = {};
        
        if (commentEl) updateData.comment = commentEl.value;
        
        // Загрузка счёта-фактуры
        if (invoiceFileInput && invoiceFileInput.files[0]) {
            var file = invoiceFileInput.files[0];
            var cleanName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
            var fileName = 'invoices/' + Date.now() + '_' + cleanName;
            var uploadResult = await supabase.storage.from('reports').upload(fileName, file);
            if (!uploadResult.error) {
                var urlResult = supabase.storage.from('reports').getPublicUrl(fileName);
                updateData.invoice_file_url = urlResult.data.publicUrl;
                updateData.invoice_file_name = file.name;
            }
        }
        
        // Загрузка АВР (для нарядов)
        if (avrFileInput && avrFileInput.files[0]) {
            var avrFile = avrFileInput.files[0];
            var avrCleanName = avrFile.name.replace(/[^a-zA-Z0-9._-]/g, '_');
            var avrFileName = 'avr/' + Date.now() + '_' + avrCleanName;
            var avrUploadResult = await supabase.storage.from('reports').upload(avrFileName, avrFile);
            if (!avrUploadResult.error) {
                var avrUrlResult = supabase.storage.from('reports').getPublicUrl(avrFileName);
                updateData.avr_url = avrUrlResult.data.publicUrl;
            }
        }
        
        // Загрузка счёта на оплату (для нарядов)
        if (billFileInput && billFileInput.files[0]) {
            var billFile = billFileInput.files[0];
            var billCleanName = billFile.name.replace(/[^a-zA-Z0-9._-]/g, '_');
            var billFileName = 'bills/' + Date.now() + '_' + billCleanName;
            var billUploadResult = await supabase.storage.from('reports').upload(billFileName, billFile);
            if (!billUploadResult.error) {
                var billUrlResult = supabase.storage.from('reports').getPublicUrl(billFileName);
                updateData.bill_url = billUrlResult.data.publicUrl;
                updateData.bill_file_name = billFile.name;
            }
        }
        
        if (Object.keys(updateData).length > 0) {
            if (type === 'expense') await supabase.from('expenses').update(updateData).eq('id', id);
            else if (type === 'order') await supabase.from('work_orders').update(updateData).eq('id', id);
            else if (type === 'advance') await supabase.from('advances').update(updateData).eq('id', id);
        }
        
        window.closeFinanceModal();
        window.loadPage('finances');
    };
            window.markAsPaid = async function(type, id) {
        if (!confirm('💰 Отметить как оплаченный?')) return;
        var now = new Date().toISOString().split('T')[0];
        var userName = currentUser ? currentUser.full_name : '';
        
        if (type === 'expense') {
            await supabase.from('expenses').update({ 
                payment_status: 'paid', 
                paid_by_name: userName,
                planned_payment_date: now
            }).eq('id', id);
        } else if (type === 'order') {
            // Для нарядов: payment_status = 'paid'
            await supabase.from('work_orders').update({ 
                payment_status: 'paid',
                payment_date: now
            }).eq('id', id);
        } else if (type === 'advance') {
            await supabase.from('advances').update({ 
                status: 'paid',
                payment_date: now
            }).eq('id', id);
        } else if (type === 'income') {
            await supabase.from('incomes').update({ 
                status: 'paid',
                payment_date: now
            }).eq('id', id);
        }
        
        window.closeFinanceModal();
        window.loadPage('finances');
    };

    window.setFinanceFilter = function(type, value) {
        financeFilter[type] = value;
        if (type === 'period') {
            var customEl = document.getElementById('custom-period');
            if (customEl) {
                if (value === 'custom') { customEl.classList.remove('hidden'); customEl.style.display = 'flex'; }
                else { customEl.classList.add('hidden'); customEl.style.display = 'none'; }
            }
        }
        window.loadPage('finances');
    };

    window.toggleBlock = function(id) {
        var el = document.getElementById(id);
        var arrow = document.getElementById(id.replace('content', 'arrow'));
        if (el && arrow) { el.classList.toggle('hidden'); arrow.textContent = el.classList.contains('hidden') ? '▸' : '▾'; }
    };

    window.generateFinanceReport = function(type) {
        alert('📊 Функция отчётов будет добавлена.\nДанные уже загружены в таблицы выше.');
    };

    checkAuth();
})();
</script>

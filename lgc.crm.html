<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LamGroup CRM</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        
        :root {
            --bg: #F8FAFC; --card: #FFFFFF; --text: #0F172A; --text-secondary: #64748B;
            --border: #E2E8F0; --gold: #F59E0B; --primary: #0F172A; --success: #10B981;
            --danger: #EF4444; --warning: #F59E0B; --info: #3B82F6;
            --sidebar-width: 240px; --header-height: 64px;
            --shadow: 0 4px 16px rgba(0,0,0,0.06); --radius: 12px; --radius-lg: 16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        .auth-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%); display: flex; align-items: center; justify-content: center; z-index: 10000; padding: 20px; }
        .auth-overlay.hidden { display: none; }
        .auth-card { background: white; border-radius: 24px; padding: 40px 36px; text-align: center; max-width: 440px; width: 100%; box-shadow: 0 25px 60px rgba(0,0,0,0.3); }
        .auth-card .logo { font-size: 40px; margin-bottom: 4px; }
        .auth-card h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
        .auth-card .subtitle { font-size: 12px; color: var(--text-secondary); margin-bottom: 24px; }
        .form-group { margin-bottom: 14px; text-align: left; }
        .form-group label { display: block; font-size: 11px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 14px; font-family: inherit; text-align: center; }
        .form-input:focus { outline: none; border-color: var(--gold); }
        .btn { padding: 12px 20px; border-radius: 12px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; width: 100%; transition: all 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-telegram { background: linear-gradient(135deg, #2AABEE, #229ED9); color: white; }
        .btn-qr { background: #F1F5F9; color: var(--text); }
        .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: var(--text-secondary); font-size: 12px; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
        .auth-error { color: var(--danger); font-size: 12px; margin-top: 8px; display: none; }
        .qr-popup { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 10001; align-items: center; justify-content: center; }
        .qr-popup.show { display: flex; }
        .qr-popup-content { background: white; border-radius: 20px; padding: 30px; text-align: center; }
        .qr-popup-content canvas { margin: 16px auto; }

        .app-layout { display: flex; min-height: 100vh; }
        .app-layout.hidden { display: none; }
        .sidebar { width: var(--sidebar-width); background: white; border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; }
        .sidebar-logo { padding: 20px 24px; font-weight: 800; font-size: 17px; border-bottom: 1px solid var(--border); }
        .sidebar-nav { flex: 1; padding: 12px 8px; }
        .sidebar-nav a { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 10px; text-decoration: none; color: var(--text-secondary); font-size: 13px; font-weight: 500; margin-bottom: 2px; }
        .sidebar-nav a:hover, .sidebar-nav a.active { background: #F1F5F9; color: var(--text); font-weight: 600; }
        .sidebar-user { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; font-size: 13px; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; }
        .main-content { flex: 1; margin-left: var(--sidebar-width); }
        .page-header { background: white; border-bottom: 1px solid var(--border); padding: 0 32px; height: var(--header-height); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
        .page-body { padding: 24px 32px; }
        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .kpi-card { background: white; border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow); }
        .kpi-value { font-size: 26px; font-weight: 800; }
        .kpi-label { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; margin-top: 4px; }
        .card { background: white; border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow); margin-bottom: 24px; }
        .card h2 { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #F8FAFC; padding: 10px 12px; text-align: left; font-weight: 600; font-size: 11px; color: var(--text-secondary); text-transform: uppercase; border-bottom: 2px solid var(--border); }
        td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
        .gantt-bar-wrap { background: #F1F5F9; border-radius: 6px; height: 22px; overflow: hidden; }
        .gantt-bar { height: 100%; border-radius: 6px; display: flex; align-items: center; padding-left: 8px; font-size: 10px; font-weight: 600; color: white; }
        .gantt-bar.green { background: #10B981; } .gantt-bar.yellow { background: #F59E0B; } .gantt-bar.red { background: #EF4444; } .gantt-bar.blue { background: #3B82F6; }
        .tag { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .tag-green { background: #D1FAE5; color: #065F46; } .tag-yellow { background: #FEF3C7; color: #92400E; } .tag-red { background: #FEE2E2; color: #991B1B; } .tag-blue { background: #DBEAFE; color: #1E40AF; }
        .hidden { display: none !important; }
        .text-success { color: var(--success); } .text-danger { color: var(--danger); } .text-warning { color: var(--warning); }
        .table-wrap { overflow-x: auto; }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; }
            .kpi-grid { grid-template-columns: repeat(2, 1fr); }
            .page-body { padding: 16px; }
            .mobile-menu-btn { display: block !important; }
        }
        .mobile-menu-btn { display: none; background: none; border: none; font-size: 24px; cursor: pointer; }
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 99; }
        .sidebar-overlay.open { display: block; }
                /* ===== УЛУЧШЕННЫЕ КНОПКИ ===== */
        .btn-sm-compact {
            padding: 6px 12px;
            font-size: 11px;
            border-radius: 8px;
            font-weight: 500;
            width: auto;
            min-width: auto;
        }
        .btn-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .btn-group .btn {
            width: auto;
            flex: 0 0 auto;
        }

        /* ===== УЛУЧШЕННЫЕ КАРТОЧКИ ЗАДАЧ ===== */
        .task-card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 12px;
        }
        .task-card-item {
            background: white;
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
        }
        .task-card-item:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            transform: translateY(-1px);
        }
        .task-card-item.overdue {
            border-left: 4px solid var(--danger);
        }
        .task-card-item .task-priority {
            font-size: 16px;
        }
        .task-card-item .task-name {
            font-weight: 600;
            font-size: 14px;
            margin: 6px 0;
        }
        .task-card-item .task-info {
            font-size: 11px;
            color: var(--text-secondary);
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }
        .task-card-item .task-tags {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        /* ===== КОМПАКТНЫЕ ФОРМЫ ===== */
        .compact-form {
            max-width: 600px;
        }
        .compact-form .form-input {
            padding: 8px 12px;
            font-size: 13px;
        }
        .compact-form .btn {
            width: auto;
            padding: 8px 16px;
            font-size: 13px;
        }

        /* ===== ГРИД ДЛЯ ДЕТАЛЕЙ ЗАДАЧИ ===== */
        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        @media (max-width: 768px) {
            .detail-grid {
                grid-template-columns: 1fr;
            }
            .task-card-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="auth-overlay" id="auth-overlay">
        <div class="auth-card">
            <div class="logo">🏗️</div>
            <h1>LamGroup CRM</h1>
            <p class="subtitle">Войдите в систему управления проектами</p>
            <div id="manual-login-form">
                <div class="form-group"><label>📱 Telegram ID</label><input type="text" id="auth-tg-id" class="form-input" placeholder="Например: 531738802"></div>
                <div class="form-group"><label>🔑 Пароль</label><input type="password" id="auth-password" class="form-input" placeholder="Введите пароль"></div>
                <button class="btn btn-primary" onclick="loginWithPassword()">🔐 Войти</button>
                <p class="auth-error" id="auth-error">⛔ Неверный ID или пароль</p>
            </div>
            <div class="divider">или</div>
            <button class="btn btn-telegram" onclick="loginWithTelegram()">🔵 Войти через Telegram</button>
            <button class="btn btn-qr" onclick="showQRCode()" style="margin-top:8px;">📱 Вход по QR-коду</button>
        </div>
    </div>

    <div class="qr-popup" id="qr-popup">
        <div class="qr-popup-content">
            <h3>📱 Вход по QR-коду</h3>
            <p style="font-size:12px;color:var(--text-secondary);">Отсканируйте чтобы открыть CRM в Telegram</p>
            <div id="qr-code"></div>
            <button class="btn btn-primary" onclick="closeQR()">Закрыть</button>
        </div>
    </div>

    <div class="app-layout hidden" id="app-layout">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-logo">🏗️ LamGroup</div>
            <nav class="sidebar-nav">
                <a href="#" class="active" data-page="dashboard">🏠 Дашборд</a>
                <a href="#" data-page="objects">🏗️ Объекты</a>
                <a href="#" data-page="tasks">📋 Задачи</a>
                <a href="#" data-page="finances">💰 Финансы</a>
            </nav>
            <div class="sidebar-user">
                <div class="avatar" id="user-avatar">?</div>
                <div><div style="font-weight:600;" id="user-name">—</div><div style="font-size:11px;color:var(--text-secondary);" id="user-role">—</div></div>
            </div>
        </div>
        <div class="sidebar-overlay" id="sidebar-overlay"></div>
        <div class="main-content">
            <header class="page-header">
                <div style="display:flex;align-items:center;gap:8px;">
                    <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
                    <h1 id="page-title">🏠 Дашборд</h1>
                </div>
                <button class="tag tag-red" id="logout-btn" style="cursor:pointer;border:none;">Выйти</button>
            </header>
            <div class="page-body" id="page-body"></div>
        </div>
    </div>

<script>
(function() {
    const SUPABASE_URL = 'https://owagntywpiymqhbfoxye.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93YWdudHl3cGl5bXFoYmZveHllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzMTg5MDUsImV4cCI6MjA5MTg5NDkwNX0.p-3xAhbFgH5lcGnbBfkcQQFVza_Yc2qoY6VBlhmmFGg';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    let currentUser = null;

    function formatMoney(a) { return (a||0).toLocaleString() + ' ₸'; }
    function escapeHtml(t) { if(!t) return ''; return String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]||c)); }
    function formatDate(d) { if(!d) return '—'; return new Date(d).toLocaleDateString('ru-RU'); }

    // ===== ХЕШИРОВАНИЕ =====
    async function hashPassword(password) {
        const msgBuffer = new TextEncoder().encode(password);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // ===== СЕССИЯ =====
    function saveSession(user) {
        localStorage.setItem('lamgroup_crm_user', JSON.stringify({
            id: user.id, telegram_id: user.telegram_id,
            full_name: user.full_name, role: user.role, phone: user.phone
        }));
    }
    function loadSession() {
        const saved = localStorage.getItem('lamgroup_crm_user');
        if (saved) { try { return JSON.parse(saved); } catch(e) { return null; } }
        return null;
    }
    function clearSession() { localStorage.removeItem('lamgroup_crm_user'); }

    // ===== АВТОРИЗАЦИЯ =====
    async function checkAuth() {
        const savedUser = loadSession();
        if (savedUser?.id) {
            const { data: users } = await supabase.from('users').select('*').eq('id', savedUser.id).single();
            if (users) { currentUser = users; enterApp(); return; }
            clearSession();
        }
        document.getElementById('auth-overlay').classList.remove('hidden');
        document.getElementById('app-layout').classList.add('hidden');
        if (tg?.initDataUnsafe?.user) loginWithTelegram();
    }

    window.loginWithPassword = async function() {
        const tgId = document.getElementById('auth-tg-id').value.trim();
        const password = document.getElementById('auth-password').value.trim();
        if (!tgId || !password) return;
        const { data: users } = await supabase.from('users').select('*').eq('telegram_id', parseInt(tgId));
        if (!users?.length) { document.getElementById('auth-error').style.display = 'block'; return; }
        const user = users[0];
        const hashed = await hashPassword(password);
        if (user.password_hash !== hashed) { document.getElementById('auth-error').style.display = 'block'; return; }
        currentUser = user;
        enterApp();
    };

    window.loginWithTelegram = async function() {
        if (!tg) return;
        const tgUser = tg.initDataUnsafe?.user;
        if (!tgUser) return;
        const { data: users } = await supabase.from('users').select('*').eq('telegram_id', tgUser.id);
        if (!users?.length) { document.getElementById('auth-error').style.display = 'block'; return; }
        currentUser = users[0];
        const fullName = tgUser.first_name + ' ' + (tgUser.last_name || '');
        if (fullName !== currentUser.full_name) {
            await supabase.from('users').update({ full_name: fullName }).eq('id', currentUser.id);
            currentUser.full_name = fullName;
        }
        enterApp();
    };

    window.showQRCode = function() {
        document.getElementById('qr-popup').classList.add('show');
        document.getElementById('qr-code').innerHTML = '';
        new QRCode(document.getElementById('qr-code'), {
            text: 'https://t.me/LGCFASAD_bot/app',
            width: 200, height: 200,
            colorDark: '#0F172A', colorLight: '#FFFFFF'
        });
    };
    window.closeQR = function() { document.getElementById('qr-popup').classList.remove('show'); };

    function enterApp() {
        saveSession(currentUser);
        document.getElementById('auth-overlay').classList.add('hidden');
        document.getElementById('app-layout').classList.remove('hidden');
        document.getElementById('user-avatar').textContent = (currentUser.full_name || '?')[0].toUpperCase();
        document.getElementById('user-name').textContent = currentUser.full_name || '—';
        document.getElementById('user-role').textContent = currentUser.role === 'manager' ? 'Руководитель' : currentUser.role === 'worker' ? 'ИТР' : 'Бухгалтер';
        setupNavigation();
        loadPage('dashboard');
    }

    // ===== НАВИГАЦИЯ =====
    function setupNavigation() {
        document.querySelectorAll('.sidebar-nav a').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                document.querySelectorAll('.sidebar-nav a').forEach(l => l.classList.remove('active'));
                this.classList.add('active');
                loadPage(this.dataset.page);
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('sidebar-overlay').classList.remove('open');
            });
        });
        document.getElementById('mobile-menu-btn')?.addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebar-overlay').classList.toggle('open');
        });
        document.getElementById('sidebar-overlay')?.addEventListener('click', () => {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebar-overlay').classList.remove('open');
        });
        document.getElementById('logout-btn')?.addEventListener('click', () => {
            clearSession(); currentUser = null;
            document.getElementById('auth-overlay').classList.remove('hidden');
            document.getElementById('app-layout').classList.add('hidden');
        });
    }

        window.loadPage = async function(page) {
        const container = document.getElementById('page-body');
        container.innerHTML = '<div style="text-align:center;padding:60px;">Загрузка...</div>';
        document.getElementById('page-title').textContent = { dashboard:'🏠 Дашборд', objects:'🏗️ Объекты', tasks:'📋 Задачи', finances:'💰 Финансы' }[page] || '';
        switch(page) {
           case 'dashboard': await loadMainPage(container); break;
            case 'objects': await loadObjectsPage(container); break;
            case 'tasks': await loadTasksPage(container); break;
            case 'finances': await loadFinancesPage(container); break;
        }
    };

    // ===== ОСНОВНАЯ (РАБОЧИЙ СТОЛ) — ПОЛНАЯ ЗАМЕНА loadDashboard =====

async function loadMainPage(container) {
    // Загружаем проекты
    let pq = supabase.from('projects').select('*').order('name');
    if (currentUser.role !== 'manager') pq = pq.eq('responsible_worker_id', currentUser.id);
    const { data: projects } = await pq;
    const allProjects = projects || [];

    // Получаем блоки и оси
    const projectIds = allProjects.map(p => p.id);
    const { data: blocks } = await supabase.from('blocks').select('id, project_id').in('project_id', projectIds);
    const blockIds = (blocks || []).map(b => b.id);
    
    let axesMap = {};
    if (blockIds.length) {
        const { data: axes } = await supabase.from('axes').select('progress, status, block_id').in('block_id', blockIds);
        (axes || []).forEach(ax => {
            const block = blocks.find(b => b.id === ax.block_id);
            if (block) {
                if (!axesMap[block.project_id]) axesMap[block.project_id] = [];
                axesMap[block.project_id].push(ax);
            }
        });
    }

    // Проблемы
    const { data: allIssues } = await supabase.from('project_issues').select('project_id').in('status', ['open', 'in_progress']);
    const issuesMap = {};
    (allIssues || []).forEach(i => { issuesMap[i.project_id] = (issuesMap[i.project_id] || 0) + 1; });

    // Задачи
    const { data: allTasks } = await supabase.from('custom_tasks').select('project_id, status, title, deadline').in('status', ['pending', 'in_progress']).order('created_at', { ascending: false });
    const tasksMap = {};
    (allTasks || []).forEach(t => { tasksMap[t.project_id] = (tasksMap[t.project_id] || 0) + 1; });

    // Задачи в работе и просроченные
    const tasksInProgress = (allTasks || []).filter(t => t.status === 'in_progress').slice(0, 5);
    const tasksOverdue = (allTasks || []).filter(t => t.deadline && new Date(t.deadline) < new Date() && t.status !== 'completed').slice(0, 5);

    // Последние платежи
    const { data: recentIncomes } = await supabase.from('incomes').select('*, projects(name)').order('date', { ascending: false }).limit(5);
    const { data: recentExpenses } = await supabase.from('expenses').select('*, projects(name)').order('date', { ascending: false }).limit(5);

    // План на сегодня
    const todayStr = new Date().toISOString().split('T')[0];
    const todayIncomes = (await supabase.from('incomes').select('*').eq('date', todayStr)).data || [];
    const todayExpenses = (await supabase.from('expenses').select('*').eq('date', todayStr)).data || [];
    const todayOrders = (await supabase.from('work_orders').select('*').eq('payment_date', todayStr)).data || [];

    // Карточки объектов
    let objectCards = '';
    const displayProjects = allProjects.slice(0, 4); // Показываем первые 4
    
    displayProjects.forEach(p => {
        const axes = axesMap[p.id] || [];
        const avgProgress = axes.length > 0 ? Math.round(axes.reduce((s, a) => s + (a.progress || 0), 0) / axes.length) : 0;
        const issues = issuesMap[p.id] || 0;
        const tasks = tasksMap[p.id] || 0;
        const barColor = avgProgress >= 80 ? 'green' : avgProgress >= 50 ? 'blue' : avgProgress >= 20 ? 'yellow' : 'red';

        objectCards += `
            <div class="card" style="flex:1;min-width:200px;text-align:center;cursor:pointer;" onclick="loadObjectDetail('${p.id}')">
                <div style="font-size:32px;margin-bottom:8px;">🏗️</div>
                <div style="font-weight:700;font-size:14px;margin-bottom:4px;">${escapeHtml(p.name)}</div>
                <div class="gantt-bar-wrap" style="margin-bottom:8px;">

            ${allProjects.length > 0 ?

                `<div style="text-align:center;padding:20px;">
                    <p style="color:var(--text-secondary);margin-bottom:12px;">Нет объектов</p>

    // ===== ОБЪЕКТЫ (СПИСОК) =====
    async function loadObjectsPage(container) {
        let q = supabase.from('projects').select('*').order('name');
        if (currentUser.role !== 'manager') q = q.eq('responsible_worker_id', currentUser.id);
        const { data: projects } = await q;
        if (!projects?.length) { container.innerHTML = '<div class="card"><p style="text-align:center;padding:40px;">Нет объектов</p></div>'; return; }

        const projectIds = projects.map(p => p.id);
        const { data: blocks } = await supabase.from('blocks').select('id, project_id').in('project_id', projectIds);
        const blockIds = (blocks || []).map(b => b.id);
        let axesMap = {};
        if (blockIds.length) {
            const { data: axes } = await supabase.from('axes').select('progress, status, block_id').in('block_id', blockIds);
            (axes || []).forEach(ax => {
                const block = blocks.find(b => b.id === ax.block_id);
                if (block) { if (!axesMap[block.project_id]) axesMap[block.project_id] = []; axesMap[block.project_id].push(ax); }
            });
        }
        const { data: allIssues } = await supabase.from('project_issues').select('project_id').in('status', ['open','in_progress']);
        const issuesMap = {};
        (allIssues || []).forEach(i => { issuesMap[i.project_id] = (issuesMap[i.project_id] || 0) + 1; });

        let inProgress = 0, completed = 0, overdue = 0;
        projects.forEach(p => {
            const axes = axesMap[p.id] || [];
            const allDone = axes.length > 0 && axes.every(a => a.status === 'completed');
            if (allDone) completed++;
            else if (axes.some(a => a.status === 'in_progress' || a.progress > 0)) inProgress++;
            if (p.end_date_contract && new Date(p.end_date_contract) < new Date() && !allDone) overdue++;
        });

        let html = '<div class="kpi-grid"><div class="kpi-card"><div style="font-size:24px;">🏗️</div><div class="kpi-value">' + projects.length + '</div><div class="kpi-label">Всего</div></div>';
        html += '<div class="kpi-card"><div style="font-size:24px;">🔵</div><div class="kpi-value" style="color:var(--info);">' + inProgress + '</div><div class="kpi-label">В работе</div></div>';
        html += '<div class="kpi-card"><div style="font-size:24px;">✅</div><div class="kpi-value" style="color:var(--success);">' + completed + '</div><div class="kpi-label">Завершено</div></div>';
        html += '<div class="kpi-card"><div style="font-size:24px;">⚠️</div><div class="kpi-value" style="color:var(--danger);">' + overdue + '</div><div class="kpi-label">Просрочено</div></div></div>';
        html += '<div style="display:flex;flex-wrap:wrap;gap:16px;">';

        for (const p of projects) {
            const axes = axesMap[p.id] || [];
            const totalAxes = axes.length;
            const completedAxes = axes.filter(a => a.status === 'completed').length;
            const avgProgress = totalAxes > 0 ? Math.round(axes.reduce((s, a) => s + (a.progress || 0), 0) / totalAxes) : 0;
            const issuesCount = issuesMap[p.id] || 0;
            const isOverdue = p.end_date_contract && new Date(p.end_date_contract) < new Date() && completedAxes < totalAxes;
            const barColor = completedAxes === totalAxes && totalAxes > 0 ? 'green' : isOverdue ? 'red' : avgProgress >= 50 ? 'blue' : 'yellow';

            html += `<div class="card" style="flex:1;min-width:300px;cursor:pointer;" onclick="loadObjectDetail('${p.id}')">
                <div style="display:flex;justify-content:space-between;align-items:start;">
                    <h2 style="margin:0;">${escapeHtml(p.name)}</h2>
                    ${isOverdue ? '<span class="tag tag-red">⚠️ Просрочен</span>' : completedAxes === totalAxes && totalAxes > 0 ? '<span class="tag tag-green">✅ Завершён</span>' : '<span class="tag tag-blue">🔵 В работе</span>'}
                </div>
                <p style="font-size:13px;color:var(--text-secondary);margin-top:4px;">📍 ${escapeHtml(p.address || '—')}</p>
                <div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;">
                    <div><span style="color:var(--text-secondary);">Осей:</span> <b>${totalAxes}</b></div>
                    <div><span style="color:var(--text-secondary);">Проблем:</span> <b style="color:${issuesCount > 0 ? 'var(--danger)' : 'var(--text-secondary)'};">${issuesCount}</b></div>
                    <div><span style="color:var(--text-secondary);">Начало:</span> <b>${formatDate(p.start_date)}</b></div>
                    <div><span style="color:var(--text-secondary);">Конец:</span> <b>${formatDate(p.end_date_contract)}</b></div>
                </div>
                ${totalAxes > 0 ? `<div style="margin-top:12px;"><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;"><span>Прогресс</span><span>${avgProgress}%</span></div><div class="gantt-bar-wrap"><div class="gantt-bar ${barColor}" style="width:${avgProgress}%;">${avgProgress > 10 ? avgProgress + '%' : ''}</div></div></div>` : ''}
            </div>`;
        }
        html += '</div>';
        container.innerHTML = html;
    }

    // ===== ОБЪЕКТ (ДЕТАЛЬНО) =====
    window.loadObjectDetail = async function(projectId) {
        const container = document.getElementById('page-body');
        container.innerHTML = '<div style="text-align:center;padding:60px;">Загрузка...</div>';
        document.getElementById('page-title').textContent = '🏗️ Загрузка...';

        const { data: project } = await supabase.from('projects').select('*').eq('id', projectId).single();
        if (!project) { container.innerHTML = '<div class="card"><p>Объект не найден</p></div>'; return; }

        const { data: blocks } = await supabase.from('blocks').select('id,name').eq('project_id', projectId);
        const blockIds = (blocks || []).map(b => b.id);
        let axes = [];
        if (blockIds.length) {
            const { data: axesData } = await supabase.from('axes').select('*, blocks(name)').in('block_id', blockIds).order('name');
            axes = axesData || [];
        }

        const axisIds = axes.map(a => a.id);
        let stagesMap = {}, brigadesMap = {};
        if (axisIds.length) {
            const { data: stages } = await supabase.from('axis_work_stages').select('*, brigades(name)').in('axis_id', axisIds).order('sub_axis_name');
            (stages || []).forEach(st => {
                if (!stagesMap[st.axis_id]) stagesMap[st.axis_id] = [];
                stagesMap[st.axis_id].push(st);
                if (st.brigade_id && st.brigades?.name) brigadesMap[st.brigade_id] = st.brigades.name;
            });
        }

        let historyMap = {};
        if (axisIds.length) {
            const { data: history } = await supabase.from('change_history').select('*').eq('entity_type', 'axis').in('entity_id', axisIds).order('changed_at', { ascending: true });
            (history || []).forEach(h => {
                if (!historyMap[h.entity_id]) historyMap[h.entity_id] = [];
                historyMap[h.entity_id].push(h);
            });
        }

        const { data: letters } = await supabase.from('letters').select('*').eq('project_id', projectId).order('created_at', { ascending: false }).limit(10);
        const { data: materials } = await supabase.from('material_incomes').select('*, material_income_items(*)').eq('project_id', projectId).order('created_at', { ascending: false }).limit(10);
        const { data: issues } = await supabase.from('project_issues').select('*').eq('project_id', projectId).in('status', ['open','in_progress']).order('created_at', { ascending: false });

        document.getElementById('page-title').textContent = '🏗️ ' + project.name;

        let ganttRows = '', totalShiftDays = 0;
        axes.forEach((ax, axIndex) => {
            const stages = stagesMap[ax.id] || [];
            const history = historyMap[ax.id] || [];
            const avgProgress = stages.length > 0 ? Math.round(stages.reduce((s, st) => s + (st.progress || 0), 0) / stages.length) : 0;
            const allCompleted = stages.length > 0 && stages.every(s => s.status === 'completed');

                    <br><b>📋 Этапы работ:</b><table style="margin-top:4px;font-size:11px;"><thead><tr><th>Этап</th><th>Начало</th><th>Конец</th><th>Прогресс</th><th>Статус</th><th>Бригада</th></tr></thead><tbody>${stages.length > 0 ? stages.map(st => `<tr><td>${escapeHtml(st.sub_axis_name || st.stage_id || '—')}</td><td>${formatDate(st.plan_start)}</td><td>${formatDate(st.plan_end)}</td><td><div class="gantt-bar-wrap" style="width:80px;display:inline-block;"><div class="gantt-bar ${(st.progress||0) >= 100 ? 'green' : (st.progress||0) >= 50 ? 'blue' : 'yellow'}" style="width:${st.progress||0}%;">${st.progress||0}%</div></div></td><td><span class="tag ${st.status==='completed'?'tag-green':st.status==='in_progress'?'tag-blue':'tag-yellow'}">${st.status==='completed'?'✅':st.status==='in_progress'?'🔵':'⏳'}</span></td><td>${escapeHtml(st.brigades?.name||'—')}</td></tr>`).join('') : '<tr><td colspan="6">Нет этапов</td></tr>'}</tbody></table></div></td></tr>`;

            </div>
            <div class="card"><h2>📊 ГПР</h2><div class="table-wrap"><table><thead><tr><th>Ось</th><th>Начало</th><th>Конец</th><th>Прогресс</th><th>Этапы</th><th>Сдвиг</th><th></th></tr></thead><tbody>${ganttRows || '<tr><td colspan="7">Нет осей</td></tr>'}</tbody></table></div></div>
            ${issuesHtml ? `<div class="card"><h2>⚠️ Проблемы (${(issues||[]).length})</h2><div class="table-wrap"><table><thead><tr><th>Статус</th><th>Название</th><th>Описание</th><th>Дата</th></tr></thead><tbody>${issuesHtml}</tbody></table></div></div>` : ''}
            ${lettersHtml ? `<div class="card"><h2>✉️ Письма (${(letters||[]).length})</h2><div class="table-wrap"><table><thead><tr><th>Номер</th><th>Дата</th><th>Причина</th><th>Сдвиг</th><th>Статус</th></tr></thead><tbody>${lettersHtml}</tbody></table></div></div>` : ''}
            ${materialsHtml ? `<div class="card"><h2>📦 Материалы</h2><div class="table-wrap"><table><thead><tr><th>Дата</th><th>Наименование</th><th>Кол-во</th><th>Сумма</th></tr></thead><tbody>${materialsHtml}</tbody></table></div></div>` : ''}`;

    window.toggleAxisDetail = function(axisId) {
        const row = document.getElementById(axisId);
        const arrow = document.getElementById(axisId + '-arrow');
        if (row && arrow) { row.classList.toggle('hidden'); arrow.textContent = row.classList.contains('hidden') ? '▸' : '▾'; }

    // ===== ЗАДАЧИ (ПОЛНАЯ ЗАМЕНА) =====

let tasksFilter = { status: 'all', priority: 'all', project: 'all' };

async function loadTasksPage(container) {
    let q = supabase.from('custom_tasks').select('*, projects(name)').order('created_at', { ascending: false }).limit(100);
    if (currentUser.role !== 'manager') q = q.or(`created_by.eq.${currentUser.id},responsible_ids.cs.{${currentUser.id}}`);

    const { data: tasks } = await q;
    const allTasks = tasks || [];

    // KPI
    const pendingCount = allTasks.filter(t => t.status === 'pending').length;
    const inProgressCount = allTasks.filter(t => t.status === 'in_progress').length;
    const completedCount = allTasks.filter(t => t.status === 'completed').length;
    const overdueCount = allTasks.filter(t => t.deadline && new Date(t.deadline) < new Date() && t.status !== 'completed').length;

    // Уникальные объекты для фильтра
    const projectSet = new Set();
    allTasks.forEach(t => { if (t.projects?.name) projectSet.add(t.projects.name); });
    const projectOptions = ['<option value="all">Все объекты</option>'];
    projectSet.forEach(name => { projectOptions.push(`<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`); });

    container.innerHTML = `
        <!-- KPI КЛИКАБЕЛЬНЫЕ -->
        <div class="kpi-grid" style="margin-bottom:16px;">
            <div class="kpi-card" style="cursor:pointer;" onclick="setTaskFilter('status','pending')">
                <div style="font-size:24px;">⏳</div>
                <div class="kpi-value" style="color:var(--warning);">${pendingCount}</div>
                <div class="kpi-label">Ожидают</div>
            </div>
            <div class="kpi-card" style="cursor:pointer;" onclick="setTaskFilter('status','in_progress')">
                <div style="font-size:24px;">🔵</div>
                <div class="kpi-value" style="color:var(--info);">${inProgressCount}</div>
                <div class="kpi-label">В работе</div>
            </div>
            <div class="kpi-card" style="cursor:pointer;" onclick="setTaskFilter('status','completed')">
                <div style="font-size:24px;">✅</div>
                <div class="kpi-value" style="color:var(--success);">${completedCount}</div>
                <div class="kpi-label">Готово</div>
            </div>
            <div class="kpi-card" style="cursor:pointer;" onclick="setTaskFilter('status','overdue')">
                <div style="font-size:24px;">⚠️</div>
                <div class="kpi-value" style="color:var(--danger);">${overdueCount}</div>
                <div class="kpi-label">Просрочено</div>
            </div>
        </div>

        <!-- ФИЛЬТРЫ -->
        <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
            <select id="task-filter-status" class="form-input" style="flex:1;min-width:120px;padding:8px;" onchange="setTaskFilter('status', this.value)">
                <option value="all">Все статусы</option>
                <option value="pending">⏳ Ожидают</option>
                <option value="in_progress">🔵 В работе</option>
                <option value="completed">✅ Готово</option>
                <option value="overdue">⚠️ Просрочено</option>
            </select>
            <select id="task-filter-project" class="form-input" style="flex:1;min-width:140px;padding:8px;" onchange="setTaskFilter('project', this.value)">
                ${projectOptions.join('')}
            </select>
            <select id="task-filter-priority" class="form-input" style="flex:1;min-width:120px;padding:8px;" onchange="setTaskFilter('priority', this.value)">
                <option value="all">Все приоритеты</option>
                <option value="high">🔴 Высокий</option>
                <option value="medium">🟡 Средний</option>
                <option value="low">🟢 Низкий</option>
            </select>
        </div>

        <!-- КНОПКА СОЗДАТЬ -->
        <button class="btn btn-primary btn-sm-compact" onclick="openCreateTaskForm()" style="margin-bottom:16px;">➕ Создать задачу</button>

        <!-- СПИСОК ЗАДАЧ -->
        <div id="tasks-list-container"></div>
    `;

    renderFilteredTasks(allTasks);
}

function renderFilteredTasks(allTasks) {
    let filtered = allTasks;

    if (tasksFilter.status === 'pending') filtered = filtered.filter(t => t.status === 'pending');
    else if (tasksFilter.status === 'in_progress') filtered = filtered.filter(t => t.status === 'in_progress');
    else if (tasksFilter.status === 'completed') filtered = filtered.filter(t => t.status === 'completed');
    else if (tasksFilter.status === 'overdue') filtered = filtered.filter(t => t.deadline && new Date(t.deadline) < new Date() && t.status !== 'completed');

    if (tasksFilter.priority !== 'all') filtered = filtered.filter(t => t.priority === tasksFilter.priority);
    if (tasksFilter.project !== 'all') filtered = filtered.filter(t => t.projects?.name === tasksFilter.project);

    const container = document.getElementById('tasks-list-container');
    if (!container) return;

    if (!filtered.length) {
        container.innerHTML = '<div class="card"><p style="text-align:center;color:var(--text-secondary);padding:20px;">Нет задач</p></div>';
        return;
    }

    let html = '<div class="task-card-grid">';
    filtered.forEach(t => {
        const pc = t.priority === 'high' ? '🔴' : t.priority === 'medium' ? '🟡' : '🟢';
        const sc = t.status === 'completed' ? 'tag-green' : t.status === 'in_progress' ? 'tag-blue' : 'tag-yellow';
        const sl = t.status === 'completed' ? '✅' : t.status === 'in_progress' ? '🔵' : '⏳';
        const isOverdue = t.deadline && new Date(t.deadline) < new Date() && t.status !== 'completed';

        html += `
            <div class="task-card-item ${isOverdue ? 'overdue' : ''}" onclick="viewTaskDetail('${t.id}')">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <span class="task-priority">${pc}</span>
                    <span class="tag ${sc}">${sl} ${t.status==='completed'?'Сделано':t.status==='in_progress'?'В работе':'Ожидает'}</span>
                </div>
                <div class="task-name">${escapeHtml(t.title)}</div>
                <div class="task-info">
                    <span>🏗️ ${escapeHtml(t.projects?.name || '—')}</span>
                    ${t.responsible_names?.length ? '<span>👤 ' + t.responsible_names.slice(0, 2).join(', ') + (t.responsible_names.length > 2 ? '...' : '') + '</span>' : ''}
                </div>
                <div class="task-info">
                    <span>📅 ${formatDate(t.created_at)}</span>
                    ${t.deadline ? '<span style="color:' + (isOverdue ? 'var(--danger)' : 'var(--text-secondary)') + ';">⏰ ' + formatDate(t.deadline) + '</span>' : ''}
                </div>
            </div>`;
    });
    html += '</div>';
    container.innerHTML = html;
}

window.setTaskFilter = function(type, value) {
    tasksFilter[type] = value;
    // Обновить выпадающие списки
    if (type === 'status') {
        const sel = document.getElementById('task-filter-status');
        if (sel) sel.value = value;
    }
    if (type === 'project') {
        const sel = document.getElementById('task-filter-project');
        if (sel) sel.value = value;
    }
    if (type === 'priority') {
        const sel = document.getElementById('task-filter-priority');
        if (sel) sel.value = value;
    }
    // Перезагрузить список
    loadTasksPage(document.getElementById('page-body'));
};

// ===== СОЗДАНИЕ ЗАДАЧИ =====
window.openCreateTaskForm = async function() {
    const container = document.getElementById('page-body');
    
    const { data: projects } = await supabase.from('projects').select('id,name').order('name');
    const { data: users } = await supabase.from('users').select('id,full_name').order('full_name');

    container.innerHTML = `
        <button onclick="loadPage('tasks')" style="background:none;border:none;cursor:pointer;font-size:14px;margin-bottom:16px;color:var(--text-secondary);">← Назад к задачам</button>
        <div class="card">
            <h2>➕ Новая задача</h2>
            <div class="form-group"><label class="form-label">Название *</label><input type="text" id="ct-title" class="form-input"></div>
            <div class="form-group"><label class="form-label">Описание</label><textarea id="ct-desc" class="form-input" rows="3"></textarea></div>
            <div class="form-group"><label class="form-label">🏗️ Объект</label><select id="ct-project" class="form-input"><option value="">—</option>${(projects||[]).map(p => `<option value="${p.id}">${p.name}</option>`).join('')}</select></div>
            <div class="form-group"><label class="form-label">⚡ Приоритет</label><select id="ct-priority" class="form-input"><option value="low">🟢 Низкий</option><option value="medium" selected>🟡 Средний</option><option value="high">🔴 Высокий</option></select></div>
            <div class="form-group"><label class="form-label">⏰ Дедлайн</label><input type="date" id="ct-deadline" class="form-input"></div>
            <div class="form-group"><label class="form-label">👤 Ответственный</label><select id="ct-responsible" class="form-input">${(users||[]).map(u => `<option value="${u.id}">${u.full_name}</option>`).join('')}</select></div>
            <div class="form-group"><label class="form-label">📎 Файлы</label><input type="file" id="ct-files" class="form-input" multiple></div>
            <div style="display:flex;gap:8px;">
    <button class="btn btn-primary btn-sm-compact" id="save-ct-btn">📤 Создать</button>
    <button class="btn btn-outline btn-sm-compact" onclick="loadPage('tasks')">Отмена</button>
</div>
        </div>
    `;

    document.getElementById('save-ct-btn').addEventListener('click', async () => {
        const title = document.getElementById('ct-title').value.trim();
        if (!title) { alert('Введите название'); return; }
        const respId = document.getElementById('ct-responsible').value;
        const respName = document.getElementById('ct-responsible').selectedOptions[0]?.text || '';
        const files = document.getElementById('ct-files').files || [];
        const fileUrls = [];
        
        for (const file of files) {
            const cleanName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
            const fileName = 'tasks/' + Date.now() + '_' + cleanName;
            const { error: uploadError } = await supabase.storage.from('reports').upload(fileName, file);
            if (!uploadError) {
                const { data: urlData } = supabase.storage.from('reports').getPublicUrl(fileName);
                fileUrls.push({ name: file.name, url: urlData.publicUrl });
            }
        }

        const { error } = await supabase.from('custom_tasks').insert({
            project_id: document.getElementById('ct-project').value || null,
            title,
            description: document.getElementById('ct-desc').value,
            priority: document.getElementById('ct-priority').value,
            deadline: document.getElementById('ct-deadline').value || null,
            responsible_ids: [respId],
            responsible_names: [respName],
            status: 'pending',
            type: 'task',
            created_by: currentUser.id,
            created_by_name: currentUser.full_name,
            created_at: new Date().toISOString(),
            files: fileUrls
        });

        if (error) { alert('Ошибка: ' + error.message); return; }
        loadPage('tasks');
    });
};

// ===== ДЕТАЛИ ЗАДАЧИ =====

        <div style="display:flex;flex-direction:column;gap:12px;">

window.updateTaskField = async function(taskId, field, value) {
    await supabase.from('custom_tasks').update({ [field]: value, updated_at: new Date().toISOString() }).eq('id', taskId);
    viewTaskDetail(taskId);
};

window.updateTaskDeadline = async function(taskId) {
    const deadline = document.getElementById('task-deadline-input')?.value;
 await supabase.from('custom_tasks').update({ deadline: deadline || null, updated_at: new Date().toISOString() }).eq('id', taskId);
viewTaskDetail(taskId);
};

window.addTaskResponsible = async function(taskId, userId) {
    if (!userId) return;
    const { data: task } = await supabase.from('custom_tasks').select('responsible_ids, responsible_names').eq('id', taskId).single();
    if (!task) return;
    const { data: user } = await supabase.from('users').select('full_name').eq('id', userId).single();
    if (!user) return;
    const ids = [...(task.responsible_ids || []), userId];
    const names = [...(task.responsible_names || []), user.full_name];
    await supabase.from('custom_tasks').update({ responsible_ids: ids, responsible_names: names, updated_at: new Date().toISOString() }).eq('id', taskId);
    viewTaskDetail(taskId);
};

window.removeTaskResponsible = async function(taskId, idx) {
    const { data: task } = await supabase.from('custom_tasks').select('responsible_ids, responsible_names').eq('id', taskId).single();
    if (!task) return;
    const ids = (task.responsible_ids || []).filter((_, i) => i !== idx);
    const names = (task.responsible_names || []).filter((_, i) => i !== idx);
    await supabase.from('custom_tasks').update({ responsible_ids: ids, responsible_names: names, updated_at: new Date().toISOString() }).eq('id', taskId);
    viewTaskDetail(taskId);
};

window.addTaskComment = async function(taskId) {
    const textEl = document.getElementById('new-comment-text');
    const fileEl = document.getElementById('new-comment-file');
    const text = textEl?.value?.trim();
    if (!text) { alert('Введите текст комментария'); return; }

    const files = [];
    if (fileEl?.files[0]) {
        const file = fileEl.files[0];
        const cleanName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
        const fileName = 'comments/' + Date.now() + '_' + cleanName;
        const { error: uploadError } = await supabase.storage.from('reports').upload(fileName, file);
        if (!uploadError) {
            const { data: urlData } = supabase.storage.from('reports').getPublicUrl(fileName);
            files.push({ name: file.name, url: urlData.publicUrl });
        }
    }

    await supabase.from('task_comments').insert({
        task_id: taskId,
        author_id: currentUser?.id,
        author_name: currentUser?.full_name || 'Пользователь',
        text: text,
        files: files,
        created_at: new Date().toISOString()
    });

    textEl.value = '';
    if (fileEl) fileEl.value = '';
    viewTaskDetail(taskId);
};

window.deleteTaskAndGoBack = async function(taskId) {
    if (!confirm('⚠️ Удалить задачу? Это нельзя отменить.')) return;
    await supabase.from('custom_tasks').delete().eq('id', taskId);
    loadPage('tasks');
};

let financeFilter = { project: 'all', period: 'month', dateFrom: '', dateTo: '' };

async function loadFinancesPage(container) {
    const now = new Date();
    const months = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    const monthLabel = months[now.getMonth()] + ' ' + now.getFullYear();

    // Загружаем проекты
    let pq = supabase.from('projects').select('id,name').order('name');
    if (currentUser.role !== 'manager') pq = pq.eq('responsible_worker_id', currentUser.id);
    const { data: projects } = await pq;
    const allProjects = projects || [];

    // Загружаем данные
    let incQ = supabase.from('incomes').select('*, projects(name)').order('date', { ascending: false });
    let expQ = supabase.from('expenses').select('*, projects(name)').order('date', { ascending: false });
    let ordQ = supabase.from('work_orders').select('*, projects(name), brigades(name)').order('created_at', { ascending: false });
    let advQ = supabase.from('advances').select('*, projects(name), brigades(name)').order('created_at', { ascending: false });

    if (currentUser.role !== 'manager') {
        const pids = allProjects.map(p => p.id);
        if (pids.length) { incQ = incQ.in('project_id', pids); expQ = expQ.in('project_id', pids); ordQ = ordQ.in('project_id', pids); advQ = advQ.in('project_id', pids); }
    }
    if (financeFilter.project !== 'all') {
        incQ = incQ.eq('project_id', financeFilter.project);
        expQ = expQ.eq('project_id', financeFilter.project);
        ordQ = ordQ.eq('project_id', financeFilter.project);
        advQ = advQ.eq('project_id', financeFilter.project);
    }

    const [incR, expR, ordR, advR] = await Promise.all([incQ, expQ, ordQ, advQ]);
    const incomes = incR.data || [];
    const expenses = expR.data || [];
    const workOrders = ordR.data || [];
    const advances = advR.data || [];

    // Период
    let dateFrom, dateTo;
    if (financeFilter.period === 'ytd') {
        dateFrom = new Date(now.getFullYear(), 0, 1).toISOString().split('T')[0];
        dateTo = now.toISOString().split('T')[0];
    } else if (financeFilter.period === 'custom' && financeFilter.dateFrom && financeFilter.dateTo) {
        dateFrom = financeFilter.dateFrom;
        dateTo = financeFilter.dateTo;
    } else {
        dateFrom = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
        dateTo = new Date(now.getFullYear(), now.getMonth() + 1, 0).toISOString().split('T')[0];
    }

    const inRange = (d) => d >= dateFrom && d <= dateTo;

    const fIncomes = filterData(incomes);

    const fOrders = filterData(workOrders, 'created_at');

        [...fOrders.filter(o => o.payment_status === 'paid'), ...fAdvances.filter(a => a.status === 'paid')].reduce((s, x) => s + (x.amount || x.total_amount || 0), 0);

const weekIncomes = incomes.filter(i => i.status === 'pending');

const weekOrders = workOrders.filter(o => o.payment_status !== 'paid');

                                        let rows = '';
                                        let num = 0;
                                        let total = 0;
                                        
                                        weekIncomes.forEach(i => {
                                            num++;
                                            total += (i.amount || 0);
                                            const isOverdue = i.date && new Date(i.date) < new Date() && i.status === 'pending';
                                            rows += `<tr style="${isOverdue ? 'background:#FEF2F2;' : ''}">
                                                <td>${num}</td>
                                                <td>${escapeHtml(i.income_type || i.description || 'Поступление')}</td>
                                                <td>${escapeHtml(i.projects?.customer_company_name || i.projects?.name || '—')}</td>
                                                <td style="color:${isOverdue ? 'var(--danger)' : 'var(--text-secondary)'};">
                                                    ${formatDate(i.date)}
                                                    ${isOverdue ? ' <span class="tag tag-red">Просрочен</span>' : ''}
                                                </td>
                                                <td class="text-success">+${(i.amount||0).toLocaleString()} ₸</td>
                                            </tr>`;
                                        });
                                        
                                        if (!rows) rows = '<tr><td colspan="5" style="text-align:center;color:var(--text-secondary);">Нет данных</td></tr>';
                                        
                                        return rows + `<tr style="font-weight:700;background:#F8FAFC;"><td colspan="3">ИТОГО: ${num} поступлений</td><td></td><td class="text-success">+${total.toLocaleString()} ₸</td></tr>`;
                                    })()}
                                </tbody>
                            </table>
                        </div>
                    </div>
                    
                </div>
            </div>
        </div>

        <!-- ГРАФИК -->
        <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;" onclick="toggleBlock('chart-content')">
                <h2 style="margin:0;">📊 Приходы и расходы</h2>
                <span id="chart-arrow">▾</span>
            </div>
            <div id="chart-content">
                <canvas id="finance-chart" height="60" style="margin-top:12px;"></canvas>
            </div>
        </div>

        <!-- ПЛАНИРОВАНИЕ ПО ДАТАМ -->
        <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;" onclick="toggleBlock('date-plan-content')">
                <h2 style="margin:0;">📅 Планирование по датам</h2>
                <span id="date-plan-arrow">▾</span>
            </div>
            <div id="date-plan-content">
                <div class="table-wrap" style="margin-top:12px;">
                    <table>
                        <thead><tr><th>Дата</th><th>💰 Приход</th><th>📤 Расход</th><th>👷 Выплаты</th></tr></thead>
                        <tbody>${dateRows || '<tr><td colspan="5">Нет данных</td></tr>'}</tbody>
                        <tfoot style="font-weight:700;background:#F8FAFC;">
                            <tr>
                                <td>ИТОГО</td>
                                <td class="text-success">+${dateSumIncome.toLocaleString()} ₸</td>
                                <td class="text-danger">-${dateSumExpense.toLocaleString()} ₸</td>
                                <td class="text-warning">-${dateSumPayout.toLocaleString()} ₸</td>
                               
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
    

        <!-- ОБЪЕКТЫ -->
        <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;" onclick="toggleBlock('objects-content')">
                <h2 style="margin:0;">🏗️ Объекты</h2>
                <span id="objects-arrow">▾</span>
            </div>
            <div id="objects-content">
                <div class="table-wrap" style="margin-top:12px;">
                    <table>
                        <thead><tr><th>Объект</th><th>💰 Приход</th><th>📤 Расходы</th><th>👷 Выплаты</th><th>Сальдо</th></tr></thead>
                        <tbody>${projectRows || '<tr><td colspan="5">Нет объектов</td></tr>'}</tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ОТЧЁТЫ -->
        <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;" onclick="toggleBlock('reports-content')">
                <h2 style="margin:0;">📊 Отчёты</h2>
                <span id="reports-arrow">▾</span>
            </div>
            <div id="reports-content" style="margin-top:12px;">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                    <button class="btn btn-outline btn-sm-compact" onclick="generateFinanceReport('full')">📊 Полный отчёт</button>
                    <button class="btn btn-outline btn-sm-compact" onclick="generateFinanceReport('income')">📥 По приходу</button>
                    <button class="btn btn-outline btn-sm-compact" onclick="generateFinanceReport('expense')">📤 По расходам</button>
                    <button class="btn btn-outline btn-sm-compact" onclick="generateFinanceReport('payout')">👷 По выплатам</button>
                </div>
            </div>
        </div>
    `;

    // График
    setTimeout(() => {
        const ctx = document.getElementById('finance-chart');
        if (ctx) {
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Приход', 'План поступлений', 'Расходы + Выплаты', 'Чистый поток'],
                    datasets: [{
                        label: 'Сумма (₸)',
                        data: [totalIncome, totalPlanIncome, totalExpenseAndPayouts, totalIncome - totalExpenseAndPayouts],
                        backgroundColor: ['#10B981', '#3B82F6', '#EF4444', '#F59E0B'],
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, ticks: { callback: v => (v/1000000).toFixed(1) + 'M ₸' } } }
                }
            });
        }
    }, 300);
}

// Сворачивание блоков
window.toggleBlock = function(id) {
    const el = document.getElementById(id);
    const arrow = document.getElementById(id.replace('content', 'arrow'));
    if (el && arrow) {
        el.classList.toggle('hidden');
        arrow.textContent = el.classList.contains('hidden') ? '▸' : '▾';
    }
};

window.setFinanceFilter = function(type, value) {
    financeFilter[type] = value;
    if (type === 'period') {
        const customEl = document.getElementById('custom-period');
        if (customEl) {
            customEl.classList.toggle('hidden', value !== 'custom');
            customEl.style.display = value === 'custom' ? 'flex' : 'none';
        }
    }
    loadFinancesPage(document.getElementById('page-body'));
};

window.generateFinanceReport = function(type) {
    const titles = { full: '📊 Полный финансовый отчёт', income: '📥 Отчёт по приходу', expense: '📤 Отчёт по расходам', payout: '👷 Отчёт по выплатам' };
    alert(titles[type] + '\n\nФункция формирования отчёта будет добавлена.\nДанные уже загружены в таблицы выше.');
};


    checkAuth();
})();
</script>
</body>
</html>

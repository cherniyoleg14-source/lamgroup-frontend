<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LamGroup CRM</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F8FAFC; --card: #FFFFFF; --text: #0F172A; --text-secondary: #64748B;
            --border: #E2E8F0; --gold: #F59E0B; --primary: #0F172A; --success: #10B981;
            --danger: #EF4444; --warning: #F59E0B; --info: #3B82F6;
            --sidebar-width: 240px; --header-height: 60px;
            --shadow: 0 4px 16px rgba(0,0,0,0.06); --radius: 12px; --radius-lg: 16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .auth-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%); display: flex; align-items: center; justify-content: center; z-index: 10000; padding: 20px; }
        .auth-overlay.hidden { display: none; }
        .auth-card { background: white; border-radius: 24px; padding: 40px 36px; text-align: center; max-width: 440px; width: 100%; box-shadow: 0 25px 60px rgba(0,0,0,0.3); }
        .auth-card .logo { font-size: 40px; margin-bottom: 4px; }
        .auth-card h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
        .auth-card .subtitle { font-size: 12px; color: var(--text-secondary); margin-bottom: 24px; }
        .form-group { margin-bottom: 14px; text-align: left; }
        .form-group label { display: block; font-size: 11px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-input { width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 14px; font-family: inherit; }
        .form-input:focus { outline: none; border-color: var(--gold); }
        .btn { padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: white; border: 1.5px solid var(--border); }
        .btn-sm { padding: 6px 12px; font-size: 11px; border-radius: 8px; }
        .btn-danger { background: #FEE2E2; color: #991B1B; }
        .btn-success { background: #D1FAE5; color: #065F46; }
        .btn-telegram { background: linear-gradient(135deg, #2AABEE, #229ED9); color: white; width: 100%; }
        .btn-qr { background: #F1F5F9; color: var(--text); width: 100%; }
        .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: var(--text-secondary); font-size: 12px; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
        .auth-error { color: var(--danger); font-size: 12px; margin-top: 8px; display: none; }
        .qr-popup { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 10001; align-items: center; justify-content: center; }
        .qr-popup.show { display: flex; }
        .qr-popup-content { background: white; border-radius: 20px; padding: 30px; text-align: center; }

        .app-layout { display: flex; min-height: 100vh; }
        .app-layout.hidden { display: none; }
        .sidebar { width: var(--sidebar-width); background: white; border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; }
        .sidebar-logo { padding: 16px 20px; font-weight: 800; font-size: 16px; border-bottom: 1px solid var(--border); }
        .sidebar-nav { flex: 1; padding: 8px; }
        .sidebar-nav a { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; text-decoration: none; color: var(--text-secondary); font-size: 13px; font-weight: 500; margin-bottom: 2px; }
        .sidebar-nav a:hover, .sidebar-nav a.active { background: #F1F5F9; color: var(--text); font-weight: 600; }
        .sidebar-user { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; font-size: 12px; }
        .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
        .main-content { flex: 1; margin-left: var(--sidebar-width); }
        .page-header { background: white; border-bottom: 1px solid var(--border); padding: 0 24px; height: var(--header-height); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
        .page-header h1 { font-size: 16px; font-weight: 700; }
        .page-body { padding: 20px 24px; max-width: 1200px; }

        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
        .kpi-card { background: white; border-radius: var(--radius-lg); padding: 16px; box-shadow: var(--shadow); }
        .kpi-value { font-size: 24px; font-weight: 800; }
        .kpi-label { font-size: 10px; color: var(--text-secondary); text-transform: uppercase; margin-top: 2px; }
        .card { background: white; border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px; }
        .card h2 { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { background: #F8FAFC; padding: 8px 10px; text-align: left; font-weight: 600; font-size: 10px; color: var(--text-secondary); text-transform: uppercase; border-bottom: 2px solid var(--border); }
        td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
        .gantt-bar-wrap { background: #F1F5F9; border-radius: 6px; height: 20px; overflow: hidden; }
        .gantt-bar { height: 100%; border-radius: 6px; display: flex; align-items: center; padding-left: 8px; font-size: 10px; font-weight: 600; color: white; }
        .gantt-bar.green { background: #10B981; } .gantt-bar.yellow { background: #F59E0B; } .gantt-bar.red { background: #EF4444; } .gantt-bar.blue { background: #3B82F6; }
        .tag { display: inline-block; padding: 3px 8px; border-radius: 20px; font-size: 10px; font-weight: 600; }
        .tag-green { background: #D1FAE5; color: #065F46; } .tag-yellow { background: #FEF3C7; color: #92400E; } .tag-red { background: #FEE2E2; color: #991B1B; } .tag-blue { background: #DBEAFE; color: #1E40AF; }
        .hidden { display: none !important; }
        .text-success { color: var(--success); } .text-danger { color: var(--danger); } .text-warning { color: var(--warning); }
        .table-wrap { overflow-x: auto; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .tabs-row { display: flex; gap: 4px; border-bottom: 2px solid var(--border); margin-bottom: 16px; overflow-x: auto; scrollbar-width: none; }
        .tabs-row .tab-btn { padding: 8px 14px; background: none; border: none; font-size: 12px; font-weight: 600; color: var(--text-secondary); cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; }
        .tabs-row .tab-btn.active { color: var(--text); border-bottom-color: var(--gold); }
        .tab-content { display: none; } .tab-content.active { display: block; }
        .mobile-menu-btn { display: none; background: none; border: none; font-size: 22px; cursor: pointer; }
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 99; }
        .sidebar-overlay.open { display: block; }
        .btn-sm-compact { padding: 6px 12px; font-size: 11px; border-radius: 8px; font-weight: 500; width: auto; min-width: auto; }
        .task-card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
        .task-card-item { background: white; border-radius: var(--radius); padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid var(--border); cursor: pointer; transition: all 0.2s; }
        .task-card-item:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); transform: translateY(-1px); }
        .task-card-item.overdue { border-left: 4px solid var(--danger); }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; }
            .kpi-grid { grid-template-columns: repeat(2, 1fr); }
            .page-body { padding: 12px; }
            .page-header { padding: 0 12px; }
            .grid-2 { grid-template-columns: 1fr; }
            .mobile-menu-btn { display: block !important; }
            .task-card-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="auth-overlay" id="auth-overlay">
    <div class="auth-card">
        <div class="logo">🏗️</div>
        <h1>LamGroup CRM</h1>
        <p class="subtitle">Войдите в систему управления проектами</p>
        <div class="form-group"><label>📱 Telegram ID</label><input type="text" id="auth-tg-id" class="form-input" placeholder="531738802"></div>
        <div class="form-group"><label>🔑 Пароль</label><input type="password" id="auth-password" class="form-input" placeholder="Введите пароль"></div>
        <button class="btn btn-primary" onclick="loginWithPassword()" style="width:100%;">🔐 Войти</button>
        <p class="auth-error" id="auth-error">⛔ Неверный ID или пароль</p>
        <div class="divider">или</div>
        <button class="btn btn-telegram" onclick="loginWithTelegram()">🔵 Войти через Telegram</button>
        <button class="btn btn-qr" onclick="showQRCode()" style="margin-top:8px;">📱 Вход по QR-коду</button>
    </div>
</div>

<div class="qr-popup" id="qr-popup">
    <div class="qr-popup-content"><h3>📱 Вход по QR-коду</h3><div id="qr-code"></div><button class="btn btn-primary" onclick="closeQR()">Закрыть</button></div>
</div>

<div class="app-layout hidden" id="app-layout">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-logo">🏗️ LamGroup</div>
        <nav class="sidebar-nav">
            <a href="#" class="active" data-page="dashboard">🏠 Дашборд</a>
            <a href="#" data-page="objects">🏗️ Объекты</a>
            <a href="#" data-page="tasks">📋 Задачи</a>
            <a href="#" data-page="finances">💰 Финансы</a>
        </nav>
        <div class="sidebar-user">
            <div class="avatar" id="user-avatar">?</div>
            <div><div style="font-weight:600;" id="user-name">—</div><div style="font-size:10px;color:var(--text-secondary);" id="user-role">—</div></div>
        </div>
    </div>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <div class="main-content">
        <header class="page-header">
            <div style="display:flex;align-items:center;gap:8px;"><button class="mobile-menu-btn" id="mobile-menu-btn">☰</button><h1 id="page-title">🏠 Дашборд</h1></div>
            <button class="tag tag-red" id="logout-btn" style="cursor:pointer;border:none;">Выйти</button>
        </header>
        <div class="page-body" id="page-body"></div>
    </div>
</div>

<script>
(function() {
    const SUPABASE_URL = 'https://owagntywpiymqhbfoxye.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93YWdudHl3cGl5bXFoYmZveHllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzMTg5MDUsImV4cCI6MjA5MTg5NDkwNX0.p-3xAhbFgH5lcGnbBfkcQQFVza_Yc2qoY6VBlhmmFGg';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const tg = window.Telegram?.WebApp; if (tg) { tg.ready(); tg.expand(); }
    let currentUser = null;
    let financeFilter = { project: 'all', period: 'month', dateFrom: '', dateTo: '' };

    function formatMoney(a) { return (a||0).toLocaleString() + ' ₸'; }
    function escapeHtml(t) { if(!t) return ''; return String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]||c)); }
    function formatDate(d) { if(!d) return '—'; return new Date(d).toLocaleDateString('ru-RU'); }

    function saveSession(user) { localStorage.setItem('lamgroup_crm_user', JSON.stringify({id:user.id,telegram_id:user.telegram_id,full_name:user.full_name,role:user.role,phone:user.phone})); }
    function loadSession() { try { return JSON.parse(localStorage.getItem('lamgroup_crm_user')); } catch(e) { return null; } }
    function clearSession() { localStorage.removeItem('lamgroup_crm_user'); }

    async function checkAuth() {
        const saved = loadSession();
        if (saved?.id) { const { data: u } = await supabase.from('users').select('*').eq('id', saved.id).single(); if (u) { currentUser = u; enterApp(); return; } clearSession(); }
        document.getElementById('auth-overlay').classList.remove('hidden');
        if (tg?.initDataUnsafe?.user) loginWithTelegram();
    }

    async function hashPassword(p) { const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(p)); return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join(''); }

    window.loginWithPassword = async function() {
        const id = document.getElementById('auth-tg-id').value.trim(), pw = document.getElementById('auth-password').value.trim();
        if (!id || !pw) return;
        const { data: users } = await supabase.from('users').select('*').eq('telegram_id', parseInt(id));
        if (!users?.length) { document.getElementById('auth-error').style.display='block'; return; }
        if (users[0].password_hash !== await hashPassword(pw)) { document.getElementById('auth-error').style.display='block'; return; }
        currentUser = users[0]; enterApp();
    };

    window.loginWithTelegram = async function() {
        const u = tg?.initDataUnsafe?.user; if (!u) return;
        const { data: users } = await supabase.from('users').select('*').eq('telegram_id', u.id);
        if (!users?.length) { document.getElementById('auth-error').style.display='block'; return; }
        currentUser = users[0];
        const fullName = u.first_name + ' ' + (u.last_name || '');
        if (fullName !== currentUser.full_name) { await supabase.from('users').update({ full_name: fullName }).eq('id', currentUser.id); currentUser.full_name = fullName; }
        enterApp();
    };

    window.showQRCode = function() { document.getElementById('qr-popup').classList.add('show'); document.getElementById('qr-code').innerHTML=''; new QRCode(document.getElementById('qr-code'),{text:'https://t.me/LGCFASAD_bot/app',width:200,height:200,colorDark:'#0F172A',colorLight:'#FFFFFF'}); };
    window.closeQR = function() { document.getElementById('qr-popup').classList.remove('show'); };

    function enterApp() {
        saveSession(currentUser);
        document.getElementById('auth-overlay').classList.add('hidden'); document.getElementById('app-layout').classList.remove('hidden');
        document.getElementById('user-avatar').textContent = (currentUser.full_name||'?')[0].toUpperCase();
        document.getElementById('user-name').textContent = currentUser.full_name||'—';
        document.getElementById('user-role').textContent = currentUser.role==='manager'?'Руководитель':currentUser.role==='worker'?'ИТР':'Бухгалтер';
        setupNav(); loadPage('dashboard');
    }

    function setupNav() {
        document.querySelectorAll('.sidebar-nav a[data-page]').forEach(a=>a.addEventListener('click',function(e){e.preventDefault();document.querySelectorAll('.sidebar-nav a').forEach(l=>l.classList.remove('active'));this.classList.add('active');loadPage(this.dataset.page);document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebar-overlay').classList.remove('open');}));
        document.getElementById('mobile-menu-btn').addEventListener('click',()=>{document.getElementById('sidebar').classList.toggle('open');document.getElementById('sidebar-overlay').classList.toggle('open');});
        document.getElementById('sidebar-overlay').addEventListener('click',()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebar-overlay').classList.remove('open');});
        document.getElementById('logout-btn').addEventListener('click',()=>{clearSession();currentUser=null;document.getElementById('auth-overlay').classList.remove('hidden');document.getElementById('app-layout').classList.add('hidden');});
    }

    window.loadPage = function(page) {
        const c = document.getElementById('page-body');
        c.innerHTML = '<div style="text-align:center;padding:60px;">Загрузка...</div>';
        document.getElementById('page-title').textContent = { dashboard:'🏠 Дашборд', objects:'🏗️ Объекты', tasks:'📋 Задачи', finances:'💰 Финансы' }[page]||'';
        switch(page) { case 'dashboard': loadMainPage(c); break; case 'objects': loadObjectsPage(c); break; case 'tasks': loadTasksPage(c); break; case 'finances': loadFinancesPage(c); break; }
    };

    function loadMainPage(c) { c.innerHTML = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;min-height:70vh;"><div class="card" style="display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;min-height:250px;" onclick="window.location.href='lgc.objects.html'"><div style="font-size:48px;margin-bottom:12px;">🏗️</div><h2>ОБЪЕКТЫ</h2><p style="font-size:11px;color:var(--text-secondary);margin-top:4px;">Создание и управление</p></div><div class="card" style="display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;min-height:250px;" onclick="loadPage('finances')"><div style="font-size:48px;margin-bottom:12px;">💰</div><h2>ДВИЖЕНИЕ СРЕДСТВ</h2></div><div class="card" style="display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;min-height:250px;" onclick="loadPage('tasks')"><div style="font-size:48px;margin-bottom:12px;">📋</div><h2>ЗАДАЧИ</h2></div><div class="card" style="display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;min-height:250px;" onclick="loadPage('finances')"><div style="font-size:48px;margin-bottom:12px;">📅</div><h2>ПЛАН ОПЛАТ</h2></div></div>`; }

    // ===== ОБЪЕКТЫ =====
    async function loadObjectsPage(c) {
        let q = supabase.from('projects').select('*').order('name');
        if (currentUser.role !== 'manager') q = q.eq('responsible_worker_id', currentUser.id);
        const { data: projects } = await q;
        if (!projects?.length) { c.innerHTML = '<div class="card"><p style="text-align:center;padding:40px;">Нет объектов</p></div>'; return; }
        const pids = projects.map(p=>p.id);
        const { data: blocks } = await supabase.from('blocks').select('id,project_id').in('project_id',pids);
        const bids = (blocks||[]).map(b=>b.id);
        let axesMap = {};
        if (bids.length) { const { data: axes } = await supabase.from('axes').select('progress,status,block_id').in('block_id',bids); (axes||[]).forEach(ax=>{ const bl = blocks.find(b=>b.id===ax.block_id); if(bl) { if(!axesMap[bl.project_id]) axesMap[bl.project_id]=[]; axesMap[bl.project_id].push(ax); } }); }
        const { data: allIssues } = await supabase.from('project_issues').select('project_id').in('status',['open','in_progress']);
        const issuesMap = {}; (allIssues||[]).forEach(i=>{ issuesMap[i.project_id]=(issuesMap[i.project_id]||0)+1; });
        let html = '<div style="display:flex;flex-direction:column;gap:12px;">';
        for (const p of projects) {
            const axes = axesMap[p.id]||[]; const totalAxes = axes.length; const completedAxes = axes.filter(a=>a.status==='completed').length;
            const avgProgress = totalAxes>0?Math.round(axes.reduce((s,a)=>s+(a.progress||0),0)/totalAxes):0;
            const isOverdue = p.end_date_contract && new Date(p.end_date_contract)<new Date() && completedAxes<totalAxes;
            const barColor = completedAxes===totalAxes&&totalAxes>0?'green':isOverdue?'red':avgProgress>=50?'blue':'yellow';
            html += `<div class="card" style="cursor:pointer;" onclick="loadObjectDetail('${p.id}')"><div style="display:flex;justify-content:space-between;align-items:start;"><h2>🏗️ ${escapeHtml(p.name)}</h2>${isOverdue?'<span class="tag tag-red">⚠️</span>':completedAxes===totalAxes&&totalAxes>0?'<span class="tag tag-green">✅</span>':'<span class="tag tag-blue">🔵</span>'}</div><p style="font-size:13px;color:var(--text-secondary);">📍 ${escapeHtml(p.address||'—')} | 📅 ${formatDate(p.start_date)} — ${formatDate(p.end_date_contract)}</p><div style="margin-top:8px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:11px;"><div>Осей: <b>${totalAxes}</b></div><div>Проблем: <b style="color:${(issuesMap[p.id]||0)>0?'var(--danger)':'var(--text-secondary)'};">${issuesMap[p.id]||0}</b></div><div>Прогресс: <b>${avgProgress}%</b></div></div>${totalAxes>0?`<div class="gantt-bar-wrap" style="margin-top:8px;"><div class="gantt-bar ${barColor}" style="width:${avgProgress}%;">${avgProgress}%</div></div>`:''}</div>`;
        }
        html += '</div>'; c.innerHTML = html;
    }

    window.loadObjectDetail = async function(projectId) {
        const c = document.getElementById('page-body');
        c.innerHTML = '<div style="text-align:center;padding:60px;">Загрузка...</div>';
        document.getElementById('page-title').textContent = '🏗️ Загрузка...';
        const { data: project } = await supabase.from('projects').select('*').eq('id',projectId).single();
        if (!project) { c.innerHTML = '<div class="card"><p>Объект не найден</p></div>'; return; }
        document.getElementById('page-title').textContent = '🏗️ '+project.name;
        renderObjectTabs(c, project);
    };

    function renderObjectTabs(c, project) {

 class="btn btn-primary btn-sm-compact" onclick="openCreateTaskForm()" style="margin-bottom:16px;">➕ Создать задачу</button><div id="tasks-list-container"></div>`;

    function renderFilteredTasks(allTasks) {
        let filtered = allTasks;
        if (tasksFilter.status==='pending') filtered=filtered.filter(t=>t.status==='pending');

        else if (tasksFilter.status==='completed') filtered=filtered.filter(t=>t.status==='completed');
        else if (tasksFilter.status==='overdue') filtered=filtered.filter(t=>t.deadline&&new Date(t.deadline)<new Date()&&t.status!=='completed');
        if (tasksFilter.priority!=='all') filtered=filtered.filter(t=>t.priority===tasksFilter.priority);

    async function loadFinancesPage(c) {
        const now = new Date();
        const months = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
        const monthLabel = months[now.getMonth()] + ' ' + now.getFullYear();
        let pq = supabase.from('projects').select('id,name').order('name');
        if (currentUser.role !== 'manager') pq = pq.eq('responsible_worker_id', currentUser.id);
        const { data: projects } = await pq; const allProjects = projects || [];
        let incQ = supabase.from('incomes').select('*, projects(name, customer_company_name)').order('date', { ascending: false });
        let expQ = supabase.from('expenses').select('*, projects(name)').order('date', { ascending: false });
        let ordQ = supabase.from('work_orders').select('*, projects(name), brigades(name)').order('created_at', { ascending: false });
        let advQ = supabase.from('advances').select('*, projects(name), brigades(name)').order('created_at', { ascending: false });
        if (currentUser.role !== 'manager') { const pids = allProjects.map(p => p.id); if (pids.length) { incQ = incQ.in('project_id', pids); expQ = expQ.in('project_id', pids); ordQ = ordQ.in('project_id', pids); advQ = advQ.in('project_id', pids); } }
        if (financeFilter.project !== 'all') { incQ = incQ.eq('project_id', financeFilter.project); expQ = expQ.eq('project_id', financeFilter.project); ordQ = ordQ.eq('project_id', financeFilter.project); advQ = advQ.eq('project_id', financeFilter.project); }
        const [incR, expR, ordR, advR] = await Promise.all([incQ, expQ, ordQ, advQ]);
        const incomes = incR.data || []; const expenses = expR.data || []; const workOrders = ordR.data || []; const advances = advR.data || [];
        let dateFrom, dateTo;
        if (financeFilter.period === 'ytd') { dateFrom = new Date(now.getFullYear(), 0, 1).toISOString().split('T')[0]; dateTo = now.toISOString().split('T')[0]; }
        else if (financeFilter.period === 'custom' && financeFilter.dateFrom && financeFilter.dateTo) { dateFrom = financeFilter.dateFrom; dateTo = financeFilter.dateTo; }
        else { dateFrom = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0]; dateTo = new Date(now.getFullYear(), now.getMonth() + 1, 0).toISOString().split('T')[0]; }
        const inRange = (d) => d >= dateFrom && d <= dateTo;
        const filterData = (arr, field = 'date') => arr.filter(x => inRange(x[field] || x.created_at?.split('T')[0]));

            if(!document.getElementById('fadv-confirm').checked){alert('Подтвердите');return;}
            const amount=parseFloat(document.getElementById('fadv-amount').value)||0;if(amount<=0){alert('Введите сумму');return;}
            await supabase.from('advances').insert({project_id:document.getElementById('fadv-project').value||null,brigade_id:document.getElementById('fadv-brigade').value||null,amount,created_by:currentUser.id,created_by_name:currentUser.full_name,status:'pending',payment_method:document.getElementById('fadv-method').value,is_urgent:document.getElementById('fadv-urgent').checked,advance_number:an,request_date:new Date().toISOString().split('T')[0]});
            await supabase.from('document_numbers').insert({doc_type:'advance',number:next});
            modal.remove();loadFinancesPage(document.getElementById('page-body'));alert('✅ Аванс создан!');
        };
    };

    checkAuth();
})();
</script>

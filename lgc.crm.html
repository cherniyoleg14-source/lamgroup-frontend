<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LamGroup CRM</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F8FAFC; --card: #FFFFFF; --text: #0F172A; --text-secondary: #64748B;
            --border: #E2E8F0; --gold: #F59E0B; --primary: #0F172A; --success: #10B981;
            --danger: #EF4444; --warning: #F59E0B; --info: #3B82F6;
            --sidebar-width: 240px; --header-height: 64px;
            --shadow: 0 4px 16px rgba(0,0,0,0.06); --radius: 12px; --radius-lg: 16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        /* ===== АВТОРИЗАЦИЯ ===== */
        .auth-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            display: flex; align-items: center; justify-content: center; z-index: 10000; padding: 20px;
        }
        .auth-overlay.hidden { display: none; }
        .auth-card {
            background: white; border-radius: 24px; padding: 40px 36px; text-align: center;
            max-width: 440px; width: 100%; box-shadow: 0 25px 60px rgba(0,0,0,0.3);
        }
        .auth-card .logo { font-size: 40px; margin-bottom: 4px; }
        .auth-card h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
        .auth-card .subtitle { font-size: 12px; color: var(--text-secondary); margin-bottom: 24px; }
        .form-group { margin-bottom: 14px; text-align: left; }
        .form-group label { display: block; font-size: 11px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 14px; font-family: inherit; text-align: center; }
        .form-input:focus { outline: none; border-color: var(--gold); }
        .btn { padding: 12px 20px; border-radius: 12px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; width: 100%; transition: all 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-telegram { background: linear-gradient(135deg, #2AABEE, #229ED9); color: white; }
        .btn-qr { background: #F1F5F9; color: var(--text); }
        .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: var(--text-secondary); font-size: 12px; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
        .auth-error { color: var(--danger); font-size: 12px; margin-top: 8px; display: none; }
        .qr-popup { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 10001; align-items: center; justify-content: center; }
        .qr-popup.show { display: flex; }
        .qr-popup-content { background: white; border-radius: 20px; padding: 30px; text-align: center; }
        .qr-popup-content canvas { margin: 16px auto; }

        /* ===== ЛЕЙАУТ ===== */
        .app-layout { display: flex; min-height: 100vh; }
        .app-layout.hidden { display: none; }
        .sidebar { width: var(--sidebar-width); background: white; border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; }
        .sidebar-logo { padding: 20px 24px; font-weight: 800; font-size: 17px; border-bottom: 1px solid var(--border); }
        .sidebar-nav { flex: 1; padding: 12px 8px; }
        .sidebar-nav a { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 10px; text-decoration: none; color: var(--text-secondary); font-size: 13px; font-weight: 500; margin-bottom: 2px; }
        .sidebar-nav a:hover, .sidebar-nav a.active { background: #F1F5F9; color: var(--text); font-weight: 600; }
        .sidebar-user { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; font-size: 13px; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; }
        .main-content { flex: 1; margin-left: var(--sidebar-width); }
        .page-header { background: white; border-bottom: 1px solid var(--border); padding: 0 32px; height: var(--header-height); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
        .page-body { padding: 24px 32px; }
        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .kpi-card { background: white; border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow); }
        .kpi-value { font-size: 26px; font-weight: 800; }
        .kpi-label { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; margin-top: 4px; }
        .card { background: white; border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow); margin-bottom: 24px; }
        .card h2 { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #F8FAFC; padding: 10px 12px; text-align: left; font-weight: 600; font-size: 11px; color: var(--text-secondary); text-transform: uppercase; border-bottom: 2px solid var(--border); }
        td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
        .gantt-bar-wrap { background: #F1F5F9; border-radius: 6px; height: 22px; overflow: hidden; }
        .gantt-bar { height: 100%; border-radius: 6px; display: flex; align-items: center; padding-left: 8px; font-size: 10px; font-weight: 600; color: white; }
        .gantt-bar.green { background: #10B981; } .gantt-bar.yellow { background: #F59E0B; } .gantt-bar.red { background: #EF4444; } .gantt-bar.blue { background: #3B82F6; }
        .tag { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .tag-green { background: #D1FAE5; color: #065F46; } .tag-yellow { background: #FEF3C7; color: #92400E; } .tag-red { background: #FEE2E2; color: #991B1B; } .tag-blue { background: #DBEAFE; color: #1E40AF; }
        .hidden { display: none !important; }
        .text-success { color: var(--success); } .text-danger { color: var(--danger); } .text-warning { color: var(--warning); }
        .table-wrap { overflow-x: auto; }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; }
            .kpi-grid { grid-template-columns: repeat(2, 1fr); }
            .page-body { padding: 16px; }
            .mobile-menu-btn { display: block !important; }
        }
        .mobile-menu-btn { display: none; background: none; border: none; font-size: 24px; cursor: pointer; }
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 99; }
        .sidebar-overlay.open { display: block; }
    </style>
</head>
<body>

    <!-- АВТОРИЗАЦИЯ -->
    <div class="auth-overlay" id="auth-overlay">
        <div class="auth-card">
            <div class="logo">🏗️</div>
            <h1>LamGroup CRM</h1>
            <p class="subtitle">Войдите в систему управления проектами</p>

            <!-- Форма входа по ID + паролю -->
            <div id="manual-login-form">
                <div class="form-group">
                    <label>📱 Telegram ID</label>
                    <input type="text" id="auth-tg-id" class="form-input" placeholder="Например: 531738802">
                </div>
                <div class="form-group">
                    <label>🔑 Пароль</label>
                    <input type="password" id="auth-password" class="form-input" placeholder="Введите пароль">
                </div>
                <button class="btn btn-primary" onclick="loginWithPassword()">🔐 Войти</button>
                <p class="auth-error" id="auth-error">⛔ Неверный ID или пароль</p>
            </div>

            <div class="divider">или</div>

            <button class="btn btn-telegram" onclick="loginWithTelegram()">🔵 Войти через Telegram</button>
            <button class="btn btn-qr" onclick="showQRCode()" style="margin-top:8px;">📱 Вход по QR-коду</button>
        </div>
    </div>

    <!-- QR-код попап -->
    <div class="qr-popup" id="qr-popup">
        <div class="qr-popup-content">
            <h3>📱 Вход по QR-коду</h3>
            <p style="font-size:12px;color:var(--text-secondary);">Отсканируйте чтобы открыть CRM в Telegram</p>
            <div id="qr-code"></div>
            <button class="btn btn-primary" onclick="closeQR()">Закрыть</button>
        </div>
    </div>

    <!-- ПРИЛОЖЕНИЕ -->
    <div class="app-layout hidden" id="app-layout">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-logo">🏗️ LamGroup</div>
            <nav class="sidebar-nav">
                <a href="#" class="active" data-page="dashboard">🏠 Дашборд</a>
                <a href="#" data-page="objects">🏗️ Объекты</a>
                <a href="#" data-page="tasks">📋 Задачи</a>
                <a href="#" data-page="finances">💰 Финансы</a>
            </nav>
            <div class="sidebar-user">
                <div class="avatar" id="user-avatar">?</div>
                <div><div style="font-weight:600;" id="user-name">—</div><div style="font-size:11px;color:var(--text-secondary);" id="user-role">—</div></div>
            </div>
        </div>
        <div class="sidebar-overlay" id="sidebar-overlay"></div>
        <div class="main-content">
            <header class="page-header">
                <div style="display:flex;align-items:center;gap:8px;">
                    <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
                    <h1 id="page-title">🏠 Дашборд</h1>
                </div>
                <button class="tag tag-red" id="logout-btn" style="cursor:pointer;border:none;">Выйти</button>
            </header>
            <div class="page-body" id="page-body"></div>
        </div>
    </div>

<script>
(function() {
    const SUPABASE_URL = 'https://owagntywpiymqhbfoxye.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93YWdudHl3cGl5bXFoYmZveHllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzMTg5MDUsImV4cCI6MjA5MTg5NDkwNX0.p-3xAhbFgH5lcGnbBfkcQQFVza_Yc2qoY6VBlhmmFGg';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    let currentUser = null;

    function formatMoney(a) { return (a||0).toLocaleString() + ' ₸'; }
    function escapeHtml(t) { if(!t) return ''; return String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]||c)); }
    function formatDate(d) { if(!d) return '—'; return new Date(d).toLocaleDateString('ru-RU'); }
    function showMessage(txt) { alert(txt); }

    // ===== ХЕШИРОВАНИЕ ПАРОЛЯ (простой SHA-256) =====
    async function hashPassword(password) {
        const msgBuffer = new TextEncoder().encode(password);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // ===== ВХОД ПО ПАРОЛЮ =====
    window.loginWithPassword = async function() {
        const tgId = document.getElementById('auth-tg-id').value.trim();
        const password = document.getElementById('auth-password').value.trim();
        
        if (!tgId || !password) { showMessage('Введите ID и пароль'); return; }

        const { data: users, error } = await supabase.from('users').select('*').eq('telegram_id', parseInt(tgId));
        
        if (error || !users?.length) {
            document.getElementById('auth-error').style.display = 'block';
            return;
        }

        const user = users[0];
        const hashed = await hashPassword(password);
        
        if (user.password_hash !== hashed) {
            document.getElementById('auth-error').style.display = 'block';
            return;
        }

        currentUser = user;
        enterApp();
    };

    // ===== ВХОД ЧЕРЕЗ TELEGRAM =====
    window.loginWithTelegram = async function() {
        if (!tg) { showMessage('Откройте в Telegram'); return; }
        
        const tgUser = tg.initDataUnsafe?.user;
        if (!tgUser) { showMessage('Ошибка авторизации Telegram'); return; }

        const { data: users } = await supabase.from('users').select('*').eq('telegram_id', tgUser.id);
        if (!users?.length) {
            document.getElementById('auth-error').style.display = 'block';
            return;
        }

        currentUser = users[0];
        
        // Обновляем имя
        const fullName = tgUser.first_name + ' ' + (tgUser.last_name || '');
        if (fullName !== currentUser.full_name) {
            await supabase.from('users').update({ full_name: fullName }).eq('id', currentUser.id);
            currentUser.full_name = fullName;
        }

        enterApp();
    };

    // ===== QR-КОД =====
    window.showQRCode = function() {
        document.getElementById('qr-popup').classList.add('show');
        document.getElementById('qr-code').innerHTML = '';
        
        const crmUrl = 'https://t.me/LGCFASAD_bot/app';
        new QRCode(document.getElementById('qr-code'), {
            text: crmUrl,
            width: 200,
            height: 200,
            colorDark: '#0F172A',
            colorLight: '#FFFFFF'
        });
    };

    window.closeQR = function() {
        document.getElementById('qr-popup').classList.remove('show');
    };

    // ===== ВХОД В ПРИЛОЖЕНИЕ =====
    function enterApp() {
        document.getElementById('auth-overlay').classList.add('hidden');
        document.getElementById('app-layout').classList.remove('hidden');

        document.getElementById('user-avatar').textContent = (currentUser.full_name || '?')[0].toUpperCase();
        document.getElementById('user-name').textContent = currentUser.full_name || '—';
        document.getElementById('user-role').textContent = currentUser.role === 'manager' ? 'Руководитель' : currentUser.role === 'worker' ? 'ИТР' : 'Бухгалтер';

        setupNavigation();
        loadPage('dashboard');
    }

    // ===== НАВИГАЦИЯ =====
    function setupNavigation() {
        document.querySelectorAll('.sidebar-nav a').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                document.querySelectorAll('.sidebar-nav a').forEach(l => l.classList.remove('active'));
                this.classList.add('active');
                loadPage(this.dataset.page);
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('sidebar-overlay').classList.remove('open');
            });
        });

        document.getElementById('mobile-menu-btn')?.addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebar-overlay').classList.toggle('open');
        });
        document.getElementById('sidebar-overlay')?.addEventListener('click', () => {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebar-overlay').classList.remove('open');
        });
        document.getElementById('logout-btn')?.addEventListener('click', () => {
            currentUser = null;
            document.getElementById('auth-overlay').classList.remove('hidden');
            document.getElementById('app-layout').classList.add('hidden');
        });
    }

    // ===== ЗАГРУЗКА СТРАНИЦ =====
    async function loadPage(page) {
        const container = document.getElementById('page-body');
        container.innerHTML = '<div style="text-align:center;padding:60px;">Загрузка...</div>';
        document.getElementById('page-title').textContent = { dashboard:'🏠 Дашборд', objects:'🏗️ Объекты', tasks:'📋 Задачи', finances:'💰 Финансы' }[page] || '';

        switch(page) {
            case 'dashboard': await loadDashboard(container); break;
            case 'objects': await loadObjectsPage(container); break;
            case 'tasks': await loadTasksPage(container); break;
            case 'finances': await loadFinancesPage(container); break;
        }
    }

    async function loadDashboard(container) {
        const [projRes, tasksRes] = await Promise.all([
            supabase.from('projects').select('*', { count: 'exact' }),
            supabase.from('custom_tasks').select('*', { count: 'exact' }).in('status', ['pending','in_progress'])
        ]);

        const { data: axes } = await supabase.from('axes').select('*, blocks!inner(projects(name))');
        const projectProgress = {};
        (axes || []).forEach(ax => {
            const name = ax.blocks?.projects?.name || 'Без объекта';
            if (!projectProgress[name]) projectProgress[name] = { total: 0, count: 0 };
            projectProgress[name].total += (ax.progress || 0);
            projectProgress[name].count++;
        });
        const labels = Object.keys(projectProgress);
        const data = labels.map(k => Math.round(projectProgress[k].total / projectProgress[k].count));

        container.innerHTML = `
            <div class="kpi-grid">
                <div class="kpi-card"><div style="font-size:24px;">🏗️</div><div class="kpi-value">${projRes.count||0}</div><div class="kpi-label">Объектов</div></div>
                <div class="kpi-card"><div style="font-size:24px;">📋</div><div class="kpi-value">${tasksRes.count||0}</div><div class="kpi-label">Активных задач</div></div>
                <div class="kpi-card"><div style="font-size:24px;">💰</div><div class="kpi-value" style="color:var(--success);">—</div><div class="kpi-label">Поступило</div></div>
                <div class="kpi-card"><div style="font-size:24px;">👷</div><div class="kpi-value">—</div><div class="kpi-label">Бригад</div></div>
            </div>
            <div class="card"><h2>📊 Прогресс по объектам</h2><canvas id="progress-chart" height="80"></canvas></div>`;

        setTimeout(() => {
            const ctx = document.getElementById('progress-chart');
            if (ctx) new Chart(ctx, { type:'bar', data:{ labels, datasets:[{ label:'Прогресс %', data, backgroundColor: data.map(v => v>=80?'#10B981':v>=50?'#F59E0B':'#EF4444'), borderRadius:8 }] }, options:{ responsive:true, plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:true, max:100, ticks:{ callback:v=>v+'%' } } } } });
        }, 300);
    }

    async function loadObjectsPage(container) {
    let q = supabase.from('projects').select('*').order('name');
    if (currentUser.role !== 'manager') q = q.eq('responsible_worker_id', currentUser.id);
    
    const { data: projects } = await q;
    
    if (!projects?.length) {
        container.innerHTML = '<div class="card"><p style="text-align:center;color:var(--text-secondary);padding:40px;">Нет доступных объектов</p></div>';
        return;
    }

    // Получаем блоки и оси для всех проектов
    const projectIds = projects.map(p => p.id);
    const { data: blocks } = await supabase.from('blocks').select('id, project_id').in('project_id', projectIds);
    const blockIds = (blocks || []).map(b => b.id);
    
    let axesMap = {};
    if (blockIds.length) {
        const { data: axes } = await supabase.from('axes').select('progress, status, block_id').in('block_id', blockIds);
        (axes || []).forEach(ax => {
            const block = blocks.find(b => b.id === ax.block_id);
            if (block) {
                if (!axesMap[block.project_id]) axesMap[block.project_id] = [];
                axesMap[block.project_id].push(ax);
            }
        });
    }

    let inProgress = 0, completed = 0, overdue = 0;
    
    projects.forEach(p => {
        const axes = axesMap[p.id] || [];
        const allDone = axes.length > 0 && axes.every(a => a.status === 'completed');
        const anyProgress = axes.some(a => a.status === 'in_progress' || a.progress > 0);
        if (allDone) completed++;
        else if (anyProgress) inProgress++;
        if (p.end_date_contract && new Date(p.end_date_contract) < new Date() && !allDone) overdue++;
    });

    let html = '<div class="kpi-grid"><div class="kpi-card"><div style="font-size:24px;">🏗️</div><div class="kpi-value">' + projects.length + '</div><div class="kpi-label">Всего объектов</div></div>';
    html += '<div class="kpi-card"><div style="font-size:24px;">🔵</div><div class="kpi-value" style="color:var(--info);">' + inProgress + '</div><div class="kpi-label">В работе</div></div>';
    html += '<div class="kpi-card"><div style="font-size:24px;">✅</div><div class="kpi-value" style="color:var(--success);">' + completed + '</div><div class="kpi-label">Завершено</div></div>';
    html += '<div class="kpi-card"><div style="font-size:24px;">⚠️</div><div class="kpi-value" style="color:var(--danger);">' + overdue + '</div><div class="kpi-label">Просрочено</div></div>';
    html += '</div>';
    
    html += '<div style="display:flex;flex-wrap:wrap;gap:16px;">';
    
    for (const p of projects) {
        const axes = axesMap[p.id] || [];
        const totalAxes = axes.length;
        const completedAxes = axes.filter(a => a.status === 'completed').length;
        const avgProgress = totalAxes > 0 ? Math.round(axes.reduce((s, a) => s + (a.progress || 0), 0) / totalAxes) : 0;
        
        const isOverdue = p.end_date_contract && new Date(p.end_date_contract) < new Date() && completedAxes < totalAxes;
        const barColor = completedAxes === totalAxes && totalAxes > 0 ? 'green' : isOverdue ? 'red' : avgProgress >= 50 ? 'blue' : 'yellow';
        
        html += `
            <div class="card" style="flex:1;min-width:300px;cursor:pointer;" onclick="loadObjectDetail('${p.id}')">
                <div style="display:flex;justify-content:space-between;align-items:start;">
                    <h2 style="margin:0;">${escapeHtml(p.name)}</h2>
                    ${isOverdue ? '<span class="tag tag-red">⚠️ Просрочен</span>' : completedAxes === totalAxes && totalAxes > 0 ? '<span class="tag tag-green">✅ Завершён</span>' : '<span class="tag tag-blue">🔵 В работе</span>'}
                </div>
                <p style="font-size:13px;color:var(--text-secondary);margin-top:4px;">📍 ${escapeHtml(p.address || '—')}</p>
                
                <div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;">
                    <div><span style="color:var(--text-secondary);">Осей:</span> <b>${totalAxes}</b></div>
                    <div><span style="color:var(--text-secondary);">Заказчик:</span> <b>${escapeHtml(p.customer_company_name || '—')}</b></div>
                    <div><span style="color:var(--text-secondary);">Начало:</span> <b>${formatDate(p.start_date)}</b></div>
                    <div><span style="color:var(--text-secondary);">Конец:</span> <b>${formatDate(p.end_date_contract)}</b></div>
                </div>
                
                ${totalAxes > 0 ? `
                <div style="margin-top:12px;">
                    <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;">
                        <span style="color:var(--text-secondary);">Прогресс</span><span style="font-weight:600;">${avgProgress}%</span>
                    </div>
                    <div class="gantt-bar-wrap">
                        <div class="gantt-bar ${barColor}" style="width:${avgProgress}%;">${avgProgress > 10 ? avgProgress + '%' : ''}</div>
                    </div>
                </div>` : '<p style="font-size:11px;color:var(--text-secondary);margin-top:8px;">Нет данных по осям</p>'}
            </div>`;
    }
    html += '</div>';
    container.innerHTML = html;
}

    window.loadObjectDetail = async function(projectId) {
         const container = document.getElementById('page-body');
    container.innerHTML = '<div style="text-align:center;padding:60px;">Загрузка...</div>';
    document.getElementById('page-title').textContent = '🏗️ Загрузка...';

    const { data: project } = await supabase.from('projects').select('*').eq('id', projectId).single();
    if (!project) { container.innerHTML = '<div class="card"><p>Объект не найден</p></div>'; return; }

    const { data: blocks } = await supabase.from('blocks').select('id,name').eq('project_id', projectId);
    const blockIds = (blocks || []).map(b => b.id);
    
    let axes = [];
    if (blockIds.length) {
        const { data: axesData } = await supabase.from('axes').select('*, blocks(name), axis_work_stages!inner(progress, status, brigade_id, brigades(name))').in('block_id', blockIds).order('name');
        axes = axesData || [];
    }

    const { data: letters } = await supabase.from('letters').select('*').eq('project_id', projectId).order('created_at', { ascending: false }).limit(5);
    const { data: materials } = await supabase.from('material_incomes').select('*, material_income_items(*)').eq('project_id', projectId).order('created_at', { ascending: false }).limit(10);

    document.getElementById('page-title').textContent = '🏗️ ' + project.name;

    let ganttRows = '';
    const brigadesMap = {};
    
    axes.forEach(ax => {
        const stages = ax.axis_work_stages || [];
        const avgProgress = stages.length > 0 ? Math.round(stages.reduce((s, st) => s + (st.progress || 0), 0) / stages.length) : 0;
        const allCompleted = stages.length > 0 && stages.every(s => s.status === 'completed');
        
        stages.forEach(st => {
            if (st.brigade_id && st.brigades?.name) {
                brigadesMap[st.brigade_id] = st.brigades.name;
            }
        });

        const barClass = allCompleted ? 'green' : avgProgress >= 50 ? 'blue' : 'yellow';
        const statusTag = allCompleted ? '<span class="tag tag-green">✅</span>' : avgProgress >= 50 ? '<span class="tag tag-blue">🔵</span>' : '<span class="tag tag-yellow">⏳</span>';
        
        ganttRows += `
            <tr>
                <td>${statusTag} <b>${escapeHtml(ax.name)}</b></td>
                <td>${formatDate(ax.plan_start)}</td>
                <td>${formatDate(ax.plan_end)}</td>
                <td>
                    <div class="gantt-bar-wrap">
                        <div class="gantt-bar ${barClass}" style="width:${avgProgress}%;">${avgProgress}%</div>
                    </div>
                </td>
                <td>${stages.length} этапов</td>
            </tr>`;
    });

    let brigadesHtml = '';
    Object.entries(brigadesMap).forEach(([id, name]) => {
        brigadesHtml += `<span class="tag tag-blue" style="margin:2px;">👷 ${escapeHtml(name)}</span>`;
    });

    let lettersHtml = '';
    (letters || []).forEach(l => {
        lettersHtml += `
            <tr>
                <td>${l.letter_number_full || '№' + l.letter_number + '/LGC-ERP'}</td>
                <td>${formatDate(l.letter_date)}</td>
                <td>${escapeHtml((l.delay_reason || '').substring(0, 50))}</td>
                <td><span class="tag ${l.status === 'sent_to_customer' ? 'tag-green' : 'tag-yellow'}">${l.status === 'sent_to_customer' ? 'Отправлено' : 'Черновик'}</span></td>
            </tr>`;
    });

    let materialsHtml = '';
    (materials || []).forEach(m => {
        const items = m.material_income_items || [];
        const totalQty = items.reduce((s, i) => s + (i.quantity || 0), 0);
        materialsHtml += `
            <tr>
                <td>${formatDate(m.created_at)}</td>
                <td>${items.map(i => escapeHtml(i.name || '')).join(', ')}</td>
                <td>${totalQty}</td>
                <td>${formatMoney(m.total_amount || 0)}</td>
            </tr>`;
    });

    container.innerHTML = `
        <button onclick="loadPage('objects')" style="background:none;border:none;cursor:pointer;font-size:14px;margin-bottom:16px;color:var(--text-secondary);">← Назад к объектам</button>
        
        <div class="kpi-grid">
            <div class="kpi-card">
                <div style="font-size:24px;">📋</div>
                <div class="kpi-value">${formatMoney(project.contract_price)}</div>
                <div class="kpi-label">Сумма договора</div>
            </div>
            <div class="kpi-card">
                <div style="font-size:24px;">📅</div>
                <div class="kpi-value">${formatDate(project.start_date)} — ${formatDate(project.end_date_contract)}</div>
                <div class="kpi-label">Сроки</div>
            </div>
            <div class="kpi-card">
                <div style="font-size:24px;">👷</div>
                <div class="kpi-value">${Object.keys(brigadesMap).length}</div>
                <div class="kpi-label">Бригад</div>
            </div>
            <div class="kpi-card">
                <div style="font-size:24px;">📍</div>
                <div class="kpi-value">${axes.length}</div>
                <div class="kpi-label">Осей</div>
            </div>
        </div>

        <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                <h2 style="margin:0;">🏗️ ${escapeHtml(project.name)}</h2>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:13px;">
                <div><span style="color:var(--text-secondary);">Адрес:</span> <b>${escapeHtml(project.address || '—')}</b></div>
                <div><span style="color:var(--text-secondary);">Заказчик:</span> <b>${escapeHtml(project.customer_company_name || '—')}</b></div>
                <div><span style="color:var(--text-secondary);">Договор:</span> <b>${escapeHtml(project.contract_number_customer || '—')} ${project.contract_date_customer ? 'от ' + formatDate(project.contract_date_customer) : ''}</b></div>
                <div><span style="color:var(--text-secondary);">Руководитель:</span> <b>${escapeHtml(project.manager_name || '—')}</b></div>
            </div>
            ${Object.keys(brigadesMap).length > 0 ? '<div style="margin-top:12px;"><span style="color:var(--text-secondary);font-size:13px;">Бригады:</span> ' + brigadesHtml + '</div>' : ''}
        </div>

        <div class="card">
            <h2>📊 График производства работ (ГПР)</h2>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Ось</th><th>Начало</th><th>Конец</th><th>Прогресс</th><th>Этапы</th></tr></thead>
                    <tbody>${ganttRows || '<tr><td colspan="5" style="text-align:center;">Нет данных по осям</td></tr>'}</tbody>
                </table>
            </div>
        </div>

        ${lettersHtml ? `
        <div class="card">
            <h2>✉️ Письма заказчику</h2>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Номер</th><th>Дата</th><th>Причина</th><th>Статус</th></tr></thead>
                    <tbody>${lettersHtml}</tbody>
                </table>
            </div>
        </div>` : ''}

        ${materialsHtml ? `
        <div class="card">
            <h2>📦 Материалы</h2>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Дата</th><th>Наименование</th><th>Кол-во</th><th>Сумма</th></tr></thead>
                    <tbody>${materialsHtml}</tbody>
                </table>
            </div>
        </div>` : ''}
    `;
};

    async function loadTasksPage(container) {
        let q = supabase.from('custom_tasks').select('*, projects(name)').order('created_at',{ascending:false}).limit(50);
        if (currentUser.role !== 'manager') q = q.or(`created_by.eq.${currentUser.id},responsible_ids.cs.{${currentUser.id}}`);
        const { data: tasks } = await q;
        if (!tasks?.length) { container.innerHTML = '<div class="card"><p style="text-align:center;">Нет задач</p></div>'; return; }

        let rows = '';
        tasks.forEach(t => {
            const sc = t.status==='completed'?'tag-green':t.status==='in_progress'?'tag-blue':'tag-yellow';
            const sl = t.status==='completed'?'✅ Сделано':t.status==='in_progress'?'🔵 В работе':'⏳ Ожидает';
            rows += `<tr><td>${escapeHtml(t.title)}</td><td>${escapeHtml(t.projects?.name||'—')}</td><td><span class="tag ${sc}">${sl}</span></td><td>${escapeHtml(t.responsible_names?.join(', ')||'—')}</td><td>${formatDate(t.created_at)}</td></tr>`;
        });

        container.innerHTML = `<div class="card"><h2>📋 Задачи</h2><div class="table-wrap"><table><thead><tr><th>Название</th><th>Объект</th><th>Статус</th><th>Ответственные</th><th>Создано</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
    }

    async function loadFinancesPage(container) {
        const { data: incomes } = await supabase.from('incomes').select('*').order('date',{ascending:false}).limit(20);
        const totalIn = (incomes||[]).filter(i=>i.status==='paid').reduce((s,i)=>s+(i.amount||0),0);
        const totalPl = (incomes||[]).filter(i=>i.status==='pending').reduce((s,i)=>s+(i.amount||0),0);

        let rows = '';
        (incomes||[]).forEach(i => {
            rows += `<tr><td>${formatDate(i.date)}</td><td>📥 ${escapeHtml(i.description||'')}</td><td class="${i.status==='paid'?'text-success':'text-warning'}" style="text-align:right;">${formatMoney(i.amount)}</td><td><span class="tag ${i.status==='paid'?'tag-green':'tag-yellow'}">${i.status==='paid'?'Оплачен':'Ожидается'}</span></td></tr>`;
        });

        container.innerHTML = `
            <div class="kpi-grid">
                <div class="kpi-card"><div style="font-size:24px;">💰</div><div class="kpi-value text-success">${formatMoney(totalIn)}</div><div class="kpi-label">Поступило</div></div>
                <div class="kpi-card"><div style="font-size:24px;">📥</div><div class="kpi-value" style="color:var(--info);">${formatMoney(totalPl)}</div><div class="kpi-label">План</div></div>
                <div class="kpi-card"><div style="font-size:24px;">📤</div><div class="kpi-value">—</div><div class="kpi-label">Расходы</div></div>
                <div class="kpi-card"><div style="font-size:24px;">👷</div><div class="kpi-value">—</div><div class="kpi-label">Выплаты</div></div>
            </div>
            <div class="card"><h2>💰 Поступления</h2><div class="table-wrap"><table><thead><tr><th>Дата</th><th>Описание</th><th>Сумма</th><th>Статус</th></tr></thead><tbody>${rows||'<tr><td colspan="4">Нет данных</td></tr>'}</tbody></table></div></div>`;
    }

    // ===== АВТО-ВХОД ЕСЛИ В TELEGRAM =====
    if (tg?.initDataUnsafe?.user) {
        loginWithTelegram();
    }
})();
</script>
